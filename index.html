                  const a    = document.createElement("a");
                  const date = new Date().toISOString().slice(0,10);
                  a.href     = url;
                  a.download = `ClassPulse_${course.name.replace(/[\s.]/g,"_")}_${date}.csv`;
                  document.body.appendChild(a); a.click();
                  document.body.removeChild(a); URL.revokeObjectURL(url);
                }}>
                  <div>
                    <div style={{ fontSize:14, fontWeight:600 }}>{course.name}</div>
                    <div style={{ fontSize:12, color:C.textDim }}>{courseObs.length} Einträge · {course.students.length} Schüler</div>
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:6, color:C.accent, fontSize:13, fontWeight:600 }}>
                    <Icon name="download" size={15} color={C.accent} /> .csv
                  </div>
                </div>
              );
            })}

            {/* Gesamt-Export */}
            <div style={{ ...S.sectionLbl, marginTop:20 }}>Alle Kurse zusammen</div>
            <button style={S.btn("primary")} onClick={() => {
              const lines = ["ClassPulse Export \u2014 " + new Date().toLocaleDateString("de-DE")];
              courses.filter(c => c.criteriaType !== "none").forEach(course => {
                const criteria = getCriteria(course.name);
                lines.push(`\r\n=== ${course.name} ===`);
                lines.push(`Name;${criteria.map(c => c.short).join(";")};HA-Quote;Fehltage;Gesamt`);
                course.students.forEach(st => {
                  const obs = observations.filter(o => o.course === course.name && o.studentId === st.id);
                  const critSummary = criteria.map(crit => {
                    const pos = obs.filter(o => o.criterionId === crit.id && o.rating === "+").length;
                    const neg = obs.filter(o => o.criterionId === crit.id && o.rating === "-").length;
                    return (pos === 0 && neg === 0) ? "-" : `+${pos}/-${neg}`;
                  });
                  let hwTotal = 0, hwDone = 0;
                  Object.entries(homework).forEach(([key, val]) => {
                    if (key.endsWith(`_${course.name}`)) {
                      const status = val[st.id];
                      if (status === undefined) return;  // absent, or not yet in the course
                      hwTotal++;
                      if (status === "done") hwDone++;
                      else if (status === "half") hwDone += 0.5;
                    }
                  });
                  const hwPct = hwTotal > 0 ? `${Math.round((hwDone/hwTotal)*100)}%` : "-";
                  let absentCount = 0;
                  Object.entries(absences).forEach(([key, ids]) => {
                    if (key.endsWith(`_${course.name}`) && ids.includes(st.id)) absentCount++;
                  });
                  lines.push(`"${st.name}";${critSummary.join(";")};${hwPct};${absentCount};${obs.length}`);
                });
              });
              const csv  = "\uFEFF" + lines.join("\r\n");
              const blob = new Blob([csv], { type:"text/csv;charset=utf-8;" });
              const url  = URL.createObjectURL(blob);
              const a    = document.createElement("a");
              const date = new Date().toISOString().slice(0,10);
              a.href     = url;
              a.download = `ClassPulse_Alle_Kurse_${date}.csv`;
              document.body.appendChild(a); a.click();
              document.body.removeChild(a); URL.revokeObjectURL(url);
            }}>
              <span style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
                <Icon name="download" size={16} color="#fff" /> Alle Kurse herunterladen
              </span>
            </button>

            <button style={{ ...S.btn("ghost"), marginTop:8 }} onClick={() => setShowExport(false)}>Schließen</button>
          </div>
        </div>
      )}

      {/* Kriterien Info-Modal */}
      {infoCrit && (
        <div style={S.modal} onClick={() => setInfoCrit(null)}>
          <div style={S.modalInner} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize:11, color:C.accent, fontWeight:700, letterSpacing:"0.06em", marginBottom:6 }}>
              {infoCrit.area}
            </div>
            <h3 style={{ fontSize:18, fontWeight:700, marginBottom:8 }}>{infoCrit.short}</h3>
            <p style={{ fontSize:13, color:C.textDim, lineHeight:"1.6", marginBottom:16 }}>
              {infoCrit.full}
            </p>
            {infoCrit.examples && (
              <>
                <div style={{ fontSize:11, fontWeight:700, color:C.textDim, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:8 }}>
                  Beispiele im Unterricht
                </div>
                {infoCrit.examples.map((ex, i) => (
                  <div key={i} style={{
                    display:"flex", alignItems:"flex-start", gap:8,
                    padding:"8px 12px", background:C.surface, borderRadius:8,
                    marginBottom:6, fontSize:13, color:C.text, lineHeight:"1.4",
                  }}>
                    <span style={{ color:C.accent, fontWeight:700, flexShrink:0 }}>→</span>
                    <span>{ex}</span>
                  </div>
                ))}
              </>
            )}
            <button style={{ ...S.btn("ghost"), marginTop:12 }} onClick={() => setInfoCrit(null)}>
              Schließen
            </button>
          </div>
        </div>
      )}

      {/* Undo toast — kompakt, eine Zeile, über Nav */}
      {lastAction && (
        <div style={{
          position:"fixed",
          bottom:`calc(66px + env(safe-area-inset-bottom))`,
          left:12, right:12,
          background:"rgba(26,29,39,0.96)",
          border:`1px solid ${C.accent}`,
          borderRadius:10,
          padding:"8px 10px 8px 14px",
          display:"flex",
          alignItems:"center",
          justifyContent:"space-between",
          gap:8,
          zIndex:150,
          boxShadow:"0 4px 16px rgba(0,0,0,0.5)",
        }}>
          <div style={{ flex:1, minWidth:0, display:"flex", alignItems:"center", gap:8 }}>
            <span style={{ fontSize:11, color:C.accent, fontWeight:700, flexShrink:0 }}>✓</span>
            <span style={{ fontSize:12, fontWeight:500, color:C.text, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
              {lastAction.description}
            </span>
          </div>
          <button
            onClick={performUndo}
            style={{
              background:"transparent", color:C.accent, border:`1px solid ${C.accent}`,
              borderRadius:7, padding:"5px 12px", fontSize:12, fontWeight:700,
              cursor:"pointer", WebkitAppearance:"none", flexShrink:0,
            }}>
            ↶ Undo
          </button>
        </div>
      )}

      {/* Bottom nav */}
      <div style={S.nav} className="no-print">
        {[
          { id:"home",     icon:"home",     label:"Stunde" },
          { id:"students", icon:"users",    label:"Kurse"  },
          { id:"overview", icon:"chart",    label:"Stats"  },
          { id:"settings", icon:"settings", label:"Mehr"   },
        ].map(tab => (
          <button key={tab.id} style={S.navBtn(page===tab.id)}
            onClick={() => setPage(tab.id)}>
            <Icon name={tab.icon} size={22} color={page===tab.id?C.accent:C.textDim} />
            {tab.label}
          </button>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
