// ─── HELPERS ─────────────────────────────────────────────────────────────────

const dateKey = (d = new Date()) => d.toISOString().slice(0,10);

// Notes and "nothing to observe today" markers ride in the same list as ratings
// but must never be counted as one. They still carry a date, so they do keep a
// student out of the suggestion queue — which is the point of the skip marker.
const NON_RATING = new Set(["note", "skip"]);
const isRating = (o) => !NON_RATING.has(o.criterionId);

const loadData = (key, fallback) => {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
};
const saveData = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} };

// DiViS shows both of these as cross-class courses (9 Soc91 draws on 9a/9b/9d,
// 8 His82 on 8a/8d/8e/8f), so the class-specific names were simply wrong.
// The course name is the foreign key for observations, homework and absences,
// so anything already stored has to be carried over with it — otherwise the old
// entries survive in storage but belong to a course that no longer exists.
const COURSE_RENAMES = {
  "9c Social Studies": "Jg9 Social Studies",
  "8a History":        "Jg8 History",
};

const migrateCourseNames = () => {
  try {
    if (localStorage.getItem("obs_courseRename_v1")) return;
    const ren = (n) => COURSE_RENAMES[n] || n;

    const courses = loadData("obs_courses", null);
    if (courses) saveData("obs_courses", courses.map(c => ({ ...c, name: ren(c.name) })));

    const obs = loadData("obs_observations", null);
    if (obs) saveData("obs_observations", obs.map(o => ({ ...o, course: ren(o.course) })));

    // homework/absences are keyed "YYYY-MM-DD_Kursname"; split at the first "_"
    // only, since course names may contain further underscores.
    ["obs_homework", "obs_absences"].forEach(key => {
      const val = loadData(key, null);
      if (!val) return;
      const out = {};
      Object.entries(val).forEach(([k, v]) => {
        const i = k.indexOf("_");
        out[i < 0 ? k : `${k.slice(0, i)}_${ren(k.slice(i + 1))}`] = v;
      });
      saveData(key, out);
    });

    const session = loadData("obs_session", null);
    if (session && session.activeCourse) {
      saveData("obs_session", { ...session, activeCourse: ren(session.activeCourse) });
    }

    localStorage.setItem("obs_courseRename_v1", "1");
  } catch(e) {}
};
migrateCourseNames();

const getCriteria = (courseName) =>
  ENGLISH_COURSES.includes(courseName) ? FREMDSPRACHEN_CRITERIA : GENERAL_CRITERIA;

const getCurrentSlot = () => {
  const now = new Date();
  const day = now.getDay();
  const hhmm = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  return SCHEDULE.find(s => s.day === day && hhmm >= s.start && hhmm <= s.end) || null;
};

// ─── EXPORT CSV ──────────────────────────────────────────────────────────────

const generateCSV = (courses, observations, homework, absences) => {
  const lines = ["ClassPulse Export — " + new Date().toLocaleDateString("de-DE")];
  courses.filter(c => c.criteriaType !== "none").forEach(course => {
    const criteria = getCriteria(course.name);
    lines.push(`\n=== ${course.name} ===`);
    lines.push(`Name,${criteria.map(c => c.short).join(",")},HA-Quote,Fehltage,Gesamt`);
    course.students.forEach(st => {
      const obs = observations.filter(o => o.course === course.name && o.studentId === st.id);
      const critSummary = criteria.map(crit => {
        const pos = obs.filter(o => o.criterionId === crit.id && o.rating === "+").length;
        const neg = obs.filter(o => o.criterionId === crit.id && o.rating === "-").length;
        return (pos === 0 && neg === 0) ? "-" : `+${pos}/-${neg}`;
      });
      let hwTotal = 0, hwDone = 0;
      Object.entries(homework).forEach(([key, val]) => {
        if (key.endsWith(`_${course.name}`)) {
          const status = val[st.id];
          // No record = absent, or not yet in the course. Counting that as "done"
          // handed absent students a free 100%.
          if (status === undefined) return;
          hwTotal++;
          if (status === "done") hwDone++;
          else if (status === "half") hwDone += 0.5;
        }
      });
      const hwPct = hwTotal > 0 ? `${Math.round((hwDone/hwTotal)*100)}%` : "-";
      let absentCount = 0;
      Object.entries(absences).forEach(([key, ids]) => {
        if (key.endsWith(`_${course.name}`) && ids.includes(st.id)) absentCount++;
      });
      lines.push(`"${st.name}",${critSummary.join(",")},${hwPct},${absentCount},${obs.length}`);
    });
  });
  return lines.join("\n");
};

function App() {
  const [page,         setPage]         = useState("home");
  const [courses,      setCourses]      = useState(() => loadData("obs_courses", COURSES_META.map(c => ({ ...c, students: [...DEFAULT_STUDENTS] }))));
  const [observations, setObservations] = useState(() => loadData("obs_observations", []));
  const [homework,     setHomework]     = useState(() => loadData("obs_homework", {}));
  const [absences,     setAbsences]     = useState(() => loadData("obs_absences", {}));
  // Lesson topic per course and day, same "YYYY-MM-DD_Kursname" key as the two above.
  const [topics,       setTopics]       = useState(() => loadData("obs_topics", {}));

  // A locked phone or an app switch discards the page, so the running session is
  // restored from storage — but only if it is from today.
  const [restored] = useState(() => {
    const s = loadData("obs_session", null);
    return s && s.date === dateKey() && s.activeCourse ? s : null;
  });

  const [activeCourse,  setActiveCourse]  = useState(restored?.activeCourse ?? null);
  const [activeStudent, setActiveStudent] = useState(null);  // land on the list, not inside a student
  const [sessionPhase,  setSessionPhase]  = useState(restored?.sessionPhase ?? "select");

  const [todayAbsent,  setTodayAbsent]  = useState(restored?.todayAbsent  ?? []);
  const [hwActive,     setHwActive]     = useState(restored?.hwActive     ?? false);
  const [hwExceptions, setHwExceptions] = useState(restored?.hwExceptions ?? {});

  const [noteText,      setNoteText]      = useState("");
  const [showImport,    setShowImport]    = useState(false);
  const [importText,    setImportText]    = useState("");
  const [showExport,    setShowExport]    = useState(false);
  const [copyOK,        setCopyOK]        = useState(false);
  const [infoCrit,      setInfoCrit]      = useState(null);
  const [showBackup,    setShowBackup]    = useState(false);
  const [backupImportOK,setBackupImportOK]= useState(false);
  const [backupError,   setBackupError]  = useState("");

  const [editingStudentKey, setEditingStudentKey] = useState(null);
  const [editStudentValue,  setEditStudentValue]  = useState("");
  const [addingToCourse,    setAddingToCourse]    = useState(null);
  const [addStudentValue,   setAddStudentValue]   = useState("");
  const [confirmRemoveKey,  setConfirmRemoveKey]  = useState(null);
  const studentKey = (courseName, studentId) => `${courseName}::${studentId}`;

  const [topicEditing, setTopicEditing] = useState(false);
  const [topicDraft,   setTopicDraft]   = useState("");

  const setTopicFor = (courseName, value) => {
    const key = `${dateKey()}_${courseName}`;
    setTopics(prev => {
      const next = { ...prev };
      if (value.trim()) next[key] = value.trim(); else delete next[key];
      return next;
    });
  };

  // Recent distinct topics of this course, newest first. A unit usually runs over
  // several lessons, so the topic is normally one tap rather than typing.
  const recentTopics = (courseName, n = 4) => {
    const seen = new Set(), out = [];
    Object.entries(topics)
      .filter(([k, v]) => k.endsWith(`_${courseName}`) && v && v.trim())
      .sort((a, b) => a[0] < b[0] ? 1 : -1)
      .forEach(([, v]) => { if (!seen.has(v) && out.length < n) { seen.add(v); out.push(v); } });
    return out;
  };

  const [lastAutoBackup, setLastAutoBackup] = useState(() => localStorage.getItem("obs_lastAutoBackup"));
  const [backupDue,      setBackupDue]      = useState(false);

  // Undo: { type, description, undo: () => void, expires: timestamp }
  const [lastAction, setLastAction] = useState(null);

  // Auto-hide undo toast. Long enough to survive a glance back at the class.
  useEffect(() => {
    if (!lastAction) return;
    const t = setTimeout(() => setLastAction(null), 12000);
    return () => clearTimeout(t);
  }, [lastAction]);

  // Helper: register an undoable action
  const registerUndo = (description, undoFn) => {
    setLastAction({ description, undo: undoFn, ts: Date.now() });
  };

  const performUndo = () => {
    if (lastAction) {
      lastAction.undo();
      setLastAction(null);
    }
  };

  useEffect(() => saveData("obs_courses",      courses),      [courses]);
  useEffect(() => saveData("obs_observations", observations), [observations]);
  useEffect(() => saveData("obs_homework",     homework),     [homework]);
  useEffect(() => saveData("obs_absences",     absences),     [absences]);
  useEffect(() => saveData("obs_topics",       topics),       [topics]);

  // Keep the running session recoverable; clear it once the lesson is ended.
  useEffect(() => {
    if (!activeCourse) { try { localStorage.removeItem("obs_session"); } catch(e) {} return; }
    saveData("obs_session", {
      date: dateKey(), activeCourse, sessionPhase, todayAbsent, hwActive, hwExceptions,
    });
  }, [activeCourse, sessionPhase, todayAbsent, hwActive, hwExceptions]);

  // Automatische Sicherung: löst beim Öffnen der App aus, wenn seit dem letzten
  // Auto-Backup ein zufälliges Intervall (4–7 Tage) verstrichen ist. Eigene
  // Dateinamen-Vorsilbe ("AutoBackup" statt "Backup"), damit System- und
  // Handsicherungen im Downloads-/iCloud-Ordner unterscheidbar bleiben.
  useEffect(() => {
    if (!observations.length) return;
    const last     = localStorage.getItem("obs_lastAutoBackup");
    const dueDays  = Number(localStorage.getItem("obs_nextAutoBackupDays")) || 4;
    const daysSince = last ? (Date.now() - new Date(last).getTime()) / 86400000 : Infinity;
    setBackupDue(daysSince >= dueDays);
  }, []);

  // iOS Safari drops downloads that no tap initiated, so the backup cannot fire
  // by itself — stamping "saved" on an attempt would be a lie. Prompt instead,
  // and only record the date once a real tap produced the file.
  const runDueBackup = () => {
    downloadBackup("ClassPulse_AutoBackup");
    const now = new Date().toISOString();
    localStorage.setItem("obs_lastAutoBackup", now);
    localStorage.setItem("obs_nextAutoBackupDays", String(4 + Math.floor(Math.random() * 4)));
    setLastAutoBackup(now);
    setBackupDue(false);
  };

  const today       = dateKey();
  const currentSlot = getCurrentSlot();

  // ── helpers ─────────────────────────────────────────────────────────────

  const getSuggested = useCallback((courseName, count=4) => {
    const course = courses.find(c => c.name === courseName);
    if (!course) return [];
    const absent  = absences[`${today}_${courseName}`] || [];
    const avail   = course.students.filter(st => !absent.includes(st.id));
    const lastObs = {}, ratings = {};
    observations.filter(o => o.course === courseName).forEach(o => {
      if (!lastObs[o.studentId] || o.date > lastObs[o.studentId]) lastObs[o.studentId] = o.date;
      if (isRating(o)) ratings[o.studentId] = (ratings[o.studentId] || 0) + 1;
    });
    // Longest-unobserved first; never observed ("") sorts to the very front.
    // Equal dates must return 0 — returning -1 there reverses the whole list,
    // which silently favoured students at the end of the roster.
    return avail.sort((a,b) => {
      const la = lastObs[a.id] || "", lb = lastObs[b.id] || "";
      if (la !== lb) return la < lb ? -1 : 1;
      // Same recency: thinnest record first, so one early "-" cannot park a
      // quiet student at the back of the queue for weeks.
      return (ratings[a.id] || 0) - (ratings[b.id] || 0);
    }).slice(0,count);
  }, [courses, observations, absences, today]);

  const getStats = useCallback((courseName, studentId) => {
    // Notes are stored with rating "+" — they must never count as a positive.
    const obs  = observations.filter(o =>
      o.course === courseName && o.studentId === studentId && isRating(o));
    const pos  = obs.filter(o => o.rating === "+").length;
    const neg  = obs.filter(o => o.rating === "-").length;
    const last = obs.reduce((m,o) => o.date > m ? o.date : m, "");
    return { pos, neg, total:obs.length, last };
  }, [observations]);

  // ── session actions ──────────────────────────────────────────────────────

  const startSession = (courseName) => {
    setActiveCourse(courseName);
    setTodayAbsent(absences[`${today}_${courseName}`] || []);
    setHwActive(false);
    setHwExceptions({});
    setActiveStudent(null);
    setSessionPhase("absent");
  };

  const finishAbsent = () => {
    setAbsences(prev => ({ ...prev, [`${today}_${activeCourse}`]: todayAbsent }));
    setSessionPhase("homework");
  };

  const activateHw = () => {
    const course  = courses.find(c => c.name === activeCourse);
    const present = course.students.filter(st => !todayAbsent.includes(st.id));
    // Re-entering the homework phase (e.g. after an interruption) must not wipe
    // exceptions already recorded for today.
    const recorded = homework[`${today}_${activeCourse}`] || {};
    const defaults = {};
    present.forEach(st => { defaults[st.id] = recorded[st.id] || "done"; });
    setHwExceptions(defaults);
    setHwActive(true);
  };

  const finishHomework = () => {
    if (hwActive) {
      const course  = courses.find(c => c.name === activeCourse);
      const present = course.students.filter(st => !todayAbsent.includes(st.id));
      const record  = {};
      present.forEach(st => { record[st.id] = hwExceptions[st.id] || "done"; });
      setHomework(prev => ({ ...prev, [`${today}_${activeCourse}`]: record }));
    }
    setSessionPhase("observe");
  };

  const addObs = (studentId, criterionId, rating, note="") => {
    // Build description for the toast
    const course  = courses.find(c => c.name === activeCourse);
    const student = course?.students.find(st => st.id === studentId);
    const crit    = getCriteria(activeCourse).find(c => c.id === criterionId);
    const stName  = student?.name.split(" ")[0] || "?";
    const critLbl = crit?.short || (criterionId === "note" ? "Notiz" : criterionId);
    const ratingSym = rating === "+" ? "+" : "−";
    const now = () => new Date().toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });

    // Notes accumulate; a criterion holds at most one rating per student per day.
    // Same sign again takes it back, opposite sign replaces it — so what the tile
    // shows always matches what the grade proposal counts.
    const existing = criterionId === "note" ? null : observations.find(o =>
      o.course === activeCourse && o.studentId === studentId &&
      o.criterionId === criterionId && o.date === today
    );

    if (existing && existing.rating === rating) {
      setObservations(prev => prev.filter(o => o.id !== existing.id));
      registerUndo(
        `${stName}: ${critLbl} ${ratingSym} zurückgenommen`,
        () => setObservations(prev => [...prev, existing])
      );
      return;
    }

    if (existing) {
      setObservations(prev => prev.map(o =>
        o.id === existing.id ? { ...o, rating, time: now() } : o
      ));
      registerUndo(
        `${stName}: ${critLbl} → ${ratingSym}`,
        () => setObservations(prev => prev.map(o => o.id === existing.id ? existing : o))
      );
      return;
    }

    const obs = {
      id: `${Date.now()}_${Math.random().toString(36).slice(2,6)}`,
      course: activeCourse, studentId, criterionId,
      rating, note, date: today,
      time: now(),
    };
    setObservations(prev => [...prev, obs]);
    registerUndo(
      `${stName}: ${critLbl} ${ratingSym}`,
      () => setObservations(prev => prev.filter(o => o.id !== obs.id))
    );
  };

  // "Looked at them, nothing to rate today." Without this the only thing a quiet
  // student can earn is a "-", because saying nothing has no other button.
  // The marker carries a date, so they rotate out of today's suggestions, but it
  // is not a rating and never reaches the grade proposal.
  const skipToday = (studentId) => {
    const already = observations.find(o =>
      o.course === activeCourse && o.studentId === studentId &&
      o.criterionId === "skip" && o.date === today
    );
    setActiveStudent(null);
    if (already) return;
    const course  = courses.find(c => c.name === activeCourse);
    const student = course?.students.find(st => st.id === studentId);
    const stName  = student?.name.split(" ")[0] || "?";
    const obs = {
      id: `${Date.now()}_${Math.random().toString(36).slice(2,6)}`,
      course: activeCourse, studentId, criterionId: "skip",
      rating: "", note: "", date: today,
      time: new Date().toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" }),
    };
    setObservations(prev => [...prev, obs]);
    registerUndo(
      `${stName}: heute nichts beobachtet`,
      () => setObservations(prev => prev.filter(o => o.id !== obs.id))
    );
  };

  const importStudents = (courseName) => {
    const names = importText.split("\n").map(n => n.trim()).filter(Boolean);
    if (!names.length) return;
    // A bulk import regenerates every student id, so observations recorded for
    // this course lose the student they belong to. Single names can be corrected
    // in the roster instead — say so before wiping a term's worth of entries.
    const affected = observations.filter(o => o.course === courseName).length;
    if (affected > 0 && !window.confirm(
      `${courseName}: ${names.length} Namen importieren?\n\n` +
      `Achtung: ${affected} bereits erfasste Einträge in diesem Kurs verlieren dadurch ihre Zuordnung ` +
      `und tauchen nirgends mehr auf.\n\n` +
      `Nur einzelne Namen korrigieren? Abbrechen und stattdessen den Namen in der Liste antippen.`
    )) return;
    setCourses(prev => prev.map(c =>
      c.name === courseName ? { ...c, students: names.map((name,i) => ({ id:`imp_${Date.now()}_${i}`, name })) } : c
    ));
    setImportText("");
    setShowImport(false);
  };

  const renameStudent = (courseName, studentId, newName) => {
    const trimmed = newName.trim();
    if (!trimmed) return;
    setCourses(prev => prev.map(c =>
      c.name === courseName
        ? { ...c, students: c.students.map(st => st.id === studentId ? { ...st, name: trimmed } : st) }
        : c
    ));
  };

  const addStudent = (courseName, name) => {
    const trimmed = name.trim();
    if (!trimmed) return;
    setCourses(prev => prev.map(c =>
      c.name === courseName
        ? { ...c, students: [...c.students, { id: `s_${Date.now()}_${Math.random().toString(36).slice(2,7)}`, name: trimmed }] }
        : c
    ));
  };

  const removeStudent = (courseName, studentId) => {
    setCourses(prev => prev.map(c =>
      c.name === courseName ? { ...c, students: c.students.filter(st => st.id !== studentId) } : c
    ));
  };

  const goHome = () => { setActiveCourse(null); setSessionPhase("select"); setActiveStudent(null); setLastAction(null); };

  // ── JSON BACKUP ──────────────────────────────────────────────────────────
  const downloadBackup = (filenamePrefix) => {
    const backup = {
      version: "1.0",
      exportDate: new Date().toISOString(),
      app: "ClassPulse",
      data: { courses, observations, homework, absences, topics },
    };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type:"application/json" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    const date = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `${filenamePrefix}_${date}.json`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const exportBackup = () => downloadBackup("ClassPulse_Backup");

  const importBackup = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const backup = JSON.parse(e.target.result);
        // `!backup.app === "ClassPulse"` compared a boolean to a string and was
        // therefore always false — the check never ran.
        if (!backup.data || backup.app !== "ClassPulse") throw new Error("Das ist keine ClassPulse-Backup-Datei");
        const { courses: c, observations: o, homework: h, absences: a } = backup.data;
        const tp = backup.data.topics && typeof backup.data.topics === "object" ? backup.data.topics : {};
        if (!Array.isArray(c) || !Array.isArray(o) ||
            !h || typeof h !== "object" || !a || typeof a !== "object")
          throw new Error("Daten unvollständig oder beschädigt");

        // Overwriting is irreversible and costs a whole term — always ask first.
        const stamp = (backup.exportDate || "").slice(0,10);
        const ok = window.confirm(
          `Backup${stamp ? " vom " + stamp : ""} einspielen?\n\n` +
          `${c.length} Kurse · ${o.length} Beobachtungen\n\n` +
          `Alle aktuellen Daten auf diesem Gerät werden dadurch ersetzt.`
        );
        if (!ok) return;
        setCourses(c);
        setObservations(o);
        setHomework(h);
        setAbsences(a);
        setTopics(tp);
        saveData("obs_courses",      c);
        saveData("obs_observations", o);
        saveData("obs_homework",     h);
        saveData("obs_absences",     a);
        saveData("obs_topics",       tp);
        setBackupImportOK(true);
        setBackupError("");
        setTimeout(() => setBackupImportOK(false), 3000);
      } catch(err) {
        setBackupError("Fehler: " + err.message + " — Ist das eine ClassPulse-Backup-Datei?");
      }
    };
    reader.readAsText(file);
  };

  // ── NOTENVORSCHLAG ───────────────────────────────────────────────────────
  // 6, not 5: at exactly 5 entries no whole number of "+" lands in the 45–60%
  // band, so the grade "3" — the most common one — could not be proposed at the
  // very moment the proposal unlocks. From 6 entries on, every band is reachable.
  const MIN_ENTRIES  = 6;
  const MIN_DAYS     = 3;

  const getGradeProposal = (courseName, studentId) => {
    const obs = observations.filter(o =>
      o.course === courseName && o.studentId === studentId && isRating(o)
    );
    const days = new Set(obs.map(o => o.date)).size;
    if (obs.length < MIN_ENTRIES || days < MIN_DAYS) return null;
    const pos = obs.filter(o => o.rating === "+").length;
    const ratio = pos / obs.length;
    if (ratio >= 0.80) return { grade:"1–2", label:"sehr gut / gut",         color:C.green  };
    if (ratio >= 0.60) return { grade:"2–3", label:"gut / befriedigend",     color:C.green  };
    if (ratio >= 0.45) return { grade:"3",   label:"befriedigend",           color:C.amber  };
    if (ratio >= 0.30) return { grade:"3–4", label:"befriedigend / ausreichend", color:C.amber };
    if (ratio >= 0.15) return { grade:"4–5", label:"ausreichend / mangelhaft",   color:C.red   };
    return               { grade:"5–6", label:"mangelhaft / ungenügend",    color:C.red   };
  };

  const getObsProgress = (courseName, studentId) => {
    const obs = observations.filter(o =>
      o.course === courseName && o.studentId === studentId && isRating(o)
    );
    const days = new Set(obs.map(o => o.date)).size;
    return { count: obs.length, days, ready: obs.length >= MIN_ENTRIES && days >= MIN_DAYS };
  };

  // ── RENDER: HOME ─────────────────────────────────────────────────────────

  const renderHome = () => {
    const daySlots = SCHEDULE.filter(sl => sl.day === new Date().getDay());
    return (
      <div style={S.page}>
        {backupDue && (
          <div style={{ background:C.amberSoft, border:`1px solid ${C.amber}`, borderRadius:12, padding:"12px 14px", marginBottom:12, cursor:"pointer" }}
            onClick={runDueBackup}>
            <div style={{ fontSize:13, fontWeight:600, color:C.amber, marginBottom:2 }}>Sicherung fällig</div>
            <div style={{ fontSize:12, color:C.textDim }}>
              Tippen lädt die Backup-Datei herunter{lastAutoBackup
                ? ` — zuletzt vor ${Math.floor((Date.now()-new Date(lastAutoBackup).getTime())/86400000)} Tagen`
                : ""}.
            </div>
          </div>
        )}

        {currentSlot && (
          <div style={{ ...S.courseCard(true), marginBottom:16 }} onClick={() => startSession(currentSlot.course)}>
            <div style={{ fontSize:11, color:C.accent, fontWeight:700, marginBottom:4, letterSpacing:"0.06em" }}>JETZT LÄUFT</div>
            <div style={S.courseTitle}>{currentSlot.course}</div>
            <div style={S.courseMeta}>{currentSlot.start}–{currentSlot.end} · {currentSlot.type==="double"?"Doppelstunde":"Einzelstunde"}</div>
            <button style={S.btn("primary")}>Stunde starten →</button>
          </div>
        )}

        {daySlots.length > 0 && (
          <>
            <div style={S.sectionLbl}>Heute — {DAYS[new Date().getDay()]}</div>
            {daySlots.filter(sl => sl !== currentSlot).map((sl,i) => (
              <div key={i} style={S.courseCard(false)} onClick={() => startSession(sl.course)}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <div>
                    <div style={S.courseTitle}>{sl.course}</div>
                    <div style={S.courseMeta}>{sl.start}–{sl.end} · {sl.type==="double"?"DS":"ES"}</div>
                  </div>
                  {ENGLISH_COURSES.includes(sl.course) && <span style={S.badge("blue")}>FS</span>}
                </div>
              </div>
            ))}
          </>
        )}

        {!currentSlot && daySlots.length === 0 && (
          <div style={{ textAlign:"center", padding:"60px 20px", color:C.textDim }}>
            <div style={{ fontSize:36, marginBottom:12 }}>📋</div>
            <div style={{ fontSize:15, fontWeight:600, color:C.text, marginBottom:6 }}>Kein Unterricht heute</div>
            <div style={{ fontSize:13 }}>Wähle einen Kurs manuell unten aus oder schau in die Übersicht.</div>
          </div>
        )}

        <div style={S.sectionLbl}>Alle Kurse</div>
        {COURSES_META.filter(c => c.criteriaType !== "none").map((c,i) => (
          <div key={i} style={S.courseCard(false)} onClick={() => startSession(c.name)}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div style={S.courseTitle}>{c.name}</div>
              {c.criteriaType==="fremdsprachen" && <span style={S.badge("blue")}>FS</span>}
            </div>
          </div>
        ))}
      </div>
    );
  };

  // ── RENDER: ABSENT ───────────────────────────────────────────────────────

  const renderMissingCourse = () => (
    <div style={S.page}>
      <div style={{ textAlign:"center", padding:"48px 20px" }}>
        <div style={{ fontSize:36, marginBottom:12 }}>🤔</div>
        <div style={{ fontSize:15, fontWeight:600, marginBottom:6 }}>Kurs nicht gefunden</div>
        <div style={{ fontSize:13, color:C.textDim, lineHeight:"1.6" }}>
          „{activeCourse}" steht im Stundenplan, aber nicht in deinen gespeicherten
          Kursen. Meist heißt das: Der Kurs wurde umbenannt. Deine Einträge sind nicht
          verloren — sie hängen am alten Namen.
        </div>
        <button style={{ ...S.btn("primary"), marginTop:20 }} onClick={goHome}>Zurück</button>
      </div>
    </div>
  );

  const renderAbsent = () => {
    const course = courses.find(c => c.name === activeCourse);
    // A course name that no longer exists used to render an empty page with no
    // explanation — undiagnosable mid-lesson. Say what happened instead.
    if (!course) return renderMissingCourse();
    return (
      <div style={S.page}>
        <div style={{ fontSize:11, color:C.accent, fontWeight:700, letterSpacing:"0.06em" }}>{activeCourse}</div>
        <h2 style={{ fontSize:20, fontWeight:700, margin:"6px 0 4px" }}>Wer fehlt heute?</h2>
        <p style={{ fontSize:13, color:C.textDim, marginBottom:16 }}>Antippen = fehlt · nochmal = wieder da</p>

        {course.students.map(st => {
          const absent = todayAbsent.includes(st.id);
          return (
            <div key={st.id}
              style={{ ...S.row, background:absent?C.redSoft:C.card, borderColor:absent?C.red:C.border, cursor:"pointer" }}
              onClick={() => {
                const wasAbsent = absent;
                setTodayAbsent(prev => wasAbsent ? prev.filter(id=>id!==st.id) : [...prev, st.id]);
                const stName = st.name.split(" ")[0];
                registerUndo(
                  wasAbsent ? `${stName}: wieder anwesend` : `${stName}: fehlt`,
                  () => setTodayAbsent(prev => wasAbsent ? [...prev, st.id] : prev.filter(id=>id!==st.id))
                );
              }}>
              <span style={{ fontSize:14, fontWeight:500, color:absent?C.red:C.text }}>{st.name}</span>
              {absent && <span style={{ fontSize:12, color:C.red, fontWeight:700 }}>fehlt</span>}
            </div>
          );
        })}

        <div style={{ display:"flex", gap:8, marginTop:16 }}>
          <button style={S.btn("ghost")} onClick={() => { setTodayAbsent([]); finishAbsent(); }}>Niemand fehlt</button>
          <button style={S.btn("primary")} onClick={finishAbsent}>
            Speichern & weiter {todayAbsent.length > 0 ? `(${todayAbsent.length} fehlt)` : "→"}
          </button>
        </div>
        <p style={{ fontSize:11, color:C.textMuted, textAlign:"center", marginTop:8 }}>
          Wird automatisch gespeichert.
        </p>
      </div>
    );
  };

  // ── RENDER: HOMEWORK ────────────────────────────────────────────────────

  const renderHomework = () => {
    const course  = courses.find(c => c.name === activeCourse);
    // A course name that no longer exists used to render an empty page with no
    // explanation — undiagnosable mid-lesson. Say what happened instead.
    if (!course) return renderMissingCourse();
    const present = course.students.filter(st => !todayAbsent.includes(st.id));
    const exCount = Object.values(hwExceptions).filter(v => v !== "done").length;

    return (
      <div style={S.page}>
        <div style={{ fontSize:11, color:C.accent, fontWeight:700, letterSpacing:"0.06em" }}>{activeCourse}</div>
        <h2 style={{ fontSize:20, fontWeight:700, margin:"6px 0 4px" }}>Hausaufgaben</h2>

        {!hwActive ? (
          <>
            <p style={{ fontSize:13, color:C.textDim, marginBottom:16 }}>Gab es Hausaufgaben auf?</p>
            <button style={S.btn("green")} onClick={activateHw}>✓ Ja — HA kontrollieren</button>
            <button style={S.btn("ghost")} onClick={() => setSessionPhase("observe")}>Nein — direkt zum Beobachten</button>
          </>
        ) : (
          <>
            <p style={{ fontSize:13, color:C.textDim, marginBottom:2 }}>
              Alle auf ✓ gesetzt — nur Ausnahmen antippen.
            </p>
            <p style={{ fontSize:12, color:C.textMuted, marginBottom:14 }}>
              {present.length} anwesend · {exCount} nicht/teilweise
            </p>

            {present.map(st => {
              const status = hwExceptions[st.id] || "done";
              const stName = st.name.split(" ")[0];
              const setStatus = (newStatus, label) => {
                const prevStatus = status;
                setHwExceptions(p => ({ ...p, [st.id]: newStatus }));
                registerUndo(
                  `${stName}: HA ${label}`,
                  () => setHwExceptions(p => ({ ...p, [st.id]: prevStatus }))
                );
              };
              return (
                <div key={st.id} style={{ ...S.row, borderColor:status==="not"?C.red:status==="half"?C.amber:C.border, background:status==="not"?C.redSoft:status==="half"?C.amberSoft:C.card }}>
                  <span style={{ fontSize:14, fontWeight:500 }}>{st.name}</span>
                  <div style={{ display:"flex", gap:4 }}>
                    <button style={S.btnSm(status==="done"?"green":"ghost")}
                      onClick={() => setStatus("done", "✓")}>✓</button>
                    <button style={S.btnSm(status==="half"?"amber":"ghost")}
                      onClick={() => setStatus(status==="half"?"done":"half", status==="half"?"✓":"½")}>½</button>
                    <button style={S.btnSm(status==="not"?"red":"ghost")}
                      onClick={() => setStatus(status==="not"?"done":"not", status==="not"?"✓":"✗")}>✗</button>
                  </div>
                </div>
              );
            })}
            <button style={{ ...S.btn("primary"), marginTop:16 }} onClick={finishHomework}>Speichern & weiter →</button>
            <p style={{ fontSize:11, color:C.textMuted, textAlign:"center", marginTop:6 }}>Wird automatisch gespeichert.</p>
          </>
        )}
      </div>
    );
  };

  // ── RENDER: OBSERVE ─────────────────────────────────────────────────────

  const renderObserve = () => {
    const course = courses.find(c => c.name === activeCourse);
    // A course name that no longer exists used to render an empty page with no
    // explanation — undiagnosable mid-lesson. Say what happened instead.
    if (!course) return renderMissingCourse();
    const criteria  = getCriteria(activeCourse);
    const suggested = getSuggested(activeCourse, 4);
    const absentIds = absences[`${today}_${activeCourse}`] || [];
    const available = course.students.filter(st => !absentIds.includes(st.id));

    // ── Detail view — Grid ──
    if (activeStudent) {
      const student  = course.students.find(st => st.id === activeStudent);
      const todayObs = observations.filter(o => o.course === activeCourse && o.studentId === activeStudent && o.date === today);
      const areas    = [...new Set(criteria.map(c => c.area))];
      const doneCount = todayObs.filter(isRating).length;

      return (
        <div style={S.page}>
          {/* Header */}
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
            <button style={{ background:"none", border:"none", color:C.accent, fontSize:13, cursor:"pointer", padding:0 }}
              onClick={() => setActiveStudent(null)}>← Zurück</button>
            <span style={{ fontSize:12, color:C.textDim }}>
              {doneCount}/{criteria.length} bewertet
            </span>
          </div>

          <h2 style={{ fontSize:22, fontWeight:700, margin:"0 0 2px" }}>{student?.name}</h2>
          <p style={{ fontSize:12, color:C.textDim, marginBottom:8 }}>{activeCourse}</p>

          {/* Zwischenstand / Notenvorschlag */}
          {(() => {
            const grade = getGradeProposal(activeCourse, activeStudent);
            const prog  = getObsProgress(activeCourse, activeStudent);
            const criteria = getCriteria(activeCourse);

            // Tendenz pro Kriterium berechnen
            const critTendencies = criteria.map(crit => {
              const critObs = observations.filter(o =>
                o.course === activeCourse && o.studentId === activeStudent && o.criterionId === crit.id
              );
              const pos = critObs.filter(o => o.rating === "+").length;
              const neg = critObs.filter(o => o.rating === "-").length;
              const total = pos + neg;
              if (total === 0) return { crit, label: null, color: C.textMuted };
              const ratio = pos / total;
              if (ratio >= 0.70) return { crit, label: "überwiegend positiv",  color: C.green };
              if (ratio >= 0.45) return { crit, label: "ausgeglichen",          color: C.amber };
              return                   { crit, label: "überwiegend schwach",   color: C.red   };
            }).filter(t => t.label !== null);

            // Vollständiger Notenvorschlag
            if (grade) return (
              <div style={{ background:C.accentSoft, border:`1px solid ${C.accent}`, borderRadius:10, padding:"12px 14px", marginBottom:16 }}>
                <div style={{ fontSize:10, color:C.accent, fontWeight:700, letterSpacing:"0.06em", marginBottom:6 }}>NOTENVORSCHLAG</div>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                  <span style={{ fontSize:16, fontWeight:700, color:grade.color }}>Note {grade.grade}</span>
                  <span style={{ fontSize:11, color:C.textDim }}>{grade.label}</span>
                </div>
                {critTendencies.map(t => (
                  <div key={t.crit.id} style={{ display:"flex", justifyContent:"space-between", paddingTop:3 }}>
                    <span style={{ fontSize:11, color:C.textDim }}>{t.crit.short}</span>
                    <span style={{ fontSize:11, fontWeight:600, color:t.color }}>{t.label}</span>
                  </div>
                ))}
                <div style={{ fontSize:10, color:C.textMuted, marginTop:8, paddingTop:6, borderTop:`1px solid ${C.border}` }}>
                  {prog.count} Einträge / {prog.days} Tage · Pädagogische Einschätzung entscheidet.
                </div>
              </div>
            );

            // Vorläufige Tendenz ab 1 Eintrag
            if (prog.count > 0) return (
              <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:10, padding:"12px 14px", marginBottom:16 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                  <div style={{ fontSize:10, color:C.textDim, fontWeight:700, letterSpacing:"0.06em" }}>ZWISCHENSTAND</div>
                  <div style={{ fontSize:10, color:C.amber }}>⚠ {prog.count} Eintr. / {prog.days} Tage — vorläufig</div>
                </div>
                {critTendencies.length > 0 ? critTendencies.map(t => (
                  <div key={t.crit.id} style={{ display:"flex", justifyContent:"space-between", paddingTop:3 }}>
                    <span style={{ fontSize:11, color:C.textDim }}>{t.crit.short}</span>
                    <span style={{ fontSize:11, fontWeight:600, color:t.color }}>{t.label}</span>
                  </div>
                )) : (
                  <div style={{ fontSize:11, color:C.textMuted }}>Noch keine Kriterien bewertet.</div>
                )}
                <div style={{ fontSize:10, color:C.textMuted, marginTop:6 }}>
                  Notenvorschlag ab {MIN_ENTRIES} Einträgen / {MIN_DAYS} Tagen.
                </div>
              </div>
            );

            // Noch gar keine Einträge
            return (
              <div style={{ fontSize:11, color:C.textMuted, marginBottom:16 }}>
                Noch keine Einträge für diesen Schüler.
              </div>
            );
          })()}

          {/* Kriterien-Grid pro Bereich */}
          {areas.map(area => {
            const areaCriteria = criteria.filter(c => c.area === area);
            return (
              <div key={area} style={{ marginBottom:20 }}>
                <div style={S.sectionLbl}>{area}</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                  {areaCriteria.map(crit => {
                    const todayEntry = todayObs.find(o => o.criterionId === crit.id);
                    const isPos = todayEntry?.rating === "+";
                    const isNeg = todayEntry?.rating === "-";
                    return (
                      <div key={crit.id} style={{
                        background: isPos ? C.greenSoft : isNeg ? C.redSoft : C.card,
                        border: `1px solid ${isPos ? C.green : isNeg ? C.red : C.border}`,
                        borderRadius:10,
                        padding:"10px 10px 8px",
                        display:"flex",
                        flexDirection:"column",
                        gap:8,
                      }}>
                        {/* Kurzname + ⓘ */}
                        <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:4 }}>
                          <div style={{
                            fontSize:12, fontWeight:700,
                            color: isPos ? C.green : isNeg ? C.red : C.text,
                            lineHeight:"1.3", flex:1,
                          }}>{crit.short}</div>
                          <button
                            onClick={() => setInfoCrit(crit)}
                            style={{
                              background:"none", border:"none", cursor:"pointer",
                              color:C.textMuted, fontSize:13, padding:"0 0 0 2px",
                              lineHeight:1, flexShrink:0, WebkitAppearance:"none",
                            }}>ⓘ</button>
                        </div>

                        {/* + / − Buttons */}
                        <div style={{ display:"flex", gap:5 }}>
                          <button
                            onClick={() => addObs(activeStudent, crit.id, "+")}
                            style={{
                              flex:1, padding:"8px 0",
                              background: isPos ? C.green : "transparent",
                              color: isPos ? "#fff" : C.green,
                              border: `1px solid ${C.green}`,
                              borderRadius:7, fontSize:16, fontWeight:700,
                              cursor:"pointer", WebkitAppearance:"none",
                            }}>+</button>
                          <button
                            onClick={() => addObs(activeStudent, crit.id, "-")}
                            style={{
                              flex:1, padding:"8px 0",
                              background: isNeg ? C.red : "transparent",
                              color: isNeg ? "#fff" : C.red,
                              border: `1px solid ${C.red}`,
                              borderRadius:7, fontSize:16, fontWeight:700,
                              cursor:"pointer", WebkitAppearance:"none",
                            }}>−</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          {/* Notiz-Verlauf */}
          {(() => {
            const pastNotes = [...observations]
              .filter(o => o.course === activeCourse && o.studentId === activeStudent && o.criterionId === "note")
              .sort((a,b) => b.date.localeCompare(a.date) || b.time.localeCompare(a.time));
            if (pastNotes.length === 0) return null;
            return (
              <div style={{ marginBottom:8 }}>
                <div style={S.sectionLbl}>Bisherige Notizen ({pastNotes.length})</div>
                {pastNotes.map(n => (
                  <div key={n.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8, padding:"8px 12px", background:C.surface, borderRadius:8, marginBottom:5, borderLeft:`3px solid ${C.teal||C.accent}` }}>
                    <span style={{ fontSize:12, color:C.text, flex:1, lineHeight:"1.5" }}>{n.note}</span>
                    <span style={{ fontSize:10, color:C.textMuted, flexShrink:0, marginTop:1 }}>{n.date}</span>
                  </div>
                ))}
              </div>
            );
          })()}

          <div style={{ ...S.sectionLbl, marginTop:4 }}>Neue Notiz (optional)</div>
          <div style={{ display:"flex", gap:8 }}>
            <input
              style={{ flex:1, padding:"11px 12px", background:C.surface, border:`1px solid ${C.border}`, borderRadius:8, color:C.text, fontSize:13, outline:"none" }}
              placeholder="Kurze Notiz…"
              value={noteText}
              onChange={e => setNoteText(e.target.value)}
              onKeyDown={e => {
                if (e.key === "Enter" && noteText.trim()) {
                  addObs(activeStudent, "note", "+", noteText.trim());
                  setNoteText("");
                }
              }}
            />
            <button style={S.btnSm("primary")} onClick={() => {
              if (noteText.trim()) { addObs(activeStudent, "note", "+", noteText.trim()); setNoteText(""); }
            }}>+</button>
          </div>

          <button style={{ ...S.btn("ghost"), marginTop:16, color:C.textDim }}
            onClick={() => skipToday(activeStudent)}>
            Heute nichts zu bewerten
          </button>

          {/* Zurück-Button unten für schnellen Wechsel */}
          <button style={{ ...S.btn("ghost"), marginTop:8 }} onClick={() => setActiveStudent(null)}>
            ← Nächste/r Schüler/in
          </button>
        </div>
      );
    }

    // ── List view ──
    return (
      <div style={S.page}>
        <div style={{ fontSize:11, color:C.accent, fontWeight:700, letterSpacing:"0.06em" }}>{activeCourse}</div>
        <h2 style={{ fontSize:20, fontWeight:700, margin:"6px 0 12px" }}>Wen beobachten?</h2>

        {/* Thema — steht neben dem Ablauf, blockiert ihn nie. Leer lassen kostet nichts. */}
        {(() => {
          const tKey  = `${today}_${activeCourse}`;
          const saved = topics[tKey] || "";
          const save  = (v) => { setTopicFor(activeCourse, v); setTopicEditing(false); };
          if (!topicEditing) return (
            <div onClick={() => { setTopicDraft(saved); setTopicEditing(true); }}
              style={{ fontSize:12, color: saved ? C.text : C.textMuted, cursor:"pointer",
                       padding:"7px 10px", marginBottom:14, borderRadius:8,
                       border:`1px dashed ${C.border}` }}>
              {saved ? <><span style={{ color:C.textDim }}>Thema: </span>{saved}</> : "+ Thema fürs Klassenbuch (optional)"}
            </div>
          );
          const chips = recentTopics(activeCourse).filter(t => t !== topicDraft);
          return (
            <div style={{ marginBottom:14 }}>
              <div style={{ display:"flex", gap:6 }}>
                <input autoFocus value={topicDraft}
                  onChange={e => setTopicDraft(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") save(topicDraft);
                                    if (e.key === "Escape") setTopicEditing(false); }}
                  placeholder="Thema dieser Stunde"
                  style={{ flex:1, padding:"9px 11px", background:C.surface,
                           border:`1px solid ${C.accent}`, borderRadius:8, color:C.text,
                           fontSize:13, outline:"none" }} />
                <button style={S.btnSm("primary")} onClick={() => save(topicDraft)}>✓</button>
              </div>
              {chips.length > 0 && (
                <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginTop:8 }}>
                  {chips.map(t => (
                    <button key={t} onClick={() => save(t)}
                      style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:20,
                               padding:"5px 11px", fontSize:12, color:C.textDim, cursor:"pointer",
                               WebkitAppearance:"none" }}>{t}</button>
                  ))}
                </div>
              )}
            </div>
          );
        })()}

        {suggested.length > 0 && (
          <>
            <div style={S.sectionLbl}>Vorschlag — am längsten nicht beobachtet</div>
            {suggested.map(st => {
              const stats = getStats(activeCourse, st.id);
              return (
                <div key={st.id} style={{ ...S.courseCard(true), cursor:"pointer" }} onClick={() => setActiveStudent(st.id)}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                    <div style={{ fontSize:15, fontWeight:600 }}>{st.name}</div>
                    <div style={{ fontSize:11, color:C.textDim }}>{stats.last || "noch nie"}</div>
                  </div>
                  {stats.total > 0 && (
                    <div style={{ fontSize:12, color:C.textDim, marginTop:2 }}>
                      <span style={{ color:C.green }}>+{stats.pos}</span> / <span style={{ color:C.red }}>−{stats.neg}</span> insgesamt
                    </div>
                  )}
                </div>
              );
            })}
          </>
        )}

        <div style={S.sectionLbl}>Alle anwesenden ({available.length})</div>
        {available.map(st => {
          const stats = getStats(activeCourse, st.id);
          return (
            <div key={st.id} style={{ ...S.row, cursor:"pointer" }} onClick={() => setActiveStudent(st.id)}>
              <span style={{ fontSize:14, fontWeight:500 }}>{st.name}</span>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                {stats.total > 0 && (
                  <span style={{ fontSize:11, color:C.textDim }}>
                    <span style={{ color:C.green }}>+{stats.pos}</span>/<span style={{ color:C.red }}>−{stats.neg}</span>
                  </span>
                )}
                <Icon name="eye" size={16} color={C.textDim} />
              </div>
            </div>
          );
        })}

        <button style={{ ...S.btn("ghost"), marginTop:20 }} onClick={goHome}>✓ Stunde beenden</button>
      </div>
    );
  };

  // ── RENDER: STUDENTS tab ─────────────────────────────────────────────────

  const renderStudents = () => (
    <div style={S.page}>
      <h2 style={{ fontSize:20, fontWeight:700, margin:"0 0 16px" }}>Kurse & Schülerlisten</h2>
      {courses.filter(c => c.criteriaType !== "none").map(course => (
        <div key={course.name} style={{ marginBottom:24 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:6 }}>
            <div>
              <div style={{ fontSize:15, fontWeight:600 }}>{course.name}</div>
              <div style={{ fontSize:12, color:C.textDim }}>
                {course.students.length} Schüler · {course.criteriaType==="fremdsprachen"?"FS-Bogen":"Allg. Bogen"}
              </div>
            </div>
            <button style={{ ...S.btnSm("primary"), display:"flex", alignItems:"center", gap:4, flexShrink:0 }}
              onClick={() => { setActiveCourse(course.name); setImportText(""); setShowImport(true); }}>
              <Icon name="upload" size={13} color="#fff" /> Import
            </button>
          </div>
          <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:10, padding:"4px 10px" }}>
            {course.students.map(st => (
              <div key={st.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, padding:"7px 0", borderBottom:`1px solid ${C.border}` }}>
                {editingStudentKey === studentKey(course.name, st.id) ? (
                  <input
                    autoFocus
                    value={editStudentValue}
                    onChange={e => setEditStudentValue(e.target.value)}
                    onKeyDown={e => {
                      if (e.key === "Enter") { renameStudent(course.name, st.id, editStudentValue); setEditingStudentKey(null); }
                      if (e.key === "Escape") setEditingStudentKey(null);
                    }}
                    onBlur={() => { renameStudent(course.name, st.id, editStudentValue); setEditingStudentKey(null); }}
                    style={{ flex:1, fontSize:13, padding:"5px 7px", background:C.surface, border:`1px solid ${C.accent}`, borderRadius:6, color:C.text, outline:"none" }}
                  />
                ) : (
                  <span style={{ fontSize:13, color:C.textDim, flex:1, cursor:"pointer" }}
                    onClick={() => { setEditingStudentKey(studentKey(course.name, st.id)); setEditStudentValue(st.name); }}>{st.name}</span>
                )}
                {confirmRemoveKey === studentKey(course.name, st.id) ? (
                  <div style={{ display:"flex", gap:6, flexShrink:0 }}>
                    <button style={{ ...S.btnSm("red"), padding:"5px 9px" }}
                      onClick={() => { removeStudent(course.name, st.id); setConfirmRemoveKey(null); }}>
                      <Icon name="check" size={12} color={C.red} />
                    </button>
                    <button style={{ ...S.btnSm("ghost"), padding:"5px 9px" }} onClick={() => setConfirmRemoveKey(null)}>
                      <Icon name="x" size={12} color={C.textDim} />
                    </button>
                  </div>
                ) : (
                  <button style={{ background:"none", border:"none", cursor:"pointer", padding:4, flexShrink:0, WebkitAppearance:"none" }}
                    onClick={() => setConfirmRemoveKey(studentKey(course.name, st.id))}>
                    <Icon name="trash" size={14} color={C.textMuted} />
                  </button>
                )}
              </div>
            ))}
            {addingToCourse === course.name ? (
              <div style={{ display:"flex", gap:6, padding:"8px 0" }}>
                <input
                  autoFocus
                  placeholder="Vorname Nachname"
                  value={addStudentValue}
                  onChange={e => setAddStudentValue(e.target.value)}
                  onKeyDown={e => {
                    if (e.key === "Enter") { addStudent(course.name, addStudentValue); setAddStudentValue(""); }
                    if (e.key === "Escape") { setAddingToCourse(null); setAddStudentValue(""); }
                  }}
                  style={{ flex:1, fontSize:13, padding:"7px 9px", background:C.surface, border:`1px solid ${C.border}`, borderRadius:6, color:C.text, outline:"none" }}
                />
                <button style={S.btnSm("primary")} onClick={() => { addStudent(course.name, addStudentValue); setAddStudentValue(""); }}>
                  <Icon name="check" size={13} color="#fff" />
                </button>
                <button style={S.btnSm("ghost")} onClick={() => { setAddingToCourse(null); setAddStudentValue(""); }}>
                  <Icon name="x" size={13} color={C.textDim} />
                </button>
              </div>
            ) : (
              <button style={{ background:"none", border:"none", color:C.accent, fontSize:12, fontWeight:600, padding:"9px 0", cursor:"pointer", WebkitAppearance:"none" }}
                onClick={() => { setAddingToCourse(course.name); setAddStudentValue(""); }}>
                + Schüler hinzufügen
              </button>
            )}
          </div>
        </div>
      ))}
    </div>
  );

  // ── RENDER: OVERVIEW tab ─────────────────────────────────────────────────

  const renderOverview = () => {
    const totalObs  = observations.filter(isRating).length;
    const thisWeek  = observations.filter(o => {
      if (!isRating(o)) return false;
      const diff = (new Date() - new Date(o.date)) / (1000*60*60*24);
      return diff <= 7;
    }).length;
    const totalCourses = courses.filter(c => c.criteriaType !== "none").length;

    return (
      <div style={S.page}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
          <h2 style={{ fontSize:20, fontWeight:700, margin:0 }}>Übersicht</h2>
          <button style={{ ...S.btnSm("primary"), display:"flex", alignItems:"center", gap:4 }}
            onClick={() => { setShowExport(true); setCopyOK(false); }}>
            <Icon name="download" size={13} color="#fff" /> Export
          </button>
        </div>

        <div style={{ display:"flex", gap:8, marginBottom:20 }}>
          <div style={S.statCard}>
            <div style={{ fontSize:24, fontWeight:700 }}>{totalObs}</div>
            <div style={{ fontSize:11, color:C.textDim, marginTop:2 }}>Beobachtungen</div>
          </div>
          <div style={S.statCard}>
            <div style={{ fontSize:24, fontWeight:700 }}>{thisWeek}</div>
            <div style={{ fontSize:11, color:C.textDim, marginTop:2 }}>Diese Woche</div>
          </div>
          <div style={S.statCard}>
            <div style={{ fontSize:24, fontWeight:700 }}>{totalCourses}</div>
            <div style={{ fontSize:11, color:C.textDim, marginTop:2 }}>Kurse</div>
          </div>
        </div>

        <div style={S.sectionLbl}>Pro Kurs — Beobachtungsstand</div>
        {courses.filter(c => c.criteriaType !== "none").map(course => {
          const cObs    = observations.filter(o => o.course === course.name && isRating(o));
          const stCount = new Set(cObs.map(o => o.studentId)).size;
          const readyCount = course.students.filter(st => getObsProgress(course.name, st.id).ready).length;
          const totalSt = course.students.length;
          const pct = totalSt > 0 ? Math.round((readyCount / totalSt) * 100) : 0;

          return (
            <div key={course.name} style={{ ...S.courseCard(false), cursor:"default", marginBottom:16 }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
                <div style={S.courseTitle}>{course.name}</div>
                <div style={{ fontSize:13, fontWeight:700, color:C.accent }}>{cObs.length} Eintr.</div>
              </div>

              {/* Fortschrittsbalken */}
              <div style={{ marginBottom:6 }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                  <span style={{ fontSize:11, color:C.textDim }}>
                    {readyCount}/{totalSt} Schüler bereit für Notenvorschlag
                  </span>
                  <span style={{ fontSize:11, color:C.textDim }}>{pct}%</span>
                </div>
                <div style={{ height:6, background:C.border, borderRadius:3, overflow:"hidden" }}>
                  <div style={{ height:"100%", width:`${pct}%`, background:pct===100?C.green:C.accent, borderRadius:3, transition:"width 0.3s" }} />
                </div>
              </div>

              {/* Schüler-Liste mit Status */}
              <div style={{ marginTop:8 }}>
                {course.students.map(st => {
                  const prog   = getObsProgress(course.name, st.id);
                  const grade  = getGradeProposal(course.name, st.id);
                  return (
                    <div key={st.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"5px 0", borderBottom:`1px solid ${C.border}` }}>
                      <span style={{ fontSize:12, color:C.text, flex:1 }}>{st.name}</span>
                      <span style={{ fontSize:11, color:C.textMuted, marginRight:8 }}>
                        {prog.count} Eintr. / {prog.days} Tage
                      </span>
                      {grade ? (
                        <span style={{ fontSize:11, fontWeight:700, color:grade.color, minWidth:32, textAlign:"right" }}>
                          Note {grade.grade}
                        </span>
                      ) : (
                        <span style={{ fontSize:10, color:C.textMuted, minWidth:32, textAlign:"right" }}>
                          {(() => {
                            // Both conditions must show. Reporting only the missing
                            // entries let "noch 1" appear when 2 more days were needed too.
                            const needEntries = MIN_ENTRIES - prog.count;
                            const needDays    = MIN_DAYS - prog.days;
                            if (needEntries > 0 && needDays > 0) return `noch ${needEntries} · ${needDays}T`;
                            if (needEntries > 0) return `noch ${needEntries}`;
                            return `${needDays}T fehlt`;
                          })()}
                        </span>
                      )}
                    </div>
                  );
                })}
              </div>
              <div style={{ fontSize:10, color:C.textMuted, marginTop:6 }}>
                Notenvorschlag ab {MIN_ENTRIES} Einträgen / {MIN_DAYS} verschiedenen Tagen · Pädagogische Einschätzung der Lehrkraft entscheidet.
              </div>
            </div>
          );
        })}

        <div style={S.sectionLbl}>Letzte 10 Einträge</div>
        {observations.length === 0 && (
          <div style={{ textAlign:"center", padding:"32px 0", color:C.textDim, fontSize:13 }}>
            Noch keine Einträge — starte eine Stunde!
          </div>
        )}
        {[...observations].reverse().slice(0,10).map(obs => {
          const course  = courses.find(c => c.name === obs.course);
          const student = course?.students.find(st => st.id === obs.studentId);
          const crit    = getCriteria(obs.course).find(c => c.id === obs.criterionId);
          return (
            <div key={obs.id} style={{ ...S.row, flexDirection:"column", alignItems:"flex-start", gap:3 }}>
              <div style={{ display:"flex", justifyContent:"space-between", width:"100%" }}>
                <span style={{ fontSize:13, fontWeight:600 }}>{student?.name || "?"}</span>
                <span style={{ fontSize:10, color:C.textDim }}>{obs.date} {obs.time}</span>
              </div>
              <div style={{ fontSize:12, color:C.textDim }}>
                {obs.course} · {crit?.short
                  || (obs.criterionId === "note" ? "Notiz"
                    : obs.criterionId === "skip" ? "heute nichts beobachtet"
                    : obs.criterionId)}
                {/* Only real ratings carry gut/schwach — a note is stored with "+"
                    and would otherwise read as praise. */}
                {isRating(obs) && <>
                  {" · "}
                  <span style={{ color:obs.rating==="+"?C.green:C.red, fontWeight:600 }}>
                    {obs.rating==="+"?"gut":"schwach"}
                  </span>
                </>}
                {obs.note && <span style={{ color:C.textMuted }}> — {obs.note}</span>}
              </div>
            </div>
          );
        })}
      </div>
    );
  };

  // ── RENDER: SETTINGS tab ─────────────────────────────────────────────────

  // ── RENDER: KLASSENBUCH ──────────────────────────────────────────────────

  const [logbookAll,    setLogbookAll]    = useState(false);
  const [logbookCourse, setLogbookCourse] = useState(null);  // null = alle Kurse

  const fmtLogDate = (d) => {
    const dt = new Date(`${d}T12:00:00`);
    return `${DAYS[dt.getDay()].slice(0,2)} ${String(dt.getDate()).padStart(2,"0")}.${String(dt.getMonth()+1).padStart(2,"0")}.`;
  };

  const renderLogbook = () => {
    // A lesson counts as held if anything at all was recorded for it.
    const keys = new Set([
      ...Object.keys(topics), ...Object.keys(absences), ...Object.keys(homework),
      ...observations.map(o => `${o.date}_${o.course}`),
    ]);
    const cutoff = new Date(Date.now() - 7*86400000).toISOString().slice(0,10);
    const rows = [...keys].map(k => {
      const i = k.indexOf("_");
      const date = k.slice(0, i), course = k.slice(i+1);
      const c = courses.find(x => x.name === course);
      const absentNames = (absences[k] || [])
        .map(id => c?.students.find(s => s.id === id)?.name)
        .filter(Boolean);
      const hw = homework[k];
      const missing = hw ? Object.values(hw).filter(v => v !== "done").length : 0;
      return {
        key:k, date, course, topic: topics[k] || "", absentNames,
        hwText: !hw ? null : missing === 0 ? "HA vollständig" : `HA: ${missing}× unvollständig`,
        obsCount: observations.filter(o => o.date === date && o.course === course && isRating(o)).length,
      };
    })
    .filter(r => logbookAll || r.date >= cutoff)
    .filter(r => !logbookCourse || r.course === logbookCourse)
    .sort((a,b) => a.key < b.key ? 1 : -1);

    // A Klassenbuch is kept per course, so group by course and start each group on
    // its own sheet when printing. One print then yields one page per course.
    const groups = [];
    rows.forEach(r => {
      const g = groups.find(x => x.course === r.course);
      if (g) g.rows.push(r); else groups.push({ course: r.course, rows: [r] });
    });
    groups.sort((a,b) => a.course.localeCompare(b.course, "de"));

    const withData = [...new Set([...keys].map(k => k.slice(k.indexOf("_")+1)))]
      .sort((a,b) => a.localeCompare(b, "de"));

    return (
      <div style={S.page} className="print-doc">
        <div className="no-print" style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
          <button style={{ background:"none", border:"none", color:C.accent, fontSize:13, fontWeight:600, cursor:"pointer", padding:0, WebkitAppearance:"none" }}
            onClick={() => setPage("settings")}>← Zurück</button>
          <button style={S.btnSm("primary")} onClick={() => window.print()}>Drucken / PDF</button>
        </div>

        <h2 style={{ fontSize:20, fontWeight:700, margin:"8px 0 2px" }}>
          Klassenbuch{logbookCourse ? ` · ${logbookCourse}` : ""}
        </h2>
        <div style={{ fontSize:12, color:C.textDim, marginBottom:14 }}>
          {logbookAll ? "Alle erfassten Stunden" : "Letzte 7 Tage"} · Philipp Tran-Huynh · Gymnasium Grootmoor
        </div>

        <div className="no-print" style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
          {[null, ...withData].map(c => (
            <button key={c || "alle"} onClick={() => setLogbookCourse(c)}
              style={{ background: logbookCourse === c ? C.accentSoft : C.card,
                       border:`1px solid ${logbookCourse === c ? C.accent : C.border}`,
                       color: logbookCourse === c ? C.accent : C.textDim,
                       borderRadius:20, padding:"5px 11px", fontSize:12,
                       fontWeight: logbookCourse === c ? 600 : 400,
                       cursor:"pointer", WebkitAppearance:"none" }}>
              {c || "Alle Kurse"}
            </button>
          ))}
        </div>

        <button className="no-print" style={{ ...S.btnSm("ghost"), marginBottom:16 }}
          onClick={() => setLogbookAll(v => !v)}>
          {logbookAll ? "Nur letzte 7 Tage" : "Alle Stunden zeigen"}
        </button>

        {rows.length === 0 && (
          <div style={{ textAlign:"center", padding:"40px 0", color:C.textDim, fontSize:13 }}>
            {logbookCourse ? `Für ${logbookCourse} ist hier noch nichts erfasst.` : "Noch keine Stunden erfasst."}
          </div>
        )}

        {groups.map(g => (
          <div key={g.course} className="logbook-group" style={{ marginBottom:22 }}>
            <div style={{ fontSize:13, fontWeight:700, color:C.accent, paddingBottom:6,
                          borderBottom:`2px solid ${C.border}`, marginBottom:2 }}>
              {g.course}
              <span style={{ fontWeight:400, color:C.textDim, fontSize:11 }}> · {g.rows.length} Stunden</span>
            </div>
            {g.rows.map(r => (
              <div key={r.key} className="logbook-row"
                style={{ padding:"10px 0", borderBottom:`1px solid ${C.border}` }}>
                <div style={{ display:"flex", justifyContent:"space-between", gap:10, marginBottom:2 }}>
                  <span style={{ fontSize:13, fontWeight:700 }}>{fmtLogDate(r.date)}</span>
                  <span style={{ fontSize:11, color:C.textDim, flexShrink:0 }}>
                    {r.obsCount > 0 ? `${r.obsCount} Beob.` : ""}
                  </span>
                </div>
                <div style={{ fontSize:13, marginBottom:3 }}>
                  {r.topic || <span style={{ color:C.textMuted, fontStyle:"italic" }}>kein Thema eingetragen</span>}
                </div>
                <div style={{ fontSize:11, color:C.textDim }}>
                  {r.absentNames.length ? `Fehlend: ${r.absentNames.join(", ")}` : "Vollzählig"}
                  {r.hwText ? ` · ${r.hwText}` : ""}
                </div>
              </div>
            ))}
          </div>
        ))}
      </div>
    );
  };

  const renderSettings = () => (
    <div style={S.page}>
      <h2 style={{ fontSize:20, fontWeight:700, margin:"0 0 16px" }}>Einstellungen</h2>

      {/* BACKUP — wichtigste Sektion ganz oben */}
      <div style={{ background:C.accentSoft, border:`1px solid ${C.accent}`, borderRadius:12, padding:"14px 16px", marginBottom:8 }}>
        <div style={{ fontSize:11, color:C.accent, fontWeight:700, letterSpacing:"0.06em", marginBottom:4 }}>DATENSICHERUNG</div>
        <div style={{ fontSize:13, color:C.text, marginBottom:8, lineHeight:"1.6" }}>
          Einmal pro Woche sichern — schützt vor Datenverlust bei App-Updates oder Browser-Cache-Löschung.
        </div>
        <div style={{ fontSize:11, color:C.textDim, marginBottom:12 }}>
          Sicherungs-Erinnerung: {lastAutoBackup
            ? `zuletzt vor ${Math.floor((Date.now()-new Date(lastAutoBackup).getTime())/86400000)} Tag(en) — alle 4–7 Tage erscheint auf der Startseite ein Hinweis zum Antippen`
            : "erscheint auf der Startseite, sobald Beobachtungen erfasst sind"}
        </div>
        <button style={{ ...S.btn("primary"), marginTop:0 }} onClick={exportBackup}>
          <span style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
            <Icon name="download" size={16} color="#fff" /> Backup herunterladen (.json)
          </span>
        </button>
        <div style={{ ...S.sectionLbl, marginTop:16 }}>Backup wiederherstellen</div>
        <div style={{ fontSize:12, color:C.textDim, marginBottom:8 }}>
          Backup-Datei auswählen — alle aktuellen Daten werden ersetzt.
        </div>
        <label style={{ display:"block", background:"transparent", border:`1px solid ${C.border}`, borderRadius:10, padding:"13px 20px", fontSize:14, fontWeight:600, color:C.text, cursor:"pointer", textAlign:"center", marginTop:0 }}>
          <Icon name="upload" size={16} color={C.textDim} /> Backup importieren
          <input type="file" accept=".json" style={{ display:"none" }}
            onChange={e => importBackup(e.target.files[0])} />
        </label>
        {backupImportOK && (
          <div style={{ fontSize:12, color:C.green, marginTop:8, fontWeight:600 }}>✓ Backup erfolgreich wiederhergestellt!</div>
        )}
        {backupError && (
          <div style={{ fontSize:12, color:C.red, marginTop:8 }}>{backupError}</div>
        )}
      </div>

      <div style={S.sectionLbl}>Klassenbuch</div>
      <button style={{ ...S.btn("ghost"), display:"flex", alignItems:"center", justifyContent:"center", gap:8, marginTop:0 }}
        onClick={() => setPage("logbook")}>
        <Icon name="chart" size={16} color={C.textDim} /> Stunden-Übersicht (Thema · Fehlende · HA)
      </button>

      <div style={S.sectionLbl}>CSV / PDF Export</div>
      <button style={{ ...S.btn("ghost"), display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}
        onClick={() => { setShowExport(true); setCopyOK(false); }}>
        <Icon name="download" size={16} color={C.textDim} /> Daten exportieren
      </button>

      <div style={{ ...S.sectionLbl, marginTop:24 }}>Daten zurücksetzen</div>
      <button style={{ ...S.btn("ghost"), borderColor:C.red, color:C.red }}
        onClick={() => {
          if (window.confirm("Wirklich ALLE Daten löschen? Dies kann nicht rückgängig gemacht werden.")) {
            ["obs_courses","obs_observations","obs_homework","obs_absences","obs_topics",
             "obs_session","obs_lastAutoBackup","obs_nextAutoBackupDays"].forEach(k => localStorage.removeItem(k));
            window.location.reload();
          }
        }}>
        <span style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
          <Icon name="trash" size={16} color={C.red} /> Alle Daten löschen
        </span>
      </button>

      <div style={{ ...S.sectionLbl, marginTop:24 }}>Info</div>
      <div style={{ fontSize:12, color:C.textDim, lineHeight:"1.9", background:C.card, border:`1px solid ${C.border}`, borderRadius:10, padding:"14px 16px" }}>
        <strong style={{ color:C.text }}>ClassPulse — Participation Tracker v1.1</strong><br/>
        Daten lokal auf diesem Gerät (localStorage).<br/>
        Kein Server · kein Login · kein Tracking.<br/><br/>
        <strong style={{ color:C.text }}>Bewertungsbögen:</strong><br/>
        Englisch (8a, 12. Kl.) → Fremdsprachen-Bogen (8 Kriterien)<br/>
        Alle anderen Fächer → Allg. Grootmoor-Bogen (8 Kriterien, 3/2/3)<br/><br/>
        <strong style={{ color:C.text }}>Notenvorschlag:</strong><br/>
        Ab {MIN_ENTRIES} Einträgen / {MIN_DAYS} verschiedenen Tagen pro Schüler.<br/>
        Pädagogische Einschätzung der Lehrkraft entscheidet.<br/><br/>
        <strong style={{ color:C.text }}>Gewichtung:</strong><br/>
        60% sonstige Leistungen / 40% schriftlich
      </div>

      <div style={{ ...S.sectionLbl, marginTop:24 }}>PDF-Export für Gespräche</div>
      <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:10, padding:"14px 16px" }}>
        <div style={{ fontSize:12, color:C.text, fontWeight:600, marginBottom:6 }}>
          Schöne Schüler-PDFs zum Halbjahr:
        </div>
        <div style={{ fontSize:12, color:C.textDim, lineHeight:"2" }}>
          1. Hier: „Backup herunterladen" → .json Datei<br/>
          2. GitHub Repo: CLASSPULSE_PDF_RULES.md herunterladen<br/>
          3. Claude Momentum-Chat öffnen<br/>
          4. Beide Dateien hochladen<br/>
          5. Schreiben: „Erstell mir die ClassPulse PDF-Exports"<br/>
          6. PDF herunterladen — fertig
        </div>
        <div style={{ fontSize:11, color:C.textMuted, marginTop:8, paddingTop:8, borderTop:`1px solid ${C.border}` }}>
          GitHub: glowgiver/classpulse · classpulse_export.py + CLASSPULSE_PDF_RULES.md
        </div>
      </div>

      <div style={{ ...S.sectionLbl, marginTop:24 }}>PWA-Installation (iPad)</div>
      <div style={{ fontSize:12, color:C.textDim, lineHeight:"1.9", background:C.card, border:`1px solid ${C.border}`, borderRadius:10, padding:"14px 16px" }}>
        Safari öffnen → Teilen-Symbol (□↑) → „Zum Home-Bildschirm" → Hinzufügen.<br/>
        App läuft dann vollbildig und offline.
      </div>
    </div>
  );

  // ── RENDER: IMPORT MODAL ─────────────────────────────────────────────────

  const renderImportModal = () => (
    <div style={S.modal} onClick={() => setShowImport(false)}>
      <div style={S.modalInner} onClick={e => e.stopPropagation()}>
        <h3 style={{ fontSize:18, fontWeight:700, marginBottom:4 }}>Schülerliste importieren</h3>
        <p style={{ fontSize:13, color:C.textDim, marginBottom:12 }}>
          {activeCourse} — ein Name pro Zeile (aus IServ kopieren)
        </p>
        <textarea style={S.textarea} value={importText} onChange={e => setImportText(e.target.value)}
          placeholder={"Max Mustermann\nErika Musterfrau\nAli Yilmaz\n…"} autoFocus />
        <div style={{ fontSize:12, color:C.textDim, marginTop:6, marginBottom:12 }}>
          {importText.split("\n").filter(l=>l.trim()).length} Namen erkannt
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <button style={S.btn("ghost")} onClick={() => setShowImport(false)}>Abbrechen</button>
          <button style={S.btn("primary")} onClick={() => importStudents(activeCourse)}>
            Importieren
          </button>
        </div>
      </div>
    </div>
  );

  // ── SESSION ROUTER ───────────────────────────────────────────────────────

  const renderSession = () => {
    if (!activeCourse) return renderHome();
    switch(sessionPhase) {
      case "absent":   return renderAbsent();
      case "homework": return renderHomework();
      case "observe":  return renderObserve();
      default:         return renderHome();
    }
  };

  // ── LAYOUT ───────────────────────────────────────────────────────────────

  return (
    <div style={S.app}>
      {/* Header */}
      <div style={S.header} className="no-print">
        <div>
          <div style={S.logo}>ClassPulse</div>
          <div style={S.subtitle}>
            {DAYS[new Date().getDay()]} · {new Date().toLocaleDateString("de-DE")}
            {activeCourse && sessionPhase !== "select" && ` · ${activeCourse}`}
          </div>
        </div>
        {activeCourse && sessionPhase !== "select" && (
          <button style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", padding:"4px 8px", fontSize:13 }}
            onClick={goHome}>✕</button>
        )}
      </div>

      {/* Page content */}
      {page==="home"     ? renderSession()  :
       page==="students" ? renderStudents() :
       page==="overview" ? renderOverview() :
       page==="logbook"  ? renderLogbook()  :
       renderSettings()}

      {/* Import modal */}
      {showImport && renderImportModal()}

      {/* Export modal */}
      {showExport && (
        <div style={S.modal} onClick={() => setShowExport(false)}>
          <div style={S.modalInner} onClick={e => e.stopPropagation()}>
            <h3 style={{ fontSize:18, fontWeight:700, marginBottom:4 }}>Export</h3>
            <p style={{ fontSize:13, color:C.textDim, marginBottom:20 }}>
              Datei direkt herunterladen — Excel öffnet sie sauber mit allen Spalten.
            </p>

            {/* Pro-Kurs Download */}
            <div style={S.sectionLbl}>Pro Kurs</div>
            {courses.filter(c => c.criteriaType !== "none").map(course => {
              const courseObs = observations.filter(o => o.course === course.name);
              return (
                <div key={course.name} style={{ ...S.row, cursor:"pointer" }} onClick={() => {
                  const criteria = getCriteria(course.name);
                  const lines = [];
                  // BOM für Excel-Kompatibilität
                  lines.push(`Name,${criteria.map(c => c.short).join(";")};HA-Quote;Fehltage;Gesamt`);
                  course.students.forEach(st => {
                    const obs = observations.filter(o => o.course === course.name && o.studentId === st.id);
                    const critSummary = criteria.map(crit => {
                      const pos = obs.filter(o => o.criterionId === crit.id && o.rating === "+").length;
                      const neg = obs.filter(o => o.criterionId === crit.id && o.rating === "-").length;
                      return (pos === 0 && neg === 0) ? "-" : `+${pos}/-${neg}`;
                    });
                    let hwTotal = 0, hwDone = 0;
                    Object.entries(homework).forEach(([key, val]) => {
                      if (key.endsWith(`_${course.name}`)) {
                        const status = val[st.id];
                        if (status === undefined) return;  // absent, or not yet in the course
                        hwTotal++;
                        if (status === "done") hwDone++;
                        else if (status === "half") hwDone += 0.5;
                      }
                    });
                    const hwPct = hwTotal > 0 ? `${Math.round((hwDone/hwTotal)*100)}%` : "-";
                    let absentCount = 0;
                    Object.entries(absences).forEach(([key, ids]) => {
                      if (key.endsWith(`_${course.name}`) && ids.includes(st.id)) absentCount++;
                    });
                    lines.push(`"${st.name}";${critSummary.join(";")};${hwPct};${absentCount};${obs.length}`);
                  });
                  const csv = "\uFEFF" + lines.join("\r\n");
                  const blob = new Blob([csv], { type:"text/csv;charset=utf-8;" });
                  const url  = URL.createObjectURL(blob);
