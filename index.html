<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ClassPulse" />
  <meta name="theme-color" content="#0f1117" />
  <title>ClassPulse — Participation Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #0f1117; color: #E4E4E7; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; }
    @media (prefers-color-scheme: light) {
      html, body { background: #F5F6F8; color: #14161C; }
    }
    #root { height: 100%; }
    /* Safe area padding for notch/home-indicator */
    .safe-top    { padding-top: max(16px, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(80px, calc(60px + env(safe-area-inset-bottom))); }

    /* Print: turn the dark app into a plain paper document. The app styles all
       colours inline, so these rules need !important to win. Save as PDF via
       Teilen → Drucken (iOS) or ⌘P (Mac). */
    @media print {
      @page { margin: 16mm; }
      html, body { height: auto !important; background: #fff !important; color: #111 !important; }
      .no-print { display: none !important; }
      .print-doc { padding: 0 !important; }
      .print-doc, .print-doc * {
        background: transparent !important;
        color: #111 !important;
        box-shadow: none !important;
      }
      .logbook-row {
        border-bottom: 1px solid #bbb !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      /* A Klassenbuch is per course — give each one its own sheet. */
      .logbook-group + .logbook-group {
        break-before: page;
        page-break-before: always;
      }
      .logbook-group > div:first-child { border-bottom: 2px solid #666 !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

// ─── DATA ────────────────────────────────────────────────────────────────────

const SCHEDULE = [
  { day: 1, start: "08:00", end: "09:30", course: "8a Englisch",         type: "double" },
  { day: 1, start: "11:35", end: "13:05", course: "11P Social Studies",  type: "double" },
  { day: 1, start: "13:20", end: "14:50", course: "Jg9 Social Studies",  type: "double" },
  { day: 2, start: "08:00", end: "09:30", course: "Jg10 Social Studies", type: "double" },
  { day: 3, start: "08:00", end: "09:30", course: "12. Kl. Englisch",    type: "double" },
  { day: 3, start: "09:50", end: "11:20", course: "11P Social Studies",  type: "double" },
  { day: 3, start: "11:35", end: "12:20", course: "Jg9 Social Studies",  type: "single" },
  { day: 4, start: "09:50", end: "11:20", course: "Jg8 History",         type: "double" },
  { day: 4, start: "11:35", end: "12:20", course: "8a Englisch",         type: "single" },
  { day: 4, start: "13:20", end: "14:50", course: "11P WiE",             type: "double" },
  { day: 5, start: "09:50", end: "11:20", course: "12. Kl. Englisch",    type: "double" },
  { day: 5, start: "11:35", end: "13:05", course: "Jg10 History",        type: "double" },
  { day: 5, start: "13:20", end: "14:50", course: "12. Kl. WiE",        type: "double" },
];

const DAYS = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

const ENGLISH_COURSES = ["8a Englisch", "12. Kl. Englisch"];

// ── Fremdsprachen: 8 Kriterien exakt aus Grootmoor-Bogen ──
const FREMDSPRACHEN_CRITERIA = [
  {
    id:"fs1", short:"Beteiligung", area:"Engagement",
    full:"Beteiligt sich aktiv und konzentriert am Unterrichtsgeschehen.",
    examples:["Meldet sich regelmäßig", "Ist aufmerksam dabei", "Arbeitet aktiv in Phasen mit"],
  },
  {
    id:"fs2", short:"Beiträge", area:"Engagement",
    full:"Äußert inhaltlich gute Beiträge, die den Unterricht voranbringen.",
    examples:["Bringt neue Ideen ein", "Baut sinnvoll auf anderen auf", "Kommt auf den Punkt"],
  },
  {
    id:"fs3", short:"HA & Heft", area:"Arbeitsverhalten",
    full:"Erstellt Hausaufgaben vollständig und sorgfältig; führt Heft/Mappen übersichtlich.",
    examples:["HA vollständig da", "Heft ordentlich geführt", "Vorbereitung sichtbar"],
  },
  {
    id:"fs4", short:"Verantwortung", area:"Arbeitsverhalten",
    full:"Übernimmt Verantwortung für den eigenen Lern- und Arbeitsprozess, hält sich an Regeln.",
    examples:["Arbeitet selbstständig", "Hält Regeln ein", "Motiviert auch in Gruppenarbeit"],
  },
  {
    id:"fs5", short:"Vokabeln/Gram.", area:"Sprache",
    full:"Verwendet Vokabeln und Grammatik angemessen.",
    examples:["Trifft die richtigen Wörter", "Grammatik weitgehend korrekt", "Variierter Wortschatz"],
  },
  {
    id:"fs6", short:"Sprachfluss", area:"Sprache",
    full:"Zeigt in mündlichen Phasen flüssigen Sprachfluss und korrekte Aussprache.",
    examples:["Spricht ohne lange Pausen", "Aussprache verständlich", "Formuliert flüssig"],
  },
  {
    id:"fs7", short:"Fremdsprache", area:"Sprache",
    full:"Verwendet im Unterricht durchgängig die Fremdsprache.",
    examples:["Spricht kein Deutsch", "Korrigiert sich selbst auf Englisch", "Auch bei Schwierigkeiten auf Englisch"],
  },
  {
    id:"fs8", short:"Tests", area:"Sprache",
    full:"Zeigt in Vokabel- und Grammatiktests, dass er/sie regelmäßig lernt und wiederholt.",
    examples:["Note 1–2 → + eintragen", "Note 5–6 → − eintragen", "Note 3–4 → nichts eintragen (Durchschnitt)"],
  },
];

// ── Allgemein: 8 Kriterien (3/2/3) aus Grootmoor-Bogen ──
const GENERAL_CRITERIA = [
  // INHALT (3)
  {
    id:"gi1", short:"Sachlich richtig", area:"Inhalt",
    full:"Beiträge passen zur Aufgabe und sind sachlich richtig.",
    examples:["Fakten stimmen", "Bleibt beim Thema", "Kein inhaltlicher Fehler"],
  },
  {
    id:"gi2", short:"Argumente", area:"Inhalt",
    full:"Argumente bauen sinnvoll aufeinander auf und erschließen viele Seiten eines Problems.",
    examples:["Pro & Contra berücksichtigt", "Belegt seine Aussagen", "Denkt über den ersten Punkt hinaus"],
  },
  {
    id:"gi3", short:"Reflexion", area:"Inhalt",
    full:"Reflektiert Ergebnisse kritisch und ordnet sie im Sachzusammenhang ein.",
    examples:["'Das stimmt, aber...'", "Vergleicht mit Vorwissen", "Hinterfragt eigene Aussagen am Stundenende"],
  },
  // FACHMETHODEN (2)
  {
    id:"gm1", short:"Bezugstexte", area:"Fachmethoden",
    full:"Geht mit Bezugstexten, Medien und Material angemessen und sinnvoll um.",
    examples:["Zitiert korrekt aus dem Text", "Nutzt Karte/Grafik richtig", "Belegt Aussagen mit Material"],
  },
  {
    id:"gm2", short:"Arbeitsplanung", area:"Fachmethoden",
    full:"Kann Arbeit sinnvoll planen, einteilen und durchführen.",
    examples:["Fängt sofort an in Gruppenarbeit", "Teilt Aufgaben sinnvoll auf", "Kommt zum Ergebnis in der Zeit"],
  },
  // SPRACHE & KOMMUNIKATION (3)
  {
    id:"gs1", short:"Fachsprache", area:"Sprache & Komm.",
    full:"Drückt sich treffend und differenziert aus und verwendet die Fachsprache richtig.",
    examples:["Nutzt Fachbegriffe korrekt", "Formuliert präzise", "Kein 'irgendwie' oder 'halt'"],
  },
  {
    id:"gs2", short:"Sprachrichtigkeit", area:"Sprache & Komm.",
    full:"Beiträge sind sprachlich richtig und strukturiert.",
    examples:["Vollständige Sätze", "Klarer Satzbau", "Verständlich formuliert"],
  },

];

// Kurse starten leer. 25 Platzhalter „Schüler/in 1…25" ließen den ganzen Ablauf
// funktionieren — man konnte eine Stunde darauf erfassen, und der spätere Import
// vergab neue IDs und trennte genau diese Einträge ab. Ein leerer Zustand, der
// eine Aufgabe stellt, ist besser als ein gefüllter, der eine Falle stellt.
const DEFAULT_STUDENTS = [];

const COURSES_META = [
  { name: "8a Englisch",         criteriaType: "fremdsprachen", classGroup: "8a"   },
  { name: "Jg8 History",         criteriaType: "general",       classGroup: "Jg8"  },
  { name: "Jg9 Social Studies",  criteriaType: "general",       classGroup: "Jg9"  },
  { name: "11P Social Studies",  criteriaType: "general",       classGroup: "11P"  },
  { name: "Jg10 Social Studies", criteriaType: "general",       classGroup: "Jg10" },
  { name: "Jg10 History",        criteriaType: "general",       classGroup: "Jg10" },
  { name: "12. Kl. Englisch",    criteriaType: "fremdsprachen", classGroup: "12Kl" },
  { name: "11P WiE",             criteriaType: "general",       classGroup: "11P"  },
  { name: "12. Kl. WiE",         criteriaType: "general",       classGroup: "12Kl" },
];

// ─── HELPERS ─────────────────────────────────────────────────────────────────

const dateKey = (d = new Date()) => d.toISOString().slice(0,10);

// Notes and "nothing to observe today" markers ride in the same list as ratings
// but must never be counted as one. They still carry a date, so they do keep a
// student out of the suggestion queue — which is the point of the skip marker.
const NON_RATING = new Set(["note", "skip"]);
const isRating = (o) => !NON_RATING.has(o.criterionId);

const loadData = (key, fallback) => {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
};
const saveData = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} };

// DiViS shows both of these as cross-class courses (9 Soc91 draws on 9a/9b/9d,
// 8 His82 on 8a/8d/8e/8f), so the class-specific names were simply wrong.
// The course name is the foreign key for observations, homework and absences,
// so anything already stored has to be carried over with it — otherwise the old
// entries survive in storage but belong to a course that no longer exists.
const COURSE_RENAMES = {
  "9c Social Studies": "Jg9 Social Studies",
  "8a History":        "Jg8 History",
};

const migrateCourseNames = () => {
  try {
    if (localStorage.getItem("obs_courseRename_v1")) return;
    const ren = (n) => COURSE_RENAMES[n] || n;

    const courses = loadData("obs_courses", null);
    if (courses) saveData("obs_courses", courses.map(c => ({ ...c, name: ren(c.name) })));

    const obs = loadData("obs_observations", null);
    if (obs) saveData("obs_observations", obs.map(o => ({ ...o, course: ren(o.course) })));

    // homework/absences are keyed "YYYY-MM-DD_Kursname"; split at the first "_"
    // only, since course names may contain further underscores.
    ["obs_homework", "obs_absences"].forEach(key => {
      const val = loadData(key, null);
      if (!val) return;
      const out = {};
      Object.entries(val).forEach(([k, v]) => {
        const i = k.indexOf("_");
        out[i < 0 ? k : `${k.slice(0, i)}_${ren(k.slice(i + 1))}`] = v;
      });
      saveData(key, out);
    });

    const session = loadData("obs_session", null);
    if (session && session.activeCourse) {
      saveData("obs_session", { ...session, activeCourse: ren(session.activeCourse) });
    }

    localStorage.setItem("obs_courseRename_v1", "1");
  } catch(e) {}
};
migrateCourseNames();

// criteriaType is the source of truth; ENGLISH_COURSES only fills in for a course
// that isn't in COURSES_META (e.g. one restored from an older backup). A course
// marked "none" is not graded at all, so it gets no criteria.
const getCriteria = (courseName) => {
  const meta = COURSES_META.find(c => c.name === courseName);
  if (meta?.criteriaType === "none") return [];
  if (meta?.criteriaType === "fremdsprachen") return FREMDSPRACHEN_CRITERIA;
  if (meta?.criteriaType === "general")       return GENERAL_CRITERIA;
  return ENGLISH_COURSES.includes(courseName) ? FREMDSPRACHEN_CRITERIA : GENERAL_CRITERIA;
};

const getCurrentSlot = () => {
  const now = new Date();
  const day = now.getDay();
  const hhmm = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  return SCHEDULE.find(s => s.day === day && hhmm >= s.start && hhmm <= s.end) || null;
};

// ─── COLORS & STYLES ─────────────────────────────────────────────────────────

// Zwei Paletten. Der Klassenraum am Fenster ist der hellste Ort im Gebäude —
// eine dunkle Fläche spiegelt dort das Licht. Alle Wertepaare sind gegen
// WCAG AA gerechnet (Fließtext 4,5:1), nicht invertiert.
const PALETTE = {
  dark: {
    bg:         "#0f1117",
    card:       "#1a1d27",
    accent:     "#6C8EEF",
    accentSoft: "rgba(108,142,239,0.12)",
    green:      "#4ADE80",
    greenSoft:  "rgba(74,222,128,0.12)",
    red:        "#F87171",
    redSoft:    "rgba(248,113,113,0.12)",
    amber:      "#FBBF24",
    amberSoft:  "rgba(251,191,36,0.12)",
    text:       "#E4E4E7",
    textDim:    "#9CA0AD",
    textMuted:  "#8A8F9E",
    onFill:     "#101319",
    border:     "#27272A",
    surface:    "#18181B",
  },
  light: {
    bg:         "#F5F6F8",
    card:       "#FFFFFF",
    accent:     "#2F49BE",   // 7,4:1 auf Weiß
    accentSoft: "rgba(47,73,190,0.10)",
    green:      "#0F7040",   // 5,6:1
    greenSoft:  "rgba(15,112,64,0.10)",
    red:        "#B3261E",   // 6,4:1
    redSoft:    "rgba(179,38,30,0.09)",
    amber:      "#7A4E00",   // 7,0:1
    amberSoft:  "rgba(122,78,0,0.10)",
    text:       "#14161C",
    textDim:    "#585E6B",   // 6,6:1
    textMuted:  "#6A7080",   // 4,9:1
    onFill:     "#FFFFFF",   // auf den kräftigen Hellmodus-Farben
    border:     "#DCDFE5",
    surface:    "#EEF0F3",
  },
};

const prefersLight = () => {
  try { return window.matchMedia("(prefers-color-scheme: light)").matches; }
  catch(e) { return false; }
};

let C = PALETTE[prefersLight() ? "light" : "dark"];

const buildS = () => ({
  app:         { minHeight:"100vh", background:C.bg, color:C.text, fontFamily:"-apple-system,'SF Pro Text',system-ui,sans-serif" },
  header:      { padding:"max(16px,env(safe-area-inset-top)) 20px 14px", borderBottom:`1px solid ${C.border}`, display:"flex", alignItems:"center", justifyContent:"space-between", background:C.bg, position:"sticky", top:0, zIndex:50 },
  logo:        { fontSize:17, fontWeight:700, letterSpacing:"-0.02em" },
  subtitle:    { fontSize:13, color:C.textDim, marginTop:2 },
  nav:         { position:"fixed", bottom:0, left:0, right:0, background:C.card, borderTop:`1px solid ${C.border}`, display:"flex", justifyContent:"space-around", padding:`10px 0 max(14px,env(safe-area-inset-bottom))`, zIndex:100 },
  navBtn:   a  => ({ background:"none", border:"none", color:a?C.accent:C.textDim, fontSize:11, fontWeight:a?600:400, display:"flex", flexDirection:"column", alignItems:"center", gap:3, cursor:"pointer", padding:"9px 16px", WebkitAppearance:"none" }),
  page:        { padding:"16px 20px", paddingBottom:"160px" },
  sectionLbl:  { fontSize:13, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.08em", color:C.textDim, marginBottom:8, marginTop:20 },
  courseCard: a => ({ background:a?C.accentSoft:C.card, border:`1px solid ${a?C.accent:C.border}`, borderRadius:12, padding:"14px 16px", marginBottom:8, cursor:"pointer" }),
  courseTitle: { fontSize:15, fontWeight:600 },
  courseMeta:  { fontSize:13, color:C.textDim, marginTop:2 },
  badge:    c  => ({ display:"inline-block", padding:"2px 8px", borderRadius:20, fontSize:13, fontWeight:600, background:c==="blue"?C.accentSoft:C.greenSoft, color:c==="blue"?C.accent:C.green, marginLeft:8 }),
  btn:      v  => ({ background:v==="primary"?C.accent:v==="green"?C.green:"transparent", color:v==="primary"||v==="green"?C.onFill:C.text, border:v==="ghost"?`1px solid ${C.border}`:"none", borderRadius:10, padding:"14px 20px", fontSize:15, fontWeight:600, cursor:"pointer", width:"100%", marginTop:8, WebkitAppearance:"none" }),
  btnSm:    v  => ({ background:v==="primary"?C.accent:v==="green"?C.greenSoft:v==="red"?C.redSoft:v==="amber"?C.amberSoft:"transparent", color:v==="primary"?C.onFill:v==="green"?C.green:v==="red"?C.red:v==="amber"?C.amber:C.text, border:v==="ghost"?`1px solid ${C.border}`:"none", borderRadius:8, padding:"12px 16px", fontSize:15, fontWeight:600, cursor:"pointer", WebkitAppearance:"none" }),
  row:         { display:"flex", alignItems:"center", justifyContent:"space-between", padding:"14px", background:C.card, borderRadius:10, marginBottom:6, border:`1px solid ${C.border}` },
  critCard:    { background:C.card, border:`1px solid ${C.border}`, borderRadius:10, padding:"12px 14px", marginBottom:6 },
  textarea:    { width:"100%", padding:"12px 14px", background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, color:C.text, fontSize:15, outline:"none", minHeight:120, resize:"vertical", fontFamily:"inherit", boxSizing:"border-box" },
  modal:       { position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", zIndex:200, display:"flex", alignItems:"flex-end", justifyContent:"center" },
  modalInner:  { background:C.card, borderRadius:"16px 16px 0 0", padding:"20px 20px max(24px,env(safe-area-inset-bottom))", width:"100%", maxWidth:520, maxHeight:"88vh", overflowY:"auto" },
  statCard:    { background:C.card, border:`1px solid ${C.border}`, borderRadius:12, padding:"14px 16px", flex:1, textAlign:"center" },
});

let S = buildS();

// Die Inline-Styles lesen C und S beim Rendern. Es genügt daher, beide Bindungen
// auszutauschen und einmal neu zu rendern — kein Umbau der 2000 Zeilen darunter.
const applyTheme = () => {
  C = PALETTE[prefersLight() ? "light" : "dark"];
  S = buildS();
  document.documentElement.style.background = C.bg;
  document.body.style.background = C.bg;
  document.body.style.color = C.text;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", C.bg);
};
applyTheme();

// ─── ICON ────────────────────────────────────────────────────────────────────

const Icon = ({ name, size=20, color=C.textDim }) => {
  const paths = {
    home:     <><path d="M3 12l9-8 9 8"/><path d="M5 10v8a1 1 0 001 1h3v-5h6v5h3a1 1 0 001-1v-8"/></>,
    users:    <><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></>,
    chart:    <><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></>,
    settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></>,
    eye:      <><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>,
    upload:   <><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>,
    download: <><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
    trash:    <><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></>,
    check:    <><polyline points="20 6 9 17 4 12"/></>,
    x:        <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      {paths[name]}
    </svg>
  );
};

// ─── APP ─────────────────────────────────────────────────────────────────────

function App() {
  const [page,         setPage]         = useState("home");
  const [courses,      setCourses]      = useState(() => loadData("obs_courses", COURSES_META.map(c => ({ ...c, students: [...DEFAULT_STUDENTS] }))));
  const [observations, setObservations] = useState(() => loadData("obs_observations", []));
  const [homework,     setHomework]     = useState(() => loadData("obs_homework", {}));
  const [absences,     setAbsences]     = useState(() => loadData("obs_absences", {}));
  // Lesson topic per course and day, same "YYYY-MM-DD_Kursname" key as the two above.
  const [topics,       setTopics]       = useState(() => loadData("obs_topics", {}));

  // A locked phone or an app switch discards the page, so the running session is
  // restored from storage — but only if it is from today.
  const [restored] = useState(() => {
    const s = loadData("obs_session", null);
    return s && s.date === dateKey() && s.activeCourse ? s : null;
  });

  const [activeCourse,  setActiveCourse]  = useState(restored?.activeCourse ?? null);
  const [activeStudent, setActiveStudent] = useState(null);  // land on the list, not inside a student
  const [sessionPhase,  setSessionPhase]  = useState(restored?.sessionPhase ?? "select");

  const [todayAbsent,  setTodayAbsent]  = useState(restored?.todayAbsent  ?? []);
  const [hwActive,     setHwActive]     = useState(restored?.hwActive     ?? false);
  const [hwExceptions, setHwExceptions] = useState(restored?.hwExceptions ?? {});

  const [noteText,      setNoteText]      = useState("");
  const [showImport,    setShowImport]    = useState(false);
  const [importText,    setImportText]    = useState("");
  const [showExport,    setShowExport]    = useState(false);
  const [copyOK,        setCopyOK]        = useState(false);
  const [infoCrit,      setInfoCrit]      = useState(null);
  const [openCourse,   setOpenCourse]    = useState(null);
  const [openStats,    setOpenStats]     = useState(null);
  const [nameFilter,   setNameFilter]    = useState("");   // Beobachten-Liste
  const [hwFilter,     setHwFilter]      = useState("");   // Hausaufgaben-Phase
  // Notenvorschläge stehen in der Übersicht neben Klarnamen, untereinander,
  // in Rot und Grün — ein Blick über die Schulter genügt für ein Klassenranking.
  // Standardmäßig verdeckt; ein Tipp deckt sie für 30 Sekunden auf.
  const [gradesVisible, setGradesVisible] = useState(false);
  const [showAttendance,setShowAttendance]= useState(false);
  // Nachtragen: eine Vertretung gibt die Anwesenheitsliste oft erst nach der
  // Stunde weiter — Anwesenheit und Thema müssen dann für einen vergangenen
  // Tag nachtragbar sein, ohne die laufende Live-Session anzufassen.
  const [showBackfill,   setShowBackfill]   = useState(false);
  const [backfillCourse, setBackfillCourse] = useState(null);
  const [backfillDate,   setBackfillDate]   = useState("");
  const [backfillAbsent, setBackfillAbsent] = useState([]);
  const [backfillTopic,  setBackfillTopic]  = useState("");
  const [showBackup,    setShowBackup]    = useState(false);
  const [backupImportOK,setBackupImportOK]= useState(false);
  const [backupError,   setBackupError]  = useState("");

  const [editingStudentKey, setEditingStudentKey] = useState(null);
  const [editStudentValue,  setEditStudentValue]  = useState("");
  const [addingToCourse,    setAddingToCourse]    = useState(null);
  const [addStudentValue,   setAddStudentValue]   = useState("");
  const [confirmRemoveKey,  setConfirmRemoveKey]  = useState(null);
  const studentKey = (courseName, studentId) => `${courseName}::${studentId}`;

  const [confirmNoteId, setConfirmNoteId] = useState(null);
  // Die iOS-Tastatur belegt im Hochformat rund 336pt. Tab-Leiste und Toast sind
  // position:fixed und schwebten über dem Feld, in das man gerade tippt.
  const [typing, setTyping] = useState(false);
  const inputFocus = {
    onFocus: (e) => {
      setTyping(true);
      setTimeout(() => e.target.scrollIntoView({ block:"center", behavior:"smooth" }), 250);
    },
    onBlur: () => setTyping(false),
  };
  const [topicEditing, setTopicEditing] = useState(false);
  const [topicDraft,   setTopicDraft]   = useState("");

  const setTopicFor = (courseName, value) => {
    const key = `${dateKey()}_${courseName}`;
    setTopics(prev => {
      const next = { ...prev };
      if (value.trim()) next[key] = value.trim(); else delete next[key];
      return next;
    });
  };

  const openBackfill = (courseName, date) => {
    const key = `${date}_${courseName}`;
    setBackfillCourse(courseName);
    setBackfillDate(date);
    setBackfillAbsent(absences[key] || []);
    setBackfillTopic(topics[key] || "");
  };

  const toggleBackfillAbsent = (studentId) => {
    setBackfillAbsent(prev => prev.includes(studentId) ? prev.filter(i => i !== studentId) : [...prev, studentId]);
  };

  const saveBackfill = () => {
    const key = `${backfillDate}_${backfillCourse}`;
    setAbsences(prev => ({ ...prev, [key]: backfillAbsent }));
    setTopics(prev => {
      const next = { ...prev };
      if (backfillTopic.trim()) next[key] = backfillTopic.trim(); else delete next[key];
      return next;
    });
    setShowBackfill(false);
    setBackfillCourse(null);
  };

  // Recent distinct topics of this course, newest first. A unit usually runs over
  // several lessons, so the topic is normally one tap rather than typing.
  const recentTopics = (courseName, n = 4) => {
    const seen = new Set(), out = [];
    Object.entries(topics)
      .filter(([k, v]) => k.endsWith(`_${courseName}`) && v && v.trim())
      .sort((a, b) => a[0] < b[0] ? 1 : -1)
      .forEach(([, v]) => { if (!seen.has(v) && out.length < n) { seen.add(v); out.push(v); } });
    return out;
  };

  const [lastAutoBackup, setLastAutoBackup] = useState(() => localStorage.getItem("obs_lastAutoBackup"));
  const [backupDue,      setBackupDue]      = useState(false);

  // Undo: { type, description, undo: () => void, expires: timestamp }
  const [lastAction, setLastAction] = useState(null);

  useEffect(() => {
    if (!gradesVisible) return;
    const t = setTimeout(() => setGradesVisible(false), 30000);
    return () => clearTimeout(t);
  }, [gradesVisible]);

  // Auto-hide undo toast. Long enough to survive a glance back at the class.
  useEffect(() => {
    if (!lastAction) return;
    const t = setTimeout(() => setLastAction(null), 12000);
    return () => clearTimeout(t);
  }, [lastAction]);

  // Helper: register an undoable action
  const registerUndo = (description, undoFn) => {
    setLastAction({ description, undo: undoFn, ts: Date.now() });
  };

  const performUndo = () => {
    if (lastAction) {
      lastAction.undo();
      setLastAction(null);
    }
  };

  useEffect(() => saveData("obs_courses",      courses),      [courses]);
  useEffect(() => saveData("obs_observations", observations), [observations]);
  useEffect(() => saveData("obs_homework",     homework),     [homework]);
  useEffect(() => saveData("obs_absences",     absences),     [absences]);
  useEffect(() => saveData("obs_topics",       topics),       [topics]);

  // Keep the running session recoverable; clear it once the lesson is ended.
  useEffect(() => {
    if (!activeCourse) { try { localStorage.removeItem("obs_session"); } catch(e) {} return; }
    saveData("obs_session", {
      date: dateKey(), activeCourse, sessionPhase, todayAbsent, hwActive, hwExceptions,
    });
  }, [activeCourse, sessionPhase, todayAbsent, hwActive, hwExceptions]);

  // Automatische Sicherung: löst beim Öffnen der App aus, wenn seit dem letzten
  // Auto-Backup ein zufälliges Intervall (4–7 Tage) verstrichen ist. Eigene
  // Dateinamen-Vorsilbe ("AutoBackup" statt "Backup"), damit System- und
  // Handsicherungen im Downloads-/iCloud-Ordner unterscheidbar bleiben.
  useEffect(() => {
    if (!observations.length) return;
    const last     = localStorage.getItem("obs_lastAutoBackup");
    const dueDays  = Number(localStorage.getItem("obs_nextAutoBackupDays")) || 4;
    const daysSince = last ? (Date.now() - new Date(last).getTime()) / 86400000 : Infinity;
    setBackupDue(daysSince >= dueDays);
  }, []);

  // iOS Safari drops downloads that no tap initiated, so the backup cannot fire
  // by itself — stamping "saved" on an attempt would be a lie. Prompt instead,
  // and only record the date once a real tap produced the file.
  const runDueBackup = () => {
    downloadBackup("ClassPulse_AutoBackup");
    // Erst bestätigen lassen, dann stempeln. Ein Sicherungsdatum, dem man nicht
    // glauben kann, ist schlechter als gar keine Anzeige.
    if (!window.confirm(
      "Backup-Datei gespeichert?\n\n" +
      "OK bestätigt die Sicherung. Abbrechen lässt den Hinweis stehen, " +
      "falls der Download nicht durchgelaufen ist."
    )) return;
    const now = new Date().toISOString();
    localStorage.setItem("obs_lastAutoBackup", now);
    localStorage.setItem("obs_nextAutoBackupDays", String(4 + Math.floor(Math.random() * 4)));
    setLastAutoBackup(now);
    setBackupDue(false);
  };

  const today       = dateKey();
  const currentSlot = getCurrentSlot();

  // ── helpers ─────────────────────────────────────────────────────────────

  // Jede Auswertung filterte bisher die vollständige Beobachtungsliste. In der
  // Übersicht waren das 459 Volldurchläufe über 2160 Einträge pro Rendern —
  // knapp eine Million Vergleiche, gemessen als 106ms Long Task. Der Index
  // kostet einen Durchlauf, und zwar nur wenn sich Beobachtungen ändern.
  const obsIndex = useMemo(() => {
    const byStudent = new Map(), byCourse = new Map();
    observations.forEach(o => {
      const k = `${o.course}::${o.studentId}`;
      if (!byStudent.has(k)) byStudent.set(k, []);
      byStudent.get(k).push(o);
      if (!byCourse.has(o.course)) byCourse.set(o.course, []);
      byCourse.get(o.course).push(o);
    });
    return { byStudent, byCourse };
  }, [observations]);

  const obsFor       = useCallback((course, studentId) => obsIndex.byStudent.get(`${course}::${studentId}`) || [], [obsIndex]);
  const obsForCourse = useCallback((course) => obsIndex.byCourse.get(course) || [], [obsIndex]);

  const getSuggested = useCallback((courseName, count=4) => {
    const course = courses.find(c => c.name === courseName);
    if (!course) return [];
    const absent  = absences[`${today}_${courseName}`] || [];
    const avail   = course.students.filter(st => !absent.includes(st.id));
    const lastObs = {}, ratings = {};
    obsForCourse(courseName).forEach(o => {
      if (!lastObs[o.studentId] || o.date > lastObs[o.studentId]) lastObs[o.studentId] = o.date;
      if (isRating(o)) ratings[o.studentId] = (ratings[o.studentId] || 0) + 1;
    });
    // Longest-unobserved first; never observed ("") sorts to the very front.
    // Equal dates must return 0 — returning -1 there reverses the whole list,
    // which silently favoured students at the end of the roster.
    return avail.sort((a,b) => {
      const la = lastObs[a.id] || "", lb = lastObs[b.id] || "";
      if (la !== lb) return la < lb ? -1 : 1;
      // Same recency: thinnest record first, so one early "-" cannot park a
      // quiet student at the back of the queue for weeks.
      return (ratings[a.id] || 0) - (ratings[b.id] || 0);
    }).slice(0,count);
  }, [courses, obsForCourse, absences, today]);

  const getStats = useCallback((courseName, studentId) => {
    // Notes are stored with rating "+" — they must never count as a positive.
    const obs  = obsFor(courseName, studentId).filter(isRating);
    const pos  = obs.filter(o => o.rating === "+").length;
    const neg  = obs.filter(o => o.rating === "-").length;
    const last = obs.reduce((m,o) => o.date > m ? o.date : m, "");
    return { pos, neg, total:obs.length, last };
  }, [obsFor]);

  // Was ist heute mit diesem Menschen passiert? Die Angabe steckte bisher nur in
  // der Detailansicht — in der Liste war nach einer Unterbrechung nicht erkennbar,
  // wen man schon hatte, und genau darauf kann man sich am wenigsten verlassen.
  const getToday = useCallback((courseName, studentId) => {
    const obs = obsFor(courseName, studentId).filter(o => o.date === today);
    const rated   = obs.filter(isRating).length;
    const skipped = obs.some(o => o.criterionId === "skip");
    return { rated, skipped, done: rated > 0 || skipped };
  }, [obsFor, today]);

  // ── session actions ──────────────────────────────────────────────────────

  const startSession = (courseName) => {
    setActiveCourse(courseName);
    setTodayAbsent(absences[`${today}_${courseName}`] || []);
    setHwActive(false);
    setHwExceptions({});
    setActiveStudent(null);
    setSessionPhase("absent");
  };

  // Nachzügler waren nicht nachtragbar: die Anwesenheit wurde einmal in Phase 1
  // erfasst, danach führte nur das ✕ heraus. Sie ist aber ein Zustand und muss
  // deshalb während der ganzen Stunde erreichbar bleiben.
  const toggleAbsentToday = (studentId) => {
    const key     = `${today}_${activeCourse}`;
    const course  = courses.find(c => c.name === activeCourse);
    const stName  = course?.students.find(st => st.id === studentId)?.name.split(" ")[0] || "?";
    const wasAbsent = (absences[key] || []).includes(studentId);
    const apply = (absent) => {
      setAbsences(prev => {
        const cur = prev[key] || [];
        return { ...prev, [key]: absent ? [...new Set([...cur, studentId])] : cur.filter(i => i !== studentId) };
      });
      setTodayAbsent(prev => absent ? [...new Set([...prev, studentId])] : prev.filter(i => i !== studentId));
    };
    apply(!wasAbsent);
    registerUndo(
      wasAbsent ? `${stName}: wieder anwesend` : `${stName}: fehlt`,
      () => apply(wasAbsent)
    );
  };

  const finishAbsent = () => {
    setAbsences(prev => ({ ...prev, [`${today}_${activeCourse}`]: todayAbsent }));
    setSessionPhase("homework");
  };

  const activateHw = () => {
    const course  = courses.find(c => c.name === activeCourse);
    const present = course.students.filter(st => !todayAbsent.includes(st.id));
    // Re-entering the homework phase (e.g. after an interruption) must not wipe
    // exceptions already recorded for today.
    const recorded = homework[`${today}_${activeCourse}`] || {};
    const defaults = {};
    present.forEach(st => { defaults[st.id] = recorded[st.id] || "done"; });
    setHwExceptions(defaults);
    setHwActive(true);
  };

  const finishHomework = () => {
    if (hwActive) {
      const course  = courses.find(c => c.name === activeCourse);
      const present = course.students.filter(st => !todayAbsent.includes(st.id));
      const record  = {};
      present.forEach(st => { record[st.id] = hwExceptions[st.id] || "done"; });
      setHomework(prev => ({ ...prev, [`${today}_${activeCourse}`]: record }));
    }
    setSessionPhase("observe");
  };

  const addObs = (studentId, criterionId, rating, note="") => {
    // Build description for the toast
    const course  = courses.find(c => c.name === activeCourse);
    const student = course?.students.find(st => st.id === studentId);
    const crit    = getCriteria(activeCourse).find(c => c.id === criterionId);
    const stName  = student?.name.split(" ")[0] || "?";
    const critLbl = crit?.short || (criterionId === "note" ? "Notiz" : criterionId);
    const ratingSym = rating === "+" ? "+" : "−";
    const now = () => new Date().toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });

    // Notes accumulate; a criterion holds at most one rating per student per day.
    // Same sign again takes it back, opposite sign replaces it — so what the tile
    // shows always matches what the grade proposal counts.
    const existing = criterionId === "note" ? null : observations.find(o =>
      o.course === activeCourse && o.studentId === studentId &&
      o.criterionId === criterionId && o.date === today
    );

    if (existing && existing.rating === rating) {
      setObservations(prev => prev.filter(o => o.id !== existing.id));
      registerUndo(
        `${stName}: ${critLbl} ${ratingSym} zurückgenommen`,
        () => setObservations(prev => [...prev, existing])
      );
      return;
    }

    if (existing) {
      setObservations(prev => prev.map(o =>
        o.id === existing.id ? { ...o, rating, time: now() } : o
      ));
      registerUndo(
        `${stName}: ${critLbl} → ${ratingSym}`,
        () => setObservations(prev => prev.map(o => o.id === existing.id ? existing : o))
      );
      return;
    }

    const obs = {
      id: `${Date.now()}_${Math.random().toString(36).slice(2,6)}`,
      course: activeCourse, studentId, criterionId,
      rating, note, date: today,
      time: now(),
    };
    setObservations(prev => [...prev, obs]);
    registerUndo(
      `${stName}: ${critLbl} ${ratingSym}`,
      () => setObservations(prev => prev.filter(o => o.id !== obs.id))
    );
  };

  // "Looked at them, nothing to rate today." Without this the only thing a quiet
  // student can earn is a "-", because saying nothing has no other button.
  // The marker carries a date, so they rotate out of today's suggestions, but it
  // is not a rating and never reaches the grade proposal.
  const skipToday = (studentId) => {
    const already = observations.find(o =>
      o.course === activeCourse && o.studentId === studentId &&
      o.criterionId === "skip" && o.date === today
    );
    setActiveStudent(null);
    if (already) return;
    const course  = courses.find(c => c.name === activeCourse);
    const student = course?.students.find(st => st.id === studentId);
    const stName  = student?.name.split(" ")[0] || "?";
    const obs = {
      id: `${Date.now()}_${Math.random().toString(36).slice(2,6)}`,
      course: activeCourse, studentId, criterionId: "skip",
      rating: "", note: "", date: today,
      time: new Date().toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" }),
    };
    setObservations(prev => [...prev, obs]);
    registerUndo(
      `${stName}: heute nichts beobachtet`,
      () => setObservations(prev => prev.filter(o => o.id !== obs.id))
    );
  };

  const importStudents = (courseName) => {
    const names = importText.split("\n").map(n => n.trim()).filter(Boolean);
    if (!names.length) return;
    // A bulk import regenerates every student id, so observations recorded for
    // this course lose the student they belong to. Single names can be corrected
    // in the roster instead — say so before wiping a term's worth of entries.
    const affected = observations.filter(o => o.course === courseName).length;
    if (affected > 0 && !window.confirm(
      `${courseName}: ${names.length} Namen importieren?\n\n` +
      `Achtung: ${affected} bereits erfasste Einträge in diesem Kurs verlieren dadurch ihre Zuordnung ` +
      `und tauchen nirgends mehr auf.\n\n` +
      `Nur einzelne Namen korrigieren? Abbrechen und stattdessen den Namen in der Liste antippen.`
    )) return;
    setCourses(prev => prev.map(c =>
      c.name === courseName ? { ...c, students: names.map((name,i) => ({ id:`imp_${Date.now()}_${i}`, name })) } : c
    ));
    setImportText("");
    setShowImport(false);
  };

  const renameStudent = (courseName, studentId, newName) => {
    const trimmed = newName.trim();
    if (!trimmed) return;
    setCourses(prev => prev.map(c =>
      c.name === courseName
        ? { ...c, students: c.students.map(st => st.id === studentId ? { ...st, name: trimmed } : st) }
        : c
    ));
  };

  const addStudent = (courseName, name) => {
    const trimmed = name.trim();
    if (!trimmed) return;
    setCourses(prev => prev.map(c =>
      c.name === courseName
        ? { ...c, students: [...c.students, { id: `s_${Date.now()}_${Math.random().toString(36).slice(2,7)}`, name: trimmed }] }
        : c
    ));
  };

  const removeStudent = (courseName, studentId) => {
    setCourses(prev => prev.map(c =>
      c.name === courseName ? { ...c, students: c.students.filter(st => st.id !== studentId) } : c
    ));
  };

  // F13: Was „zurück" bedeutet, hängt davon ab, wo man steht. Das Stundenende
  // steht bewusst nicht in dieser Liste — es bleibt eine bewusste Entscheidung
  // und darf nie aus einer Handbewegung heraus passieren.
  const goBack = useCallback(() => {
    if (infoCrit)           { setInfoCrit(null);        return true; }
    if (showExport)         { setShowExport(false);     return true; }
    if (showImport)         { setShowImport(false);     return true; }
    if (showAttendance)     { setShowAttendance(false); return true; }
    if (activeStudent)      { setActiveStudent(null);   return true; }
    if (page === "logbook") { setPage("settings");      return true; }
    return false;
  }, [infoCrit, showExport, showImport, showAttendance, activeStudent, page]);

  // Wischen nach rechts als Zurück. Bewusst nicht am Bildschirmrand: in der
  // installierten PWA wäre der Rand frei, im Safari-Tab läge dort die
  // Verlaufsgeste des Systems. Eine Geste, die nur in einem der beiden Fälle
  // funktioniert, ist schlimmer als keine.
  useEffect(() => {
    let sx = 0, sy = 0, t0 = 0, gueltig = false;
    const start = (e) => {
      if (e.touches.length !== 1) { gueltig = false; return; }
      const ziel = e.target;
      // Nicht aus einem Eingabefeld heraus — dort wischt man Text, nicht Seiten.
      if (ziel?.closest?.("input, textarea")) { gueltig = false; return; }
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      t0 = Date.now(); gueltig = true;
    };
    const ende = (e) => {
      if (!gueltig) return;
      gueltig = false;
      const t = e.changedTouches?.[0];
      if (!t) return;
      const dx = t.clientX - sx, dy = Math.abs(t.clientY - sy);
      // Waagerecht, weit genug, zügig — sonst war es Scrollen. 800ms statt 600:
      // die Abgrenzung leistet ohnehin die Senkrechte, und ein enges Zeitfenster
      // bestraft nur den, der langsamer wischt.
      if (dx >= 60 && dy <= 40 && Date.now() - t0 <= 800) goBack();
    };
    window.addEventListener("touchstart", start, { passive: true });
    window.addEventListener("touchend",   ende,  { passive: true });
    return () => {
      window.removeEventListener("touchstart", start);
      window.removeEventListener("touchend",   ende);
    };
  }, [goBack]);

  const goHome = () => { setActiveCourse(null); setSessionPhase("select"); setActiveStudent(null); setLastAction(null); setNameFilter(""); setHwFilter(""); };

  // Die Kursblöcke des Exports wurden zweimal inline gebaut und wichen in der
  // Kopfzeile voneinander ab — dort steckte die verrutschte Spalte (F23).
  // Eine Quelle, ein Trennzeichen.
  const courseCsvBlock = (course) => {
    const criteria = getCriteria(course.name);
    const lines = [`Name;${criteria.map(c => c.short).join(";")};HA-Quote;Fehltage;Gesamt`];
    course.students.forEach(st => {
      const obs = obsFor(course.name, st.id);
      const critSummary = criteria.map(crit => {
        const pos = obs.filter(o => o.criterionId === crit.id && o.rating === "+").length;
        const neg = obs.filter(o => o.criterionId === crit.id && o.rating === "-").length;
        return (pos === 0 && neg === 0) ? "-" : `+${pos}/-${neg}`;
      });
      let hwTotal = 0, hwDone = 0;
      Object.entries(homework).forEach(([key, val]) => {
        if (key.endsWith(`_${course.name}`)) {
          const status = val[st.id];
          if (status === undefined) return;  // abwesend, oder noch nicht im Kurs
          hwTotal++;
          if (status === "done") hwDone++;
          else if (status === "half") hwDone += 0.5;
        }
      });
      const hwPct = hwTotal > 0 ? `${Math.round((hwDone/hwTotal)*100)}%` : "-";
      let absentCount = 0;
      Object.entries(absences).forEach(([key, ids]) => {
        if (key.endsWith(`_${course.name}`) && ids.includes(st.id)) absentCount++;
      });
      lines.push(`"${st.name}";${critSummary.join(";")};${hwPct};${absentCount};${obs.length}`);
    });
    return lines;
  };

  const downloadCsv = (lines, filename) => {
    const csv  = "\uFEFF" + lines.join("\r\n");   // BOM: sonst zerlegt Excel die Umlaute
    const blob = new Blob([csv], { type:"text/csv;charset=utf-8;" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  // ── JSON BACKUP ──────────────────────────────────────────────────────────
  const downloadBackup = (filenamePrefix) => {
    const backup = {
      version: "1.0",
      exportDate: new Date().toISOString(),
      app: "ClassPulse",
      data: { courses, observations, homework, absences, topics },
    };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type:"application/json" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    const date = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `${filenamePrefix}_${date}.json`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const exportBackup = () => downloadBackup("ClassPulse_Backup");

  const importBackup = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const backup = JSON.parse(e.target.result);
        // `!backup.app === "ClassPulse"` compared a boolean to a string and was
        // therefore always false — the check never ran.
        if (!backup.data || backup.app !== "ClassPulse") throw new Error("Das ist keine ClassPulse-Backup-Datei");
        const { courses: c, observations: o, homework: h, absences: a } = backup.data;
        const tp = backup.data.topics && typeof backup.data.topics === "object" ? backup.data.topics : {};
        if (!Array.isArray(c) || !Array.isArray(o) ||
            !h || typeof h !== "object" || !a || typeof a !== "object")
          throw new Error("Daten unvollständig oder beschädigt");

        // Overwriting is irreversible and costs a whole term — always ask first.
        const stamp = (backup.exportDate || "").slice(0,10);
        const ok = window.confirm(
          `Backup${stamp ? " vom " + stamp : ""} einspielen?\n\n` +
          `${c.length} Kurse · ${o.length} Beobachtungen\n\n` +
          `Alle aktuellen Daten auf diesem Gerät werden dadurch ersetzt.`
        );
        if (!ok) return;
        setCourses(c);
        setObservations(o);
        setHomework(h);
        setAbsences(a);
        setTopics(tp);
        saveData("obs_courses",      c);
        saveData("obs_observations", o);
        saveData("obs_homework",     h);
        saveData("obs_absences",     a);
        saveData("obs_topics",       tp);
        setBackupImportOK(true);
        setBackupError("");
        setTimeout(() => setBackupImportOK(false), 3000);
      } catch(err) {
        setBackupError("Fehler: " + err.message + " — Ist das eine ClassPulse-Backup-Datei?");
      }
    };
    reader.readAsText(file);
  };

  // ── NOTENVORSCHLAG ───────────────────────────────────────────────────────
  // 6, not 5: at exactly 5 entries no whole number of "+" lands in the 45–60%
  // band, so the grade "3" — the most common one — could not be proposed at the
  // very moment the proposal unlocks. From 6 entries on, every band is reachable.
  const MIN_ENTRIES  = 6;
  const MIN_DAYS     = 3;

  const getGradeProposal = (courseName, studentId) => {
    const obs = obsFor(courseName, studentId).filter(isRating);
    const days = new Set(obs.map(o => o.date)).size;
    if (obs.length < MIN_ENTRIES || days < MIN_DAYS) return null;
    const pos = obs.filter(o => o.rating === "+").length;
    const ratio = pos / obs.length;
    if (ratio >= 0.80) return { grade:"1–2", label:"sehr gut / gut",         color:C.green  };
    if (ratio >= 0.60) return { grade:"2–3", label:"gut / befriedigend",     color:C.green  };
    if (ratio >= 0.45) return { grade:"3",   label:"befriedigend",           color:C.amber  };
    if (ratio >= 0.30) return { grade:"3–4", label:"befriedigend / ausreichend", color:C.amber };
    if (ratio >= 0.15) return { grade:"4–5", label:"ausreichend / mangelhaft",   color:C.red   };
    return               { grade:"5–6", label:"mangelhaft / ungenügend",    color:C.red   };
  };

  const getObsProgress = (courseName, studentId) => {
    const obs = obsFor(courseName, studentId).filter(isRating);
    const days = new Set(obs.map(o => o.date)).size;
    return { count: obs.length, days, ready: obs.length >= MIN_ENTRIES && days >= MIN_DAYS };
  };

  // ── RENDER: HOME ─────────────────────────────────────────────────────────

  const renderHome = () => {
    const daySlots = SCHEDULE.filter(sl => sl.day === new Date().getDay());
    return (
      <div style={S.page}>
        {backupDue && (
          <button style={{ background:C.amberSoft, border:`1px solid ${C.amber}`, borderRadius:12, padding:"14px 16px", marginBottom:12, cursor:"pointer", width:"100%", textAlign:"left", WebkitAppearance:"none" }}
            onClick={runDueBackup}>
            <span style={{ display:"block", fontSize:15, fontWeight:600, color:C.amber, marginBottom:2 }}>Sicherung fällig</span>
            <span style={{ display:"block", fontSize:13, color:C.textDim }}>
              Tippen lädt die Backup-Datei herunter{lastAutoBackup
                ? ` — zuletzt vor ${Math.floor((Date.now()-new Date(lastAutoBackup).getTime())/86400000)} Tagen`
                : ""}.
            </span>
          </button>
        )}

        {currentSlot && (
          <button style={{ ...S.courseCard(true), marginBottom:16, width:"100%", textAlign:"left", WebkitAppearance:"none" }}
            onClick={() => startSession(currentSlot.course)}>
            <span style={{ display:"block", fontSize:13, color:C.accent, fontWeight:700, marginBottom:4, letterSpacing:"0.06em" }}>JETZT LÄUFT</span>
            <span style={{ display:"block", ...S.courseTitle, color:C.text }}>{currentSlot.course}</span>
            <span style={{ display:"block", ...S.courseMeta }}>{currentSlot.start}–{currentSlot.end} · {currentSlot.type==="double"?"Doppelstunde":"Einzelstunde"}</span>
            <span style={{ ...S.btn("primary"), display:"block", textAlign:"center" }}>Stunde starten →</span>
          </button>
        )}

        {daySlots.length > 0 && (
          <>
            <div style={S.sectionLbl}>Heute — {DAYS[new Date().getDay()]}</div>
            {daySlots.filter(sl => sl !== currentSlot).map((sl,i) => (
              <button key={i} style={{ ...S.courseCard(false), width:"100%", textAlign:"left", WebkitAppearance:"none" }}
                onClick={() => startSession(sl.course)}>
                <span style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <span>
                    <span style={{ display:"block", ...S.courseTitle, color:C.text }}>{sl.course}</span>
                    <span style={{ display:"block", ...S.courseMeta }}>{sl.start}–{sl.end} · {sl.type==="double"?"DS":"ES"}</span>
                  </span>
                  {ENGLISH_COURSES.includes(sl.course) && <span style={S.badge("blue")}>FS</span>}
                </span>
              </button>
            ))}
          </>
        )}

        {!currentSlot && daySlots.length === 0 && (
          <div style={{ textAlign:"center", padding:"60px 20px", color:C.textDim }}>
            <div style={{ fontSize:17, fontWeight:600, color:C.text, marginBottom:6 }}>Kein Unterricht heute</div>
            <div style={{ fontSize:15 }}>Wähle einen Kurs manuell unten aus oder schau in die Übersicht.</div>
          </div>
        )}

        <div style={S.sectionLbl}>Alle Kurse</div>
        {COURSES_META.filter(c => c.criteriaType !== "none").map((c,i) => (
          <button key={i} style={{ ...S.courseCard(false), width:"100%", textAlign:"left", WebkitAppearance:"none" }}
            onClick={() => startSession(c.name)}>
            <span style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <span style={{ ...S.courseTitle, color:C.text }}>{c.name}</span>
              {c.criteriaType==="fremdsprachen" && <span style={S.badge("blue")}>FS</span>}
            </span>
          </button>
        ))}
      </div>
    );
  };

  // Fehlende → Hausaufgaben → Beobachten lief als Wizard ohne Anzeige und ohne
  // Rückweg: wer versehentlich „Nein — direkt zum Beobachten" tippte, konnte die
  // HA-Kontrolle nicht mehr nachholen. Erledigte Schritte führen jetzt zurück.
  const PHASES = [
    { id:"absent",   label:"Fehlende" },
    { id:"homework", label:"Hausaufg." },
    { id:"observe",  label:"Beobachten" },
  ];

  const renderPhaseSteps = () => {
    const idx = PHASES.findIndex(p => p.id === sessionPhase);
    if (idx < 0) return null;
    return (
      <div style={{ display:"flex", gap:6, marginBottom:14 }}>
        {PHASES.map((ph, i) => {
          const state = i < idx ? "done" : i === idx ? "current" : "todo";
          const reachable = state === "done";
          return (
            <button key={ph.id}
              onClick={() => reachable && setSessionPhase(ph.id)}
              aria-current={state === "current" ? "step" : undefined}
              aria-disabled={!reachable && state !== "current"}
              style={{ flex:1, minHeight:44, padding:"8px 4px", borderRadius:8,
                       cursor: reachable ? "pointer" : "default",
                       WebkitAppearance:"none", textAlign:"center",
                       background: state === "current" ? C.accentSoft : "transparent",
                       border:`1px solid ${state === "todo" ? C.border : C.accent}`,
                       color: state === "todo" ? C.textMuted : C.accent,
                       fontSize:13, fontWeight: state === "current" ? 700 : 500 }}>
              {state === "done" ? "✓ " : ""}{ph.label}
            </button>
          );
        })}
      </div>
    );
  };

  // ── RENDER: ABSENT ───────────────────────────────────────────────────────

  const renderMissingCourse = () => (
    <div style={S.page}>
      <div style={{ textAlign:"center", padding:"48px 20px" }}>
        <div style={{ fontSize:17, fontWeight:600, marginBottom:6 }}>Kurs nicht gefunden</div>
        <div style={{ fontSize:15, color:C.textDim, lineHeight:"1.6" }}>
          „{activeCourse}“ steht im Stundenplan, aber nicht in deinen gespeicherten
          Kursen. Meist heißt das: Der Kurs wurde umbenannt. Deine Einträge sind nicht
          verloren — sie hängen am alten Namen.
        </div>
        <button style={{ ...S.btn("primary"), marginTop:20 }} onClick={goHome}>Zurück</button>
      </div>
    </div>
  );

  const renderAbsent = () => {
    const course = courses.find(c => c.name === activeCourse);
    // A course name that no longer exists used to render an empty page with no
    // explanation — undiagnosable mid-lesson. Say what happened instead.
    if (!course) return renderMissingCourse();
    return (
      <div style={S.page}>
        <div style={{ fontSize:13, color:C.accent, fontWeight:700, letterSpacing:"0.06em" }}>{activeCourse}</div>
        <h2 style={{ fontSize:20, fontWeight:700, margin:"6px 0 10px" }}>Wer fehlt heute?</h2>
        {renderPhaseSteps()}
        <p style={{ fontSize:15, color:C.textDim, marginBottom:16 }}>Antippen = fehlt · nochmal = wieder da</p>

        {course.students.length === 0 && (
          <div style={{ background:C.amberSoft, border:`1px solid ${C.amber}`, borderRadius:10, padding:"14px 16px", marginBottom:12 }}>
            <div style={{ fontSize:15, fontWeight:600, color:C.amber, marginBottom:4 }}>Noch keine Schülerliste</div>
            <div style={{ fontSize:13, color:C.textDim }}>
              Unter „Kurse“ die Namen einmal importieren — danach läuft alles Weitere.
            </div>
          </div>
        )}
        {course.students.map(st => {
          const absent = todayAbsent.includes(st.id);
          return (
            <button key={st.id}
              aria-pressed={absent}
              style={{ ...S.row, width:"100%", textAlign:"left", WebkitAppearance:"none",
                       background:absent?C.redSoft:C.card, borderColor:absent?C.red:C.border, cursor:"pointer" }}
              onClick={() => {
                const wasAbsent = absent;
                setTodayAbsent(prev => wasAbsent ? prev.filter(id=>id!==st.id) : [...prev, st.id]);
                const stName = st.name.split(" ")[0];
                registerUndo(
                  wasAbsent ? `${stName}: wieder anwesend` : `${stName}: fehlt`,
                  () => setTodayAbsent(prev => wasAbsent ? [...prev, st.id] : prev.filter(id=>id!==st.id))
                );
              }}>
              <span style={{ fontSize:15, fontWeight:500, color:absent?C.red:C.text }}>{st.name}</span>
              {absent && <span style={{ fontSize:13, color:C.red, fontWeight:700 }}>fehlt</span>}
            </button>
          );
        })}

        <div style={{ display:"flex", gap:8, marginTop:16 }}>
          <button style={S.btn("ghost")} onClick={() => { setTodayAbsent([]); finishAbsent(); }}>Niemand fehlt</button>
          <button style={S.btn("primary")} onClick={finishAbsent}>
            Speichern & weiter {todayAbsent.length > 0 ? `(${todayAbsent.length} fehlt)` : "→"}
          </button>
        </div>
        <p style={{ fontSize:13, color:C.textMuted, textAlign:"center", marginTop:8 }}>
          Wird automatisch gespeichert.
        </p>
      </div>
    );
  };

  // ── RENDER: HOMEWORK ────────────────────────────────────────────────────

  const renderHomework = () => {
    const course  = courses.find(c => c.name === activeCourse);
    // A course name that no longer exists used to render an empty page with no
    // explanation — undiagnosable mid-lesson. Say what happened instead.
    if (!course) return renderMissingCourse();
    const present = course.students.filter(st => !todayAbsent.includes(st.id));
    const exCount = Object.values(hwExceptions).filter(v => v !== "done").length;

    return (
      <div style={S.page}>
        <div style={{ fontSize:13, color:C.accent, fontWeight:700, letterSpacing:"0.06em" }}>{activeCourse}</div>
        <h2 style={{ fontSize:20, fontWeight:700, margin:"6px 0 10px" }}>Hausaufgaben</h2>
        {renderPhaseSteps()}

        {!hwActive ? (
          <>
            <p style={{ fontSize:15, color:C.textDim, marginBottom:16 }}>Gab es Hausaufgaben auf?</p>
            <button style={S.btn("green")} onClick={activateHw}>✓ Ja — HA kontrollieren</button>
            <button style={S.btn("ghost")} onClick={() => setSessionPhase("observe")}>Nein — direkt zum Beobachten</button>
          </>
        ) : (
          <>
            <p style={{ fontSize:15, color:C.textDim, marginBottom:2 }}>
              Alle auf ✓ gesetzt — nur Ausnahmen antippen.
            </p>
            <p style={{ fontSize:15, color:C.textMuted, marginBottom:12 }}>
              {present.length} anwesend · {exCount} nicht/teilweise
            </p>

            {/* Der gute Default („alles auf ✓") sparte das Tippen, nicht das Suchen. */}
            <div style={{ display:"flex", gap:6, marginBottom:10 }}>
              <input value={hwFilter} {...inputFocus}
                onChange={e => setHwFilter(e.target.value)}
                aria-label="Schüler suchen"
                placeholder="Wer hat nicht? Name tippen…"
                style={{ flex:1, padding:"12px 12px", background:C.surface,
                         border:`1px solid ${C.border}`, borderRadius:8, color:C.text,
                         fontSize:15, outline:"none" }} />
              {hwFilter && (
                <button aria-label="Suche zurücksetzen" onClick={() => setHwFilter("")}
                  style={{ ...S.btnSm("ghost"), padding:"12px 14px" }}>
                  <Icon name="x" size={14} color={C.textDim} />
                </button>
              )}
            </div>

            {/* Bereits eingetragene Ausnahmen bleiben immer sichtbar, auch beim Filtern —
                sonst verliert man aus dem Blick, was man schon erfasst hat. */}
            {present
              .filter(st => {
                const q = hwFilter.trim().toLowerCase();
                if (!q) return true;
                return st.name.toLowerCase().includes(q) || (hwExceptions[st.id] || "done") !== "done";
              })
              .map(st => {
              const status = hwExceptions[st.id] || "done";
              const stName = st.name.split(" ")[0];
              const setStatus = (newStatus, label) => {
                const prevStatus = status;
                setHwExceptions(p => ({ ...p, [st.id]: newStatus }));
                registerUndo(
                  `${stName}: HA ${label}`,
                  () => setHwExceptions(p => ({ ...p, [st.id]: prevStatus }))
                );
              };
              return (
                <div key={st.id} style={{ ...S.row, borderColor:status==="not"?C.red:status==="half"?C.amber:C.border, background:status==="not"?C.redSoft:status==="half"?C.amberSoft:C.card }}>
                  <span style={{ fontSize:15, fontWeight:500 }}>{st.name}</span>
                  <div style={{ display:"flex", gap:4 }}>
                    <button style={S.btnSm(status==="done"?"green":"ghost")}
                      onClick={() => setStatus("done", "✓")}>✓</button>
                    <button style={S.btnSm(status==="half"?"amber":"ghost")}
                      onClick={() => setStatus(status==="half"?"done":"half", status==="half"?"✓":"½")}>½</button>
                    <button style={S.btnSm(status==="not"?"red":"ghost")}
                      onClick={() => setStatus(status==="not"?"done":"not", status==="not"?"✓":"✗")}>✗</button>
                  </div>
                </div>
              );
            })}
            <button style={{ ...S.btn("primary"), marginTop:16 }} onClick={() => { setHwFilter(""); finishHomework(); }}>Speichern & weiter →</button>
            <p style={{ fontSize:13, color:C.textMuted, textAlign:"center", marginTop:6 }}>Wird automatisch gespeichert.</p>
          </>
        )}
      </div>
    );
  };

  // ── RENDER: OBSERVE ─────────────────────────────────────────────────────

  const renderObserve = () => {
    const course = courses.find(c => c.name === activeCourse);
    // A course name that no longer exists used to render an empty page with no
    // explanation — undiagnosable mid-lesson. Say what happened instead.
    if (!course) return renderMissingCourse();
    const criteria  = getCriteria(activeCourse);
    const suggested = getSuggested(activeCourse, 4);
    const absentIds = absences[`${today}_${activeCourse}`] || [];
    const available = course.students.filter(st => !absentIds.includes(st.id));

    // ── Detail view — Grid ──
    if (activeStudent) {
      const student  = course.students.find(st => st.id === activeStudent);
      const todayObs = obsFor(activeCourse, activeStudent).filter(o => o.date === today);
      const areas    = [...new Set(criteria.map(c => c.area))];
      const doneCount = todayObs.filter(isRating).length;

      return (
        <div style={S.page}>
          {/* Header */}
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
            <button style={{ background:"none", border:"none", color:C.accent, fontSize:15, cursor:"pointer", padding:0 }}
              onClick={() => setActiveStudent(null)}>← Zurück</button>
            <span style={{ fontSize:13, color:C.textDim }}>
              {doneCount}/{criteria.length} bewertet
            </span>
          </div>

          <h2 style={{ fontSize:20, fontWeight:700, margin:"0 0 2px" }}>{student?.name}</h2>
          <p style={{ fontSize:13, color:C.textDim, marginBottom:8 }}>{activeCourse}</p>

          {/* Kriterien-Grid pro Bereich */}
          {areas.map(area => {
            const areaCriteria = criteria.filter(c => c.area === area);
            return (
              <div key={area} style={{ marginBottom:12 }}>
                <div style={{ ...S.sectionLbl, marginTop:12 }}>{area}</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                  {areaCriteria.map(crit => {
                    const todayEntry = todayObs.find(o => o.criterionId === crit.id);
                    const isPos = todayEntry?.rating === "+";
                    const isNeg = todayEntry?.rating === "-";
                    return (
                      <div key={crit.id} style={{
                        background: isPos ? C.greenSoft : isNeg ? C.redSoft : C.card,
                        border: `1px solid ${isPos ? C.green : isNeg ? C.red : C.border}`,
                        borderRadius:10,
                        padding:"10px 10px 8px",
                        display:"flex",
                        flexDirection:"column",
                        gap:8,
                      }}>
                        {/* Kurzname + ⓘ — zusammen ein Ziel. Das ⓘ allein maß 13x13pt
                            und lag 4pt neben dem +; ein Daumenversatz öffnete das Modal
                            statt zu bewerten. */}
                        <button
                          onClick={() => setInfoCrit(crit)}
                          style={{
                            display:"flex", alignItems:"center", justifyContent:"space-between",
                            gap:4, width:"100%", minHeight:28, textAlign:"left",
                            background:"none", border:"none", padding:0, cursor:"pointer",
                            WebkitAppearance:"none",
                          }}>
                          <span style={{
                            fontSize:15, fontWeight:700,
                            color: isPos ? C.green : isNeg ? C.red : C.text,
                            lineHeight:"1.3", flex:1,
                          }}>{crit.short}</span>
                          <span style={{ color:C.textDim, fontSize:15, lineHeight:1, flexShrink:0 }}>ⓘ</span>
                        </button>

                        {/* + / − Buttons — 13px Polsterung ergibt 44pt Tapfläche */}
                        <div style={{ display:"flex", gap:5 }}>
                          <button
                            onClick={() => addObs(activeStudent, crit.id, "+")}
                            style={{
                              flex:1, padding:"13px 0",
                              background: isPos ? C.green : "transparent",
                              color: isPos ? C.onFill : C.green,
                              border: `1px solid ${C.green}`,
                              borderRadius:7, fontSize:17, fontWeight:700,
                              cursor:"pointer", WebkitAppearance:"none",
                            }}>+</button>
                          <button
                            onClick={() => addObs(activeStudent, crit.id, "-")}
                            style={{
                              flex:1, padding:"13px 0",
                              background: isNeg ? C.red : "transparent",
                              color: isNeg ? C.onFill : C.red,
                              border: `1px solid ${C.red}`,
                              borderRadius:7, fontSize:17, fontWeight:700,
                              cursor:"pointer", WebkitAppearance:"none",
                            }}>−</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          {/* Notiz-Verlauf */}
          {(() => {
            const pastNotes = [...obsFor(activeCourse, activeStudent)]
              .filter(o => o.criterionId === "note")
              .sort((a,b) => b.date.localeCompare(a.date) || b.time.localeCompare(a.time));
            if (pastNotes.length === 0) return null;
            return (
              <div style={{ marginBottom:8 }}>
                <div style={S.sectionLbl}>Bisherige Notizen ({pastNotes.length})</div>
                {pastNotes.map(n => (
                  <div key={n.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8, padding:"8px 12px", background:C.surface, borderRadius:8, marginBottom:5, borderLeft:`3px solid ${C.accent}` }}>
                    <span style={{ fontSize:15, color:C.text, flex:1, lineHeight:"1.5" }}>{n.note}</span>
                    <span style={{ fontSize:13, color:C.textMuted, flexShrink:0 }}>{n.date}</span>
                    {confirmNoteId === n.id ? (
                      <div style={{ display:"flex", gap:6, flexShrink:0 }}>
                        <button aria-label="Notiz endgültig löschen"
                          style={{ ...S.btnSm("red"), padding:"11px 12px" }}
                          onClick={() => {
                            setObservations(prev => prev.filter(o => o.id !== n.id));
                            setConfirmNoteId(null);
                            registerUndo("Notiz gelöscht", () => setObservations(prev => [...prev, n]));
                          }}>
                          <Icon name="check" size={13} color={C.red} />
                        </button>
                        <button aria-label="Löschen abbrechen"
                          style={{ ...S.btnSm("ghost"), padding:"11px 12px" }}
                          onClick={() => setConfirmNoteId(null)}>
                          <Icon name="x" size={13} color={C.textDim} />
                        </button>
                      </div>
                    ) : (
                      <button aria-label={`Notiz vom ${n.date} löschen`}
                        onClick={() => setConfirmNoteId(n.id)}
                        style={{ background:"none", border:"none", cursor:"pointer", padding:11,
                                 flexShrink:0, WebkitAppearance:"none" }}>
                        <Icon name="trash" size={14} color={C.textMuted} />
                      </button>
                    )}
                  </div>
                ))}
              </div>
            );
          })()}

          <div style={{ ...S.sectionLbl, marginTop:4 }}>Neue Notiz (optional)</div>
          <div style={{ display:"flex", gap:8 }}>
            <input
              style={{ flex:1, padding:"11px 12px", background:C.surface, border:`1px solid ${C.border}`, borderRadius:8, color:C.text, fontSize:15, outline:"none" }}
              placeholder="Kurze Notiz…"
              {...inputFocus}
              value={noteText}
              onChange={e => setNoteText(e.target.value)}
              onKeyDown={e => {
                if (e.key === "Enter" && noteText.trim()) {
                  addObs(activeStudent, "note", "+", noteText.trim());
                  setNoteText("");
                }
              }}
            />
            <button style={S.btnSm("primary")} onClick={() => {
              if (noteText.trim()) { addObs(activeStudent, "note", "+", noteText.trim()); setNoteText(""); }
            }}>+</button>
          </div>

          <button style={{ ...S.btn("ghost"), marginTop:16, color:C.textDim }}
            onClick={() => skipToday(activeStudent)}>
            Heute nichts zu bewerten
          </button>

          {/* Zurück-Button unten für schnellen Wechsel */}
          <button style={{ ...S.btn("ghost"), marginTop:8 }} onClick={() => setActiveStudent(null)}>
            ← Nächste/r Schüler/in
          </button>

          {/* Zwischenstand / Notenvorschlag — steht bewusst hinter den Knöpfen.
              Er kostet rund 240pt und schob damit die Hälfte der Kriterien unter
              die Falz; gebraucht wird er im Gespräch und am Halbjahresende,
              nie mitten in der Stunde. */}
          {(() => {
            const grade = getGradeProposal(activeCourse, activeStudent);
            const prog  = getObsProgress(activeCourse, activeStudent);
            const criteria = getCriteria(activeCourse);

            // Tendenz pro Kriterium berechnen
            const critTendencies = criteria.map(crit => {
              const critObs = obsFor(activeCourse, activeStudent).filter(o => o.criterionId === crit.id);
              const pos = critObs.filter(o => o.rating === "+").length;
              const neg = critObs.filter(o => o.rating === "-").length;
              const total = pos + neg;
              if (total === 0) return { crit, label: null, color: C.textMuted };
              const ratio = pos / total;
              if (ratio >= 0.70) return { crit, label: "überwiegend positiv",  color: C.green };
              if (ratio >= 0.45) return { crit, label: "ausgeglichen",          color: C.amber };
              return                   { crit, label: "überwiegend schwach",   color: C.red   };
            }).filter(t => t.label !== null);

            // Vollständiger Notenvorschlag
            if (grade) return (
              <div style={{ background:C.accentSoft, border:`1px solid ${C.accent}`, borderRadius:10, padding:"12px 14px", marginTop:20 }}>
                <div style={{ fontSize:13, color:C.accent, fontWeight:700, letterSpacing:"0.06em", marginBottom:6 }}>NOTENVORSCHLAG</div>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                  <span style={{ fontSize:17, fontWeight:700, color:grade.color }}>Note {grade.grade}</span>
                  <span style={{ fontSize:13, color:C.textDim }}>{grade.label}</span>
                </div>
                {critTendencies.map(t => (
                  <div key={t.crit.id} style={{ display:"flex", justifyContent:"space-between", paddingTop:3 }}>
                    <span style={{ fontSize:13, color:C.textDim }}>{t.crit.short}</span>
                    <span style={{ fontSize:13, fontWeight:600, color:t.color }}>{t.label}</span>
                  </div>
                ))}
                <div style={{ fontSize:13, color:C.textMuted, marginTop:8, paddingTop:6, borderTop:`1px solid ${C.border}` }}>
                  {prog.count} Einträge / {prog.days} Tage · Pädagogische Einschätzung entscheidet.
                </div>
              </div>
            );

            // Vorläufige Tendenz ab 1 Eintrag
            if (prog.count > 0) return (
              <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:10, padding:"12px 14px", marginTop:20 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                  <div style={{ fontSize:13, color:C.textDim, fontWeight:700, letterSpacing:"0.06em" }}>ZWISCHENSTAND</div>
                  <div style={{ fontSize:13, color:C.amber }}>⚠ {prog.count} Eintr. / {prog.days} Tage — vorläufig</div>
                </div>
                {critTendencies.length > 0 ? critTendencies.map(t => (
                  <div key={t.crit.id} style={{ display:"flex", justifyContent:"space-between", paddingTop:3 }}>
                    <span style={{ fontSize:13, color:C.textDim }}>{t.crit.short}</span>
                    <span style={{ fontSize:13, fontWeight:600, color:t.color }}>{t.label}</span>
                  </div>
                )) : (
                  <div style={{ fontSize:13, color:C.textMuted }}>Noch keine Kriterien bewertet.</div>
                )}
                <div style={{ fontSize:13, color:C.textMuted, marginTop:6 }}>
                  Notenvorschlag ab {MIN_ENTRIES} Einträgen / {MIN_DAYS} Tagen.
                </div>
              </div>
            );

            // Noch gar keine Einträge
            return (
              <div style={{ fontSize:13, color:C.textMuted, marginTop:20 }}>
                Noch keine Einträge für diesen Schüler.
              </div>
            );
          })()}
        </div>
      );
    }

    // ── Kurs ohne Bewertungsbogen: Anwesenheit und Thema fürs
    //    Klassenbuch, aber keine Kriterien — der Kurs wird nicht benotet. ──
    if (criteria.length === 0) {
      const tKey  = `${today}_${activeCourse}`;
      const saved = topics[tKey] || "";
      return (
        <div style={S.page}>
          <div style={{ fontSize:13, color:C.accent, fontWeight:700, letterSpacing:"0.06em" }}>{activeCourse}</div>
          <h2 style={{ fontSize:20, fontWeight:700, margin:"6px 0 10px" }}>Stunde läuft</h2>
          <div style={{ fontSize:15, color:C.textDim, lineHeight:"1.6", marginBottom:16 }}>
            Für diesen Kurs werden keine Bewertungen erfasst. Anwesenheit ist gespeichert —
            trag nur noch das Thema fürs Klassenbuch ein.
          </div>

          {topicEditing ? (
            <div style={{ display:"flex", gap:6, marginBottom:8 }}>
              <input autoFocus value={topicDraft}
                onChange={e => setTopicDraft(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter") { setTopicFor(activeCourse, topicDraft); setTopicEditing(false); }
                                  if (e.key === "Escape") setTopicEditing(false); }}
                placeholder="Thema dieser Stunde" {...inputFocus}
                style={{ flex:1, padding:"12px 11px", background:C.surface, border:`1px solid ${C.accent}`,
                         borderRadius:8, color:C.text, fontSize:15, outline:"none" }} />
              <button style={S.btnSm("primary")}
                onClick={() => { setTopicFor(activeCourse, topicDraft); setTopicEditing(false); }}>✓</button>
            </div>
          ) : (
            <button aria-label="Thema fürs Klassenbuch eintragen"
              onClick={() => { setTopicDraft(saved); setTopicEditing(true); }}
              style={{ fontSize:15, color: saved ? C.text : C.textMuted, cursor:"pointer",
                       width:"100%", textAlign:"left", minHeight:44, background:"none",
                       WebkitAppearance:"none",
                       padding:"12px", borderRadius:8, border:`1px dashed ${C.border}` }}>
              {saved ? <><span style={{ color:C.textDim }}>Thema: </span>{saved}</> : "+ Thema fürs Klassenbuch"}
            </button>
          )}

          <button style={{ ...S.btn("ghost"), marginTop:20 }} onClick={goHome}>✓ Stunde beenden</button>
        </div>
      );
    }

    // ── List view ──
    return (
      <div style={S.page}>
        <div style={{ fontSize:13, color:C.accent, fontWeight:700, letterSpacing:"0.06em" }}>{activeCourse}</div>
        <h2 style={{ fontSize:20, fontWeight:700, margin:"6px 0 10px" }}>Wen beobachten?</h2>
        {renderPhaseSteps()}

        {/* Tagesanker — beantwortet „wo bin ich?" mit einem Blick, statt es dem
            Gedächtnis zu überlassen. Rechts daneben die Anwesenheit, weil ein
            Nachzügler sonst bis Stundenende als fehlend gebucht bleibt. */}
        {(() => {
          const doneCount = available.filter(st => getToday(activeCourse, st.id).done).length;
          const pct = available.length ? Math.round(doneCount / available.length * 100) : 0;
          return (
            <div style={{ marginBottom:14 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6, gap:8 }}>
                <span style={{ fontSize:15, color:C.text, fontWeight:600 }}>
                  {doneCount} von {available.length} heute erfasst
                </span>
                <button onClick={() => setShowAttendance(true)}
