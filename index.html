                  style={{ background:"none", border:`1px solid ${C.border}`, borderRadius:20,
                           padding:"7px 12px", fontSize:13, color:C.textDim, cursor:"pointer",
                           WebkitAppearance:"none", flexShrink:0 }}>
                  {absentIds.length ? `${absentIds.length} ${absentIds.length === 1 ? "fehlt" : "fehlen"}` : "vollzählig"} · ändern
                </button>
              </div>
              <div style={{ height:6, background:C.border, borderRadius:3, overflow:"hidden" }}>
                <div style={{ height:"100%", width:`${pct}%`, background: pct===100 ? C.green : C.accent,
                              borderRadius:3, transition:"width 0.3s" }} />
              </div>
            </div>
          );
        })()}

        {/* Thema — steht neben dem Ablauf, blockiert ihn nie. Leer lassen kostet nichts. */}
        {(() => {
          const tKey  = `${today}_${activeCourse}`;
          const saved = topics[tKey] || "";
          const save  = (v) => { setTopicFor(activeCourse, v); setTopicEditing(false); };
          if (!topicEditing) return (
            <button aria-label="Thema fürs Klassenbuch eintragen"
              onClick={() => { setTopicDraft(saved); setTopicEditing(true); }}
              style={{ fontSize:15, color: saved ? C.text : C.textMuted, cursor:"pointer",
                       width:"100%", textAlign:"left", minHeight:44, background:"none",
                       padding:"12px", marginBottom:14, borderRadius:8,
                       WebkitAppearance:"none",
                       border:`1px dashed ${C.border}` }}>
              {saved ? <><span style={{ color:C.textDim }}>Thema: </span>{saved}</> : "+ Thema fürs Klassenbuch (optional)"}
            </button>
          );
          const chips = recentTopics(activeCourse).filter(t => t !== topicDraft);
          return (
            <div style={{ marginBottom:14 }}>
              <div style={{ display:"flex", gap:6 }}>
                <input autoFocus value={topicDraft}
                  onChange={e => setTopicDraft(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") save(topicDraft);
                                    if (e.key === "Escape") setTopicEditing(false); }}
                  placeholder="Thema dieser Stunde" {...inputFocus}
                  style={{ flex:1, padding:"12px 11px", background:C.surface,
                           border:`1px solid ${C.accent}`, borderRadius:8, color:C.text,
                           fontSize:15, outline:"none" }} />
                <button style={S.btnSm("primary")} onClick={() => save(topicDraft)}>✓</button>
              </div>
              {chips.length > 0 && (
                <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginTop:8 }}>
                  {chips.map(t => (
                    <button key={t} onClick={() => save(t)}
                      style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:20,
                               padding:"5px 11px", fontSize:13, color:C.textDim, cursor:"pointer",
                               WebkitAppearance:"none" }}>{t}</button>
                  ))}
                </div>
              )}
            </div>
          );
        })()}

        {(() => {
          // Schnellbewertung auf das Leitkriterium des Bogens: eine Beobachtung
          // dauert zwei Sekunden, der Weg über die Detailseite kostete vier Taps.
          // Die Detailseite bleibt für den differenzierten Fall.
          const lead = criteria[0];
          // 24 Namen sind über zwei Bildschirme verteilt; wer gerade spricht, steht
          // mit gleicher Wahrscheinlichkeit ganz unten. Tippen schlägt Scrollen.
          const q = nameFilter.trim().toLowerCase();
          const hit = st => !q || st.name.toLowerCase().includes(q);
          const openSt = available.filter(st => hit(st) && !getToday(activeCourse, st.id).done);
          const doneSt = available.filter(st => hit(st) &&  getToday(activeCourse, st.id).done);
          const sugg   = q ? [] : suggested.filter(st => !getToday(activeCourse, st.id).done);

          // Klebt unter dem Kopfbereich, damit nach zwei Wischern noch klar ist,
          // in welchem Abschnitt man liest.
          const stickyLbl = { ...S.sectionLbl, position:"sticky",
                              // Der Kopfbereich wächst mit der Notch — mitrechnen, nicht raten.
                              top:"calc(52px + max(16px, env(safe-area-inset-top)))", zIndex:40,
                              background:C.bg, paddingTop:10, paddingBottom:6, marginTop:12 };

          const quickBtn = (color, filled) => ({
            width:46, padding:"13px 0", borderRadius:8,
            background: filled ? color : "transparent",
            color: filled ? C.onFill : color,
            border:`1px solid ${color}`, fontSize:17, fontWeight:700,
            cursor:"pointer", WebkitAppearance:"none", flexShrink:0,
          });

          const row = (st, highlight) => {
            const stats = getStats(activeCourse, st.id);
            const t     = getToday(activeCourse, st.id);
            const leadObs = lead && obsFor(activeCourse, st.id).find(o =>
              o.criterionId === lead.id && o.date === today);
            return (
              <div key={st.id} style={{ ...S.row, gap:8,
                background:   highlight ? C.accentSoft : C.card,
                borderColor:  highlight ? C.accent : C.border }}>
                <button onClick={() => setActiveStudent(st.id)}
                  style={{ flex:1, minWidth:0, textAlign:"left", background:"none",
                           border:"none", padding:"2px 0", minHeight:44, cursor:"pointer",
                           WebkitAppearance:"none" }}>
                  <div style={{ fontSize:15, fontWeight:600, color:C.text }}>{st.name}</div>
                  <div style={{ fontSize:13, color:C.textDim, marginTop:1 }}>
                    {/* Zeichen + Wort, nie Farbe allein */}
                    {t.rated > 0   ? `✓ heute ${t.rated}×`
                     : t.skipped   ? "○ heute nichts zu bewerten"
                     : stats.last  ? `zuletzt ${stats.last}`
                     :               "noch nie beobachtet"}
                    {stats.total > 0 && <>{" · "}
                      <span style={{ color:C.green }}>+{stats.pos}</span>/
                      <span style={{ color:C.red }}>−{stats.neg}</span></>}
                  </div>
                </button>
                {lead && (
                  <div style={{ display:"flex", gap:5, flexShrink:0 }}>
                    <button title={`${lead.short} +`} onClick={() => addObs(st.id, lead.id, "+")}
                      style={quickBtn(C.green, leadObs?.rating === "+")}>+</button>
                    <button title={`${lead.short} −`} onClick={() => addObs(st.id, lead.id, "-")}
                      style={quickBtn(C.red, leadObs?.rating === "-")}>−</button>
                  </div>
                )}
              </div>
            );
          };

          return (
            <>
              {lead && (
                <div style={{ fontSize:13, color:C.textMuted, marginBottom:10 }}>
                  Schnellknöpfe bewerten „{lead.short}“ · Name antippen für alle Kriterien
                </div>
              )}

              <div style={{ display:"flex", gap:6, marginBottom:4 }}>
                <input value={nameFilter} {...inputFocus}
                  onChange={e => setNameFilter(e.target.value)}
                  aria-label="Schüler suchen"
                  placeholder="Name suchen…"
                  style={{ flex:1, padding:"12px 12px", background:C.surface,
                           border:`1px solid ${C.border}`, borderRadius:8, color:C.text,
                           fontSize:15, outline:"none" }} />
                {nameFilter && (
                  <button aria-label="Suche zurücksetzen" onClick={() => setNameFilter("")}
                    style={{ ...S.btnSm("ghost"), padding:"12px 14px" }}>
                    <Icon name="x" size={14} color={C.textDim} />
                  </button>
                )}
              </div>

              {sugg.length > 0 && (
                <>
                  <div style={stickyLbl}>Vorschlag — am längsten nicht beobachtet</div>
                  {sugg.map(st => row(st, true))}
                </>
              )}

              {course.students.length === 0 && (
                <div style={{ background:C.amberSoft, border:`1px solid ${C.amber}`, borderRadius:10,
                              padding:"14px 16px", marginBottom:12 }}>
                  <div style={{ fontSize:15, fontWeight:600, color:C.amber, marginBottom:4 }}>
                    Noch keine Schülerliste
                  </div>
                  <div style={{ fontSize:13, color:C.textDim }}>
                    Kurse → {activeCourse} → „Ganze Liste importieren“, Namen aus IServ einfügen.
                  </div>
                </div>
              )}

              <div style={stickyLbl}>Offen ({openSt.length})</div>
              {openSt.length === 0 ? (
                <div style={{ fontSize:15, color: q ? C.textDim : C.green, padding:"10px 0" }}>
                  {q ? "Kein offener Name passt zur Suche." : "✓ Heute alle einmal erfasst."}
                </div>
              ) : openSt.filter(st => !sugg.includes(st)).map(st => row(st, false))}

              {doneSt.length > 0 && (
                <>
                  <div style={stickyLbl}>Heute erledigt ({doneSt.length})</div>
                  {doneSt.map(st => row(st, false))}
                </>
              )}
            </>
          );
        })()}

        <button style={{ ...S.btn("ghost"), marginTop:20 }} onClick={goHome}>✓ Stunde beenden</button>
      </div>
    );
  };

  // ── RENDER: STUDENTS tab ─────────────────────────────────────────────────

  // Neun Kurse mit voller Liste sind 225 Zeilen am Stück. Einer offen reicht —
  // man korrigiert Namen in einem Kurs, nicht in allen.
  const renderStudents = () => (
    <div style={S.page}>
      <h2 style={{ fontSize:20, fontWeight:700, margin:"0 0 16px" }}>Kurse & Schülerlisten</h2>
      {courses.filter(c => c.criteriaType !== "none").map(course => {
        const open = openCourse === course.name;
        return (
        <div key={course.name} style={{ marginBottom:10 }}>
          <button
            aria-expanded={open}
            onClick={() => setOpenCourse(open ? null : course.name)}
            style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                     width:"100%", gap:10, textAlign:"left", cursor:"pointer",
                     background: open ? C.accentSoft : C.card,
                     border:`1px solid ${open ? C.accent : C.border}`,
                     borderRadius:10, padding:"14px 16px", WebkitAppearance:"none" }}>
            <span>
              <span style={{ display:"block", fontSize:15, fontWeight:600, color:C.text }}>{course.name}</span>
              <span style={{ display:"block", fontSize:15, color:C.textDim, marginTop:2 }}>
                {course.students.length} Schüler · {course.criteriaType==="fremdsprachen"?"FS-Bogen":"Allg. Bogen"}
              </span>
            </span>
            <span style={{ fontSize:15, color:C.textDim, flexShrink:0 }}>{open ? "▾" : "▸"}</span>
          </button>

          {open && (
          <div style={{ background:C.card, border:`1px solid ${C.border}`, borderTop:"none",
                        borderRadius:"0 0 10px 10px", padding:"4px 12px" }}>
            {course.students.map(st => (
              <div key={st.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, borderBottom:`1px solid ${C.border}` }}>
                {editingStudentKey === studentKey(course.name, st.id) ? (
                  <input
                    autoFocus
                    aria-label="Name ändern" {...inputFocus}
                    value={editStudentValue}
                    onChange={e => setEditStudentValue(e.target.value)}
                    onKeyDown={e => {
                      if (e.key === "Enter") { renameStudent(course.name, st.id, editStudentValue); setEditingStudentKey(null); }
                      if (e.key === "Escape") setEditingStudentKey(null);
                    }}
                    onBlur={() => { renameStudent(course.name, st.id, editStudentValue); setEditingStudentKey(null); }}
                    style={{ flex:1, fontSize:15, padding:"10px 9px", margin:"3px 0", background:C.surface, border:`1px solid ${C.accent}`, borderRadius:6, color:C.text, outline:"none" }}
                  />
                ) : (
                  /* 15pt hoher Text war das Umbenennen-Ziel — jetzt volle Zeilenhöhe. */
                  <button style={{ flex:1, minHeight:44, textAlign:"left", fontSize:15, color:C.text,
                                   background:"none", border:"none", padding:0, cursor:"pointer",
                                   WebkitAppearance:"none" }}
                    onClick={() => { setEditingStudentKey(studentKey(course.name, st.id)); setEditStudentValue(st.name); }}>
                    {st.name}
                  </button>
                )}
                {confirmRemoveKey === studentKey(course.name, st.id) ? (
                  <div style={{ display:"flex", gap:6, flexShrink:0 }}>
                    <button aria-label={`${st.name} endgültig entfernen`}
                      style={{ ...S.btnSm("red"), padding:"11px 13px" }}
                      onClick={() => { removeStudent(course.name, st.id); setConfirmRemoveKey(null); }}>
                      <Icon name="check" size={13} color={C.red} />
                    </button>
                    <button aria-label="Entfernen abbrechen"
                      style={{ ...S.btnSm("ghost"), padding:"11px 13px" }} onClick={() => setConfirmRemoveKey(null)}>
                      <Icon name="x" size={13} color={C.textDim} />
                    </button>
                  </div>
                ) : (
                  /* 22x26pt direkt neben dem Umbenennen-Ziel — jetzt 44pt und mit Abstand. */
                  <button aria-label={`${st.name} entfernen`}
                    style={{ background:"none", border:"none", cursor:"pointer", padding:15, flexShrink:0, WebkitAppearance:"none" }}
                    onClick={() => setConfirmRemoveKey(studentKey(course.name, st.id))}>
                    <Icon name="trash" size={14} color={C.textDim} />
                  </button>
                )}
              </div>
            ))}
            {addingToCourse === course.name ? (
              <div style={{ display:"flex", gap:6, padding:"8px 0" }}>
                <input
                  autoFocus
                  aria-label="Name des neuen Schülers" {...inputFocus}
                  placeholder="Vorname Nachname"
                  value={addStudentValue}
                  onChange={e => setAddStudentValue(e.target.value)}
                  onKeyDown={e => {
                    if (e.key === "Enter") { addStudent(course.name, addStudentValue); setAddStudentValue(""); }
                    if (e.key === "Escape") { setAddingToCourse(null); setAddStudentValue(""); }
                  }}
                  style={{ flex:1, fontSize:15, padding:"11px 9px", background:C.surface, border:`1px solid ${C.border}`, borderRadius:6, color:C.text, outline:"none" }}
                />
                <button aria-label="Schüler hinzufügen" style={S.btnSm("primary")} onClick={() => { addStudent(course.name, addStudentValue); setAddStudentValue(""); }}>
                  <Icon name="check" size={13} color={C.onFill} />
                </button>
                <button aria-label="Abbrechen" style={S.btnSm("ghost")} onClick={() => { setAddingToCourse(null); setAddStudentValue(""); }}>
                  <Icon name="x" size={13} color={C.textDim} />
                </button>
              </div>
            ) : (
              <button style={{ background:"none", border:"none", color:C.accent, fontSize:15, fontWeight:600, padding:"13px 0", cursor:"pointer", WebkitAppearance:"none" }}
                onClick={() => { setAddingToCourse(course.name); setAddStudentValue(""); }}>
                + Schüler hinzufügen
              </button>
            )}
            <button style={{ ...S.btnSm("ghost"), display:"flex", alignItems:"center", gap:6, width:"100%", justifyContent:"center", margin:"4px 0 12px" }}
              onClick={() => { setActiveCourse(course.name); setImportText(""); setShowImport(true); }}>
              <Icon name="upload" size={13} color={C.textDim} /> Ganze Liste importieren
            </button>
          </div>
          )}
        </div>
        );
      })}
    </div>
  );

  // ── RENDER: OVERVIEW tab ─────────────────────────────────────────────────

  const renderOverview = () => {
    const totalObs  = observations.filter(isRating).length;
    const thisWeek  = observations.filter(o => {
      if (!isRating(o)) return false;
      const diff = (new Date() - new Date(o.date)) / (1000*60*60*24);
      return diff <= 7;
    }).length;
    const totalCourses = courses.filter(c => c.criteriaType !== "none").length;

    return (
      <div style={S.page}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
          <h2 style={{ fontSize:20, fontWeight:700, margin:0 }}>Übersicht</h2>
          <button style={{ ...S.btnSm("primary"), display:"flex", alignItems:"center", gap:4 }}
            onClick={() => { setShowExport(true); setCopyOK(false); }}>
            <Icon name="download" size={13} color={C.onFill} /> Export
          </button>
        </div>

        <div style={{ display:"flex", gap:8, marginBottom:20 }}>
          <div style={S.statCard}>
            <div style={{ fontSize:28, fontWeight:700 }}>{totalObs}</div>
            <div style={{ fontSize:13, color:C.textDim, marginTop:2 }}>Beobachtungen</div>
          </div>
          <div style={S.statCard}>
            <div style={{ fontSize:28, fontWeight:700 }}>{thisWeek}</div>
            <div style={{ fontSize:13, color:C.textDim, marginTop:2 }}>Diese Woche</div>
          </div>
          <div style={S.statCard}>
            <div style={{ fontSize:28, fontWeight:700 }}>{totalCourses}</div>
            <div style={{ fontSize:13, color:C.textDim, marginTop:2 }}>Kurse</div>
          </div>
        </div>

        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8 }}>
          <div style={S.sectionLbl}>Pro Kurs — Beobachtungsstand</div>
          <button onClick={() => setGradesVisible(v => !v)}
            aria-label={gradesVisible ? "Notenvorschläge verdecken" : "Notenvorschläge aufdecken"}
            style={{ display:"flex", alignItems:"center", gap:6, background:"none",
                     border:`1px solid ${C.border}`, borderRadius:20, padding:"9px 13px",
                     fontSize:13, color:C.textDim, cursor:"pointer", WebkitAppearance:"none", flexShrink:0 }}>
            <Icon name="eye" size={14} color={C.textDim} />
            {gradesVisible ? "Noten verdecken" : "Noten zeigen"}
          </button>
        </div>

        {courses.filter(c => c.criteriaType !== "none").map(course => {
          const cObs    = obsForCourse(course.name).filter(isRating);
          const readyCount = course.students.filter(st => getObsProgress(course.name, st.id).ready).length;
          const totalSt = course.students.length;
          const pct = totalSt > 0 ? Math.round((readyCount / totalSt) * 100) : 0;
          const open = openStats === course.name;

          return (
            <div key={course.name} style={{ ...S.courseCard(false), cursor:"default", marginBottom:10, padding:0, overflow:"hidden" }}>
              <button aria-expanded={open}
                onClick={() => setOpenStats(open ? null : course.name)}
                style={{ display:"block", width:"100%", textAlign:"left", background:"none",
                         border:"none", padding:"14px 16px", cursor:"pointer", WebkitAppearance:"none" }}>
                <span style={{ display:"flex", justifyContent:"space-between", marginBottom:8, gap:8 }}>
                  <span style={{ ...S.courseTitle, color:C.text }}>{course.name}</span>
                  <span style={{ fontSize:15, fontWeight:700, color:C.accent, flexShrink:0 }}>
                    {cObs.length} Eintr. {open ? "▾" : "▸"}
                  </span>
                </span>

                <span style={{ display:"flex", justifyContent:"space-between", marginBottom:5 }}>
                  <span style={{ fontSize:15, color:C.textDim }}>
                    {readyCount}/{totalSt} Schüler bereit für Notenvorschlag
                  </span>
                  <span style={{ fontSize:15, color:C.textDim }}>{pct}%</span>
                </span>
                <span style={{ display:"block", height:6, background:C.border, borderRadius:3, overflow:"hidden" }}>
                  <span style={{ display:"block", height:"100%", width:`${pct}%`, background:pct===100?C.green:C.accent, borderRadius:3, transition:"width 0.3s" }} />
                </span>
              </button>

              {open && (
              <div style={{ padding:"0 16px 14px" }}>
                {course.students.map(st => {
                  const prog   = getObsProgress(course.name, st.id);
                  const grade  = getGradeProposal(course.name, st.id);
                  return (
                    <div key={st.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"9px 0", borderBottom:`1px solid ${C.border}` }}>
                      <span style={{ fontSize:15, color:C.text, flex:1 }}>{st.name}</span>
                      <span style={{ fontSize:13, color:C.textDim, marginRight:10 }}>
                        {prog.count} Eintr. / {prog.days} Tage
                      </span>
                      {grade ? (
                        gradesVisible ? (
                          <span style={{ fontSize:13, fontWeight:700, color:grade.color, minWidth:52, textAlign:"right" }}>
                            Note {grade.grade}
                          </span>
                        ) : (
                          <span style={{ fontSize:13, fontWeight:700, color:C.textMuted, minWidth:52, textAlign:"right", letterSpacing:"0.1em" }}>
                            ····
                          </span>
                        )
                      ) : (
                        <span style={{ fontSize:13, color:C.textMuted, minWidth:52, textAlign:"right" }}>
                          {(() => {
                            const needEntries = MIN_ENTRIES - prog.count;
                            const needDays    = MIN_DAYS - prog.days;
                            if (needEntries > 0 && needDays > 0) return `noch ${needEntries} · ${needDays}T`;
                            if (needEntries > 0) return `noch ${needEntries}`;
                            return `${needDays}T fehlt`;
                          })()}
                        </span>
                      )}
                    </div>
                  );
                })}
                <div style={{ fontSize:13, color:C.textMuted, marginTop:8 }}>
                  Notenvorschlag ab {MIN_ENTRIES} Einträgen / {MIN_DAYS} verschiedenen Tagen · Pädagogische Einschätzung der Lehrkraft entscheidet.
                </div>
              </div>
              )}
            </div>
          );
        })}

        <div style={S.sectionLbl}>Letzte 10 Einträge</div>
        {observations.length === 0 && (
          <div style={{ textAlign:"center", padding:"32px 0", color:C.textDim, fontSize:15 }}>
            Noch keine Einträge — starte eine Stunde!
          </div>
        )}
        {[...observations].reverse().slice(0,10).map(obs => {
          const course  = courses.find(c => c.name === obs.course);
          const student = course?.students.find(st => st.id === obs.studentId);
          const crit    = getCriteria(obs.course).find(c => c.id === obs.criterionId);
          return (
            <div key={obs.id} style={{ ...S.row, flexDirection:"column", alignItems:"flex-start", gap:3 }}>
              <div style={{ display:"flex", justifyContent:"space-between", width:"100%" }}>
                <span style={{ fontSize:15, fontWeight:600 }}>{student?.name || "?"}</span>
                <span style={{ fontSize:13, color:C.textDim }}>{obs.date} {obs.time}</span>
              </div>
              <div style={{ fontSize:13, color:C.textDim }}>
                {obs.course} · {crit?.short
                  || (obs.criterionId === "note" ? "Notiz"
                    : obs.criterionId === "skip" ? "heute nichts beobachtet"
                    : obs.criterionId)}
                {/* Only real ratings carry gut/schwach — a note is stored with "+"
                    and would otherwise read as praise. */}
                {isRating(obs) && <>
                  {" · "}
                  <span style={{ color:obs.rating==="+"?C.green:C.red, fontWeight:600 }}>
                    {obs.rating==="+"?"gut":"schwach"}
                  </span>
                </>}
                {obs.note && <span style={{ color:C.textMuted }}> — {obs.note}</span>}
              </div>
            </div>
          );
        })}
      </div>
    );
  };

  // ── RENDER: SETTINGS tab ─────────────────────────────────────────────────

  // ── RENDER: KLASSENBUCH ──────────────────────────────────────────────────

  const [logbookAll,    setLogbookAll]    = useState(false);
  const [logbookCourse, setLogbookCourse] = useState(null);  // null = alle Kurse

  const fmtLogDate = (d) => {
    const dt = new Date(`${d}T12:00:00`);
    return `${DAYS[dt.getDay()].slice(0,2)} ${String(dt.getDate()).padStart(2,"0")}.${String(dt.getMonth()+1).padStart(2,"0")}.`;
  };

  const renderLogbook = () => {
    // A lesson counts as held if anything at all was recorded for it.
    const keys = new Set([
      ...Object.keys(topics), ...Object.keys(absences), ...Object.keys(homework),
      ...observations.map(o => `${o.date}_${o.course}`),
    ]);
    const cutoff = new Date(Date.now() - 7*86400000).toISOString().slice(0,10);
    const rows = [...keys].map(k => {
      const i = k.indexOf("_");
      const date = k.slice(0, i), course = k.slice(i+1);
      const c = courses.find(x => x.name === course);
      const absentNames = (absences[k] || [])
        .map(id => c?.students.find(s => s.id === id)?.name)
        .filter(Boolean);
      const hw = homework[k];
      const missing = hw ? Object.values(hw).filter(v => v !== "done").length : 0;
      return {
        key:k, date, course, topic: topics[k] || "", absentNames,
        hwText: !hw ? null : missing === 0 ? "HA vollständig" : `HA: ${missing}× unvollständig`,
        obsCount: observations.filter(o => o.date === date && o.course === course && isRating(o)).length,
      };
    })
    .filter(r => logbookAll || r.date >= cutoff)
    .filter(r => !logbookCourse || r.course === logbookCourse)
    .sort((a,b) => a.key < b.key ? 1 : -1);

    // A Klassenbuch is kept per course, so group by course and start each group on
    // its own sheet when printing. One print then yields one page per course.
    const groups = [];
    rows.forEach(r => {
      const g = groups.find(x => x.course === r.course);
      if (g) g.rows.push(r); else groups.push({ course: r.course, rows: [r] });
    });
    groups.sort((a,b) => a.course.localeCompare(b.course, "de"));

    const withData = [...new Set([...keys].map(k => k.slice(k.indexOf("_")+1)))]
      .sort((a,b) => a.localeCompare(b, "de"));

    return (
      <div style={S.page} className="print-doc">
        <div className="no-print" style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
          <button style={{ background:"none", border:"none", color:C.accent, fontSize:15, fontWeight:600, cursor:"pointer", padding:0, WebkitAppearance:"none" }}
            onClick={() => setPage("settings")}>← Zurück</button>
          <button style={S.btnSm("primary")} onClick={() => window.print()}>Drucken / PDF</button>
        </div>

        <h2 style={{ fontSize:20, fontWeight:700, margin:"8px 0 2px" }}>
          Klassenbuch{logbookCourse ? ` · ${logbookCourse}` : ""}
        </h2>
        <div style={{ fontSize:13, color:C.textDim, marginBottom:14 }}>
          {logbookAll ? "Alle erfassten Stunden" : "Letzte 7 Tage"} · Philipp Tran-Huynh · Gymnasium Grootmoor
        </div>

        <div className="no-print" style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
          {[null, ...withData].map(c => (
            <button key={c || "alle"} onClick={() => setLogbookCourse(c)}
              style={{ background: logbookCourse === c ? C.accentSoft : C.card,
                       border:`1px solid ${logbookCourse === c ? C.accent : C.border}`,
                       color: logbookCourse === c ? C.accent : C.textDim,
                       borderRadius:20, padding:"5px 11px", fontSize:13,
                       fontWeight: logbookCourse === c ? 600 : 400,
                       cursor:"pointer", WebkitAppearance:"none" }}>
              {c || "Alle Kurse"}
            </button>
          ))}
        </div>

        <button className="no-print" style={{ ...S.btnSm("ghost"), marginBottom:16 }}
          onClick={() => setLogbookAll(v => !v)}>
          {logbookAll ? "Nur letzte 7 Tage" : "Alle Stunden zeigen"}
        </button>

        {rows.length === 0 && (
          <div style={{ textAlign:"center", padding:"40px 0", color:C.textDim, fontSize:15 }}>
            {logbookCourse ? `Für ${logbookCourse} ist hier noch nichts erfasst.` : "Noch keine Stunden erfasst."}
          </div>
        )}

        {groups.map(g => (
          <div key={g.course} className="logbook-group" style={{ marginBottom:22 }}>
            <div style={{ fontSize:15, fontWeight:700, color:C.accent, paddingBottom:6,
                          borderBottom:`2px solid ${C.border}`, marginBottom:2 }}>
              {g.course}
              <span style={{ fontWeight:400, color:C.textDim, fontSize:13 }}> · {g.rows.length} Stunden</span>
            </div>
            {g.rows.map(r => (
              <div key={r.key} className="logbook-row"
                style={{ padding:"10px 0", borderBottom:`1px solid ${C.border}` }}>
                <div style={{ display:"flex", justifyContent:"space-between", gap:10, marginBottom:2 }}>
                  <span style={{ fontSize:15, fontWeight:700 }}>{fmtLogDate(r.date)}</span>
                  <span style={{ fontSize:13, color:C.textDim, flexShrink:0 }}>
                    {r.obsCount > 0 ? `${r.obsCount} Beob.` : ""}
                  </span>
                </div>
                <div style={{ fontSize:15, marginBottom:3 }}>
                  {r.topic || <span style={{ color:C.textMuted, fontStyle:"italic" }}>kein Thema eingetragen</span>}
                </div>
                <div style={{ fontSize:13, color:C.textDim }}>
                  {r.absentNames.length ? `Fehlend: ${r.absentNames.join(", ")}` : "Vollzählig"}
                  {r.hwText ? ` · ${r.hwText}` : ""}
                </div>
              </div>
            ))}
          </div>
        ))}
      </div>
    );
  };

  const renderSettings = () => (
    <div style={S.page}>
      <h2 style={{ fontSize:20, fontWeight:700, margin:"0 0 16px" }}>Einstellungen</h2>

      {/* BACKUP — wichtigste Sektion ganz oben */}
      <div style={{ background:C.accentSoft, border:`1px solid ${C.accent}`, borderRadius:12, padding:"14px 16px", marginBottom:8 }}>
        <div style={{ fontSize:13, color:C.accent, fontWeight:700, letterSpacing:"0.06em", marginBottom:4 }}>DATENSICHERUNG</div>
        <div style={{ fontSize:15, color:C.text, marginBottom:8, lineHeight:"1.6" }}>
          Einmal pro Woche sichern — schützt vor Datenverlust bei App-Updates oder Browser-Cache-Löschung.
        </div>
        <div style={{ fontSize:13, color:C.textDim, marginBottom:12 }}>
          Sicherungs-Erinnerung: {lastAutoBackup
            ? `zuletzt vor ${Math.floor((Date.now()-new Date(lastAutoBackup).getTime())/86400000)} Tag(en) — alle 4–7 Tage erscheint auf der Startseite ein Hinweis zum Antippen`
            : "erscheint auf der Startseite, sobald Beobachtungen erfasst sind"}
        </div>
        <button style={{ ...S.btn("primary"), marginTop:0 }} onClick={exportBackup}>
          <span style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
            <Icon name="download" size={16} color={C.onFill} /> Backup herunterladen (.json)
          </span>
        </button>
        <div style={{ ...S.sectionLbl, marginTop:16 }}>Backup wiederherstellen</div>
        <div style={{ fontSize:13, color:C.textDim, marginBottom:8 }}>
          Backup-Datei auswählen — alle aktuellen Daten werden ersetzt.
        </div>
        <label style={{ display:"block", background:"transparent", border:`1px solid ${C.border}`, borderRadius:10, padding:"13px 20px", fontSize:15, fontWeight:600, color:C.text, cursor:"pointer", textAlign:"center", marginTop:0 }}>
          <Icon name="upload" size={16} color={C.textDim} /> Backup importieren
          <input type="file" accept=".json" style={{ display:"none" }}
            onChange={e => importBackup(e.target.files[0])} />
        </label>
        {backupImportOK && (
          <div style={{ fontSize:13, color:C.green, marginTop:8, fontWeight:600 }}>✓ Backup erfolgreich wiederhergestellt!</div>
        )}
        {backupError && (
          <div style={{ fontSize:13, color:C.red, marginTop:8 }}>{backupError}</div>
        )}
      </div>

      <div style={S.sectionLbl}>Klassenbuch</div>
      <button style={{ ...S.btn("ghost"), display:"flex", alignItems:"center", justifyContent:"center", gap:8, marginTop:0 }}
        onClick={() => setPage("logbook")}>
        <Icon name="chart" size={16} color={C.textDim} /> Stunden-Übersicht (Thema · Fehlende · HA)
      </button>
      <button style={{ ...S.btn("ghost"), display:"flex", alignItems:"center", justifyContent:"center", gap:8, marginTop:8 }}
        onClick={() => {
          setShowBackfill(true);
          setBackfillCourse(null);
          setBackfillDate(dateKey(new Date(Date.now() - 86400000)));
          setBackfillAbsent([]);
          setBackfillTopic("");
        }}>
        <Icon name="users" size={16} color={C.textDim} /> Stunde nachtragen (z.B. bei Vertretung)
      </button>

      <div style={S.sectionLbl}>CSV / PDF Export</div>
      <button style={{ ...S.btn("ghost"), display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}
        onClick={() => { setShowExport(true); setCopyOK(false); }}>
        <Icon name="download" size={16} color={C.textDim} /> Daten exportieren
      </button>

      <div style={{ ...S.sectionLbl, marginTop:24 }}>Daten zurücksetzen</div>
      <button style={{ ...S.btn("ghost"), borderColor:C.red, color:C.red }}
        onClick={() => {
          if (window.confirm("Wirklich ALLE Daten löschen? Dies kann nicht rückgängig gemacht werden.")) {
            ["obs_courses","obs_observations","obs_homework","obs_absences","obs_topics",
             "obs_session","obs_lastAutoBackup","obs_nextAutoBackupDays"].forEach(k => localStorage.removeItem(k));
            window.location.reload();
          }
        }}>
        <span style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
          <Icon name="trash" size={16} color={C.red} /> Alle Daten löschen
        </span>
      </button>

      <div style={{ ...S.sectionLbl, marginTop:24 }}>Info</div>
      <div style={{ fontSize:13, color:C.textDim, lineHeight:"1.9", background:C.card, border:`1px solid ${C.border}`, borderRadius:10, padding:"14px 16px" }}>
        <strong style={{ color:C.text }}>ClassPulse — Participation Tracker v1.2.1</strong><br/>
        Daten lokal auf diesem Gerät (localStorage).<br/>
        Kein Server · kein Login · kein Tracking.<br/><br/>
        <strong style={{ color:C.text }}>Bewertungsbögen:</strong><br/>
        Englisch (8a, 12. Kl.) → Fremdsprachen-Bogen (8 Kriterien)<br/>
        Alle anderen Fächer → Allg. Grootmoor-Bogen (8 Kriterien, 3/2/3)<br/><br/>
        <strong style={{ color:C.text }}>Notenvorschlag:</strong><br/>
        Ab {MIN_ENTRIES} Einträgen / {MIN_DAYS} verschiedenen Tagen pro Schüler.<br/>
        Pädagogische Einschätzung der Lehrkraft entscheidet.<br/><br/>
        <strong style={{ color:C.text }}>Gewichtung:</strong><br/>
        60% sonstige Leistungen / 40% schriftlich
      </div>

      <div style={{ ...S.sectionLbl, marginTop:24 }}>PDF-Export für Gespräche</div>
      <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:10, padding:"14px 16px" }}>
        <div style={{ fontSize:13, color:C.text, fontWeight:600, marginBottom:6 }}>
          Schöne Schüler-PDFs zum Halbjahr:
        </div>
        <div style={{ fontSize:13, color:C.textDim, lineHeight:"2" }}>
          1. Hier: „Backup herunterladen“ → .json Datei<br/>
          2. GitHub Repo: CLASSPULSE_PDF_RULES.md herunterladen<br/>
          3. Claude Momentum-Chat öffnen<br/>
          4. Beide Dateien hochladen<br/>
          5. Schreiben: „Erstell mir die ClassPulse PDF-Exports“<br/>
          6. PDF herunterladen — fertig
        </div>
        <div style={{ fontSize:13, color:C.textMuted, marginTop:8, paddingTop:8, borderTop:`1px solid ${C.border}` }}>
          GitHub: glowgiver/classpulse · classpulse_export.py + CLASSPULSE_PDF_RULES.md
        </div>
      </div>

      <div style={{ ...S.sectionLbl, marginTop:24 }}>PWA-Installation (iPhone)</div>
      <div style={{ fontSize:13, color:C.textDim, lineHeight:"1.9", background:C.card, border:`1px solid ${C.border}`, borderRadius:10, padding:"14px 16px" }}>
        Safari öffnen → Teilen-Symbol (□↑) → „Zum Home-Bildschirm“ → Hinzufügen.<br/>
        App läuft dann vollbildig und offline.
      </div>
    </div>
  );

  // ── RENDER: IMPORT MODAL ─────────────────────────────────────────────────

  const renderImportModal = () => (
    <div style={S.modal} onClick={() => setShowImport(false)}>
      <div style={S.modalInner} onClick={e => e.stopPropagation()}>
        <h3 style={{ fontSize:20, fontWeight:700, marginBottom:4 }}>Schülerliste importieren</h3>
        <p style={{ fontSize:15, color:C.textDim, marginBottom:12 }}>
          {activeCourse} — ein Name pro Zeile (aus IServ kopieren)
        </p>
        <textarea style={S.textarea} {...inputFocus} value={importText} onChange={e => setImportText(e.target.value)}
          placeholder={"Max Mustermann\nErika Musterfrau\nAli Yilmaz\n…"} autoFocus />
        <div style={{ fontSize:13, color:C.textDim, marginTop:6, marginBottom:12 }}>
          {importText.split("\n").filter(l=>l.trim()).length} Namen erkannt
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <button style={S.btn("ghost")} onClick={() => setShowImport(false)}>Abbrechen</button>
          <button style={S.btn("primary")} onClick={() => importStudents(activeCourse)}>
            Importieren
          </button>
        </div>
      </div>
    </div>
  );

  // ── RENDER: ANWESENHEITS-SHEET ───────────────────────────────────────────

  const renderAttendanceModal = () => {
    const course = courses.find(c => c.name === activeCourse);
    if (!course) return null;
    const absentIds = absences[`${today}_${activeCourse}`] || [];
    return (
      <div style={S.modal} onClick={() => setShowAttendance(false)}>
        <div style={S.modalInner} onClick={e => e.stopPropagation()}>
          <h3 style={{ fontSize:20, fontWeight:700, marginBottom:4 }}>Anwesenheit</h3>
          <p style={{ fontSize:15, color:C.textDim, marginBottom:14 }}>
            {activeCourse} · Antippen = fehlt, nochmal = wieder da
          </p>
          {course.students.map(st => {
            const absent = absentIds.includes(st.id);
            return (
              <button key={st.id} onClick={() => toggleAbsentToday(st.id)}
                style={{ ...S.row, width:"100%", textAlign:"left", cursor:"pointer",
                         WebkitAppearance:"none",
                         background: absent ? C.redSoft : C.card,
                         borderColor: absent ? C.red : C.border }}>
                <span style={{ fontSize:15, fontWeight:500, color: absent ? C.red : C.text }}>{st.name}</span>
                <span style={{ fontSize:13, fontWeight:700, color: absent ? C.red : C.textDim }}>
                  {absent ? "fehlt" : "da"}
                </span>
              </button>
            );
          })}
          <button style={S.btn("primary")} onClick={() => setShowAttendance(false)}>Fertig</button>
        </div>
      </div>
    );
  };

  // ── RENDER: STUNDE NACHTRAGEN ────────────────────────────────────────────
  // Eigenständig von activeCourse/sessionPhase, damit ein Nachtrag die laufende
  // Live-Session nicht stört und für jeden vergangenen Tag möglich ist.

  const renderBackfillModal = () => {
    const todayKey = dateKey();

    // Schritt 1: Tag und Kurs wählen.
    if (!backfillCourse) {
      return (
        <div style={S.modal} onClick={() => setShowBackfill(false)}>
          <div style={S.modalInner} onClick={e => e.stopPropagation()}>
            <h3 style={{ fontSize:20, fontWeight:700, marginBottom:4 }}>Stunde nachtragen</h3>
            <p style={{ fontSize:15, color:C.textDim, marginBottom:14 }}>
              Für welchen Tag und welchen Kurs?
            </p>
            <input type="date" value={backfillDate} max={todayKey}
              onChange={e => setBackfillDate(e.target.value)}
              style={{ width:"100%", padding:"12px 11px", background:C.surface, border:`1px solid ${C.border}`,
                       borderRadius:8, color:C.text, fontSize:15, outline:"none", marginBottom:14,
                       boxSizing:"border-box" }} />
            {COURSES_META.filter(c => c.criteriaType !== "none").map((c,i) => (
              <button key={i} style={{ ...S.row, width:"100%", textAlign:"left", cursor:"pointer", WebkitAppearance:"none" }}
                onClick={() => openBackfill(c.name, backfillDate)}>
                <span style={{ ...S.courseTitle, color:C.text }}>{c.name}</span>
              </button>
            ))}
            <button style={{ ...S.btn("ghost"), marginTop:8 }} onClick={() => setShowBackfill(false)}>Abbrechen</button>
          </div>
        </div>
      );
    }

    // Schritt 2: Anwesenheit und Thema für den gewählten Tag/Kurs.
    const course = courses.find(c => c.name === backfillCourse);
    if (!course) return null;
    return (
      <div style={S.modal} onClick={() => setShowBackfill(false)}>
        <div style={S.modalInner} onClick={e => e.stopPropagation()}>
          <button style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", fontSize:13, padding:0, marginBottom:8 }}
            onClick={() => setBackfillCourse(null)}>← Anderer Tag/Kurs</button>
          <h3 style={{ fontSize:20, fontWeight:700, marginBottom:4 }}>{backfillCourse}</h3>
          <p style={{ fontSize:15, color:C.textDim, marginBottom:14 }}>
            {fmtLogDate(backfillDate)} · Antippen = fehlt
          </p>

          <input value={backfillTopic} onChange={e => setBackfillTopic(e.target.value)}
            placeholder="Thema dieser Stunde (optional)" {...inputFocus}
            style={{ width:"100%", padding:"12px 11px", background:C.surface, border:`1px solid ${C.border}`,
                     borderRadius:8, color:C.text, fontSize:15, outline:"none", marginBottom:14,
                     boxSizing:"border-box" }} />

          {course.students.map(st => {
            const absent = backfillAbsent.includes(st.id);
            return (
              <button key={st.id} onClick={() => toggleBackfillAbsent(st.id)}
                style={{ ...S.row, width:"100%", textAlign:"left", cursor:"pointer",
                         WebkitAppearance:"none",
                         background: absent ? C.redSoft : C.card,
                         borderColor: absent ? C.red : C.border }}>
                <span style={{ fontSize:15, fontWeight:500, color: absent ? C.red : C.text }}>{st.name}</span>
                <span style={{ fontSize:13, fontWeight:700, color: absent ? C.red : C.textDim }}>
                  {absent ? "fehlt" : "da"}
                </span>
              </button>
            );
          })}
          <button style={S.btn("primary")} onClick={saveBackfill}>Speichern</button>
        </div>
      </div>
    );
  };

  // ── SESSION ROUTER ───────────────────────────────────────────────────────

  const renderSession = () => {
    if (!activeCourse) return renderHome();
    switch(sessionPhase) {
      case "absent":   return renderAbsent();
      case "homework": return renderHomework();
      case "observe":  return renderObserve();
      default:         return renderHome();
    }
  };

  // ── LAYOUT ───────────────────────────────────────────────────────────────

  return (
    <div style={S.app}>
      {/* Header */}
      <div style={S.header} className="no-print">
        <div>
          <div style={S.logo}>ClassPulse</div>
          <div style={S.subtitle}>
            {DAYS[new Date().getDay()]} · {new Date().toLocaleDateString("de-DE")}
            {activeCourse && sessionPhase !== "select" && ` · ${activeCourse}`}
          </div>
        </div>
        {activeCourse && sessionPhase !== "select" && (
          <button style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", padding:"4px 8px", fontSize:15 }}
            aria-label="Stunde beenden" onClick={goHome}>✕</button>
        )}
      </div>

      {/* Page content */}
      {page==="home"     ? renderSession()  :
       page==="students" ? renderStudents() :
       page==="overview" ? renderOverview() :
       page==="logbook"  ? renderLogbook()  :
       renderSettings()}

      {/* Import modal */}
      {showImport && renderImportModal()}

      {/* Anwesenheit nachtragen (laufende Stunde) */}
      {showAttendance && activeCourse && renderAttendanceModal()}

      {/* Stunde nachtragen (vergangener Tag, z.B. Vertretung) */}
      {showBackfill && renderBackfillModal()}

      {/* Export modal */}
      {showExport && (
        <div style={S.modal} onClick={() => setShowExport(false)}>
          <div style={S.modalInner} onClick={e => e.stopPropagation()}>
            <h3 style={{ fontSize:20, fontWeight:700, marginBottom:4 }}>Export</h3>
            <p style={{ fontSize:15, color:C.textDim, marginBottom:20 }}>
              Datei direkt herunterladen — Excel öffnet sie sauber mit allen Spalten.
            </p>

            {/* Pro-Kurs Download */}
            <div style={S.sectionLbl}>Pro Kurs</div>
            {courses.filter(c => c.criteriaType !== "none").map(course => {
              const courseObs = obsForCourse(course.name);
              return (
                <button key={course.name} style={{ ...S.row, width:"100%", textAlign:"left", cursor:"pointer", WebkitAppearance:"none" }}
                  onClick={() => downloadCsv(
                    courseCsvBlock(course),
                    `ClassPulse_${course.name.replace(/[\s.]/g,"_")}_${new Date().toISOString().slice(0,10)}.csv`
                  )}>
                  <span>
                    <span style={{ display:"block", fontSize:15, fontWeight:600 }}>{course.name}</span>
                    <span style={{ display:"block", fontSize:15, color:C.textDim }}>
                      {courseObs.length} Einträge · {course.students.length} Schüler
                    </span>
                  </span>
                  <span style={{ display:"flex", alignItems:"center", gap:6, color:C.accent, fontSize:15, fontWeight:600 }}>
                    <Icon name="download" size={15} color={C.accent} /> .csv
                  </span>
                </button>
              );
            })}

            {/* Gesamt-Export */}
            <div style={{ ...S.sectionLbl, marginTop:20 }}>Alle Kurse zusammen</div>
            <button style={S.btn("primary")} onClick={() => {
              const lines = ["ClassPulse Export \u2014 " + new Date().toLocaleDateString("de-DE")];
              courses.filter(c => c.criteriaType !== "none").forEach(course => {
                lines.push(`\r\n=== ${course.name} ===`);
                lines.push(...courseCsvBlock(course));
              });
              downloadCsv(lines, `ClassPulse_Alle_Kurse_${new Date().toISOString().slice(0,10)}.csv`);
            }}>
              <span style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
                <Icon name="download" size={16} color={C.onFill} /> Alle Kurse herunterladen
              </span>
            </button>

            <button style={{ ...S.btn("ghost"), marginTop:8 }} onClick={() => setShowExport(false)}>Schließen</button>
          </div>
        </div>
      )}

      {/* Kriterien Info-Modal */}
      {infoCrit && (
        <div style={S.modal} onClick={() => setInfoCrit(null)}>
          <div style={S.modalInner} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize:13, color:C.accent, fontWeight:700, letterSpacing:"0.06em", marginBottom:6 }}>
              {infoCrit.area}
            </div>
            <h3 style={{ fontSize:20, fontWeight:700, marginBottom:8 }}>{infoCrit.short}</h3>
            <p style={{ fontSize:15, color:C.textDim, lineHeight:"1.6", marginBottom:16 }}>
              {infoCrit.full}
            </p>
            {infoCrit.examples && (
              <>
                <div style={{ fontSize:13, fontWeight:700, color:C.textDim, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:8 }}>
                  Beispiele im Unterricht
                </div>
                {infoCrit.examples.map((ex, i) => (
                  <div key={i} style={{
                    display:"flex", alignItems:"flex-start", gap:8,
                    padding:"8px 12px", background:C.surface, borderRadius:8,
                    marginBottom:6, fontSize:15, color:C.text, lineHeight:"1.4",
                  }}>
                    <span style={{ color:C.accent, fontWeight:700, flexShrink:0 }}>→</span>
                    <span>{ex}</span>
                  </div>
                ))}
              </>
            )}
            <button style={{ ...S.btn("ghost"), marginTop:12 }} onClick={() => setInfoCrit(null)}>
              Schließen
            </button>
          </div>
        </div>
      )}

      {/* Undo toast — kompakt, eine Zeile, über Nav und über jedem Sheet */}
      {lastAction && !typing && (
        <div style={{
          position:"fixed",
          bottom:`calc(66px + env(safe-area-inset-bottom))`,
          left:12, right:12,
          background:"rgba(26,29,39,0.96)",
          border:`1px solid ${C.accent}`,
          borderRadius:10,
          padding:"8px 10px 8px 14px",
          display:"flex",
          alignItems:"center",
          justifyContent:"space-between",
          gap:8,
          zIndex:250,
          boxShadow:"0 4px 16px rgba(0,0,0,0.5)",
        }}>
          <div style={{ flex:1, minWidth:0, display:"flex", alignItems:"center", gap:8 }}>
            <span style={{ fontSize:13, color:C.accent, fontWeight:700, flexShrink:0 }}>✓</span>
            <span style={{ fontSize:13, fontWeight:500, color:C.text, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
              {lastAction.description}
            </span>
          </div>
          <button
            onClick={performUndo}
            style={{
              background:"transparent", color:C.accent, border:`1px solid ${C.accent}`,
              borderRadius:7, padding:"5px 12px", fontSize:13, fontWeight:700,
              cursor:"pointer", WebkitAppearance:"none", flexShrink:0,
            }}>
            ↶ Undo
          </button>
        </div>
      )}

      {/* Bottom nav — verschwindet, solange die Tastatur offen ist */}
      <div style={{ ...S.nav, display: typing ? "none" : "flex" }} className="no-print">
        {[
          { id:"home",     icon:"home",     label:"Stunde" },
          { id:"students", icon:"users",    label:"Kurse"  },
          { id:"overview", icon:"chart",    label:"Stand"  },
          { id:"settings", icon:"settings", label:"Mehr"   },
        ].map(tab => (
          <button key={tab.id} style={S.navBtn(page===tab.id)}
            onClick={() => setPage(tab.id)}>
            <Icon name={tab.icon} size={22} color={page===tab.id?C.accent:C.textDim} />
            {tab.label}
          </button>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
const renderApp = () => root.render(React.createElement(App, { theme: prefersLight() ? "light" : "dark" }));
renderApp();

// Wer mitten in der Stunde vom Fenster wegtritt, soll nicht neu laden müssen.
// Drei Auslöser, weil iOS das change-Event einer PWA im Hintergrund verschluckt:
// die Medienabfrage selbst, die Rückkehr in die App, und der Fensterfokus.
let themeIs = prefersLight() ? "light" : "dark";
const syncTheme = () => {
  const now = prefersLight() ? "light" : "dark";
  if (now === themeIs) return;
  themeIs = now;
  applyTheme();
  renderApp();
};
try {
  window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", syncTheme);
} catch(e) {}
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncTheme(); });
window.addEventListener("focus", syncTheme);
</script>

<script>
// ─── SERVICE WORKER REGISTRATION ────────────────────────────────────────────
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(reg => console.log("SW registered:", reg.scope))
      .catch(err => console.warn("SW registration failed:", err));
  });
}
</script>
</body>
</html>
